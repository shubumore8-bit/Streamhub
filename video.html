<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DesiVexa — Video</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#05070d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:60px;
  background:#0b0f18;
  border-bottom:1px solid #1c2230;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:10;
}

.logo{
  color:#ff1744;
  font-size:25px;
  font-weight:900;
}

.homeBtn{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  text-decoration:none;
  color:#fff;
  background:#151b27;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:15px 12px 40px;
}

.playerBox{
  width:100%;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1a2130;
}

video{
  width:100%;
  display:block;
  max-height:680px;
  background:#000;
}

.videoInfo{
  padding:15px 2px;
}

.videoTitle{
  font-size:21px;
  font-weight:800;
  line-height:1.35;
}

.videoMeta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  color:#9098a8;
  font-size:13px;
}

.category{
  color:#ff1744;
  background:#160a0e;
  padding:5px 9px;
  border-radius:6px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.actionBtn{
  border:0;
  background:#151b27;
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.actionBtn:hover{
  background:#202838;
}

.actionBtn.liked{
  background:#ff1744;
}

.description{
  margin-top:15px;
  padding:14px;
  background:#0c111b;
  border:1px solid #1a2130;
  border-radius:9px;
  color:#c5cad4;
  line-height:1.6;
  font-size:14px;
  white-space:pre-wrap;
}

.sectionTitle{
  font-size:20px;
  font-weight:800;
  margin:30px 0 15px;
}

.relatedGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:#0c111b;
  border:1px solid #1a2130;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#ff1744;
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  background:#151b27;
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,23,68,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.hd{
  position:absolute;
  right:7px;
  top:7px;
  background:#ff1744;
  padding:4px 6px;
  border-radius:5px;
  font-size:10px;
  font-weight:bold;
}

.cardInfo{
  padding:9px;
}

.cardTitle{
  font-size:13px;
  font-weight:bold;
  line-height:1.35;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;

  overflow:hidden;
}

.cardMeta{
  margin-top:6px;
  color:#8d95a5;
  font-size:10px;

  display:flex;
  justify-content:space-between;
  gap:5px;
}

.cardCategory{
  color:#ff1744;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:25px;
}

.pagination button{
  border:0;
  background:#151b27;
  color:#fff;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}

.pagination button.active{
  background:#ff1744;
}

.pagination button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.loading{
  text-align:center;
  color:#8d95a5;
  padding:35px 10px;
}

.error{
  text-align:center;
  padding:40px 10px;
  color:#ff667f;
}


/* =========================
   COMMENTS
========================= */

.comments{
  margin-top:35px;
  padding-bottom:20px;
}

.commentForm{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.commentInput{
  flex:1;
  min-width:0;

  background:#0c111b;

  border:1px solid #242c3b;

  color:#fff;

  border-radius:8px;

  padding:11px;

  outline:none;
}

.commentInput:focus{
  border-color:#ff1744;
}

.commentBtn{
  border:0;

  background:#ff1744;

  color:#fff;

  border-radius:8px;

  padding:0 15px;

  cursor:pointer;
}

.commentBtn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.commentList{
  margin-top:15px;
}

.comment{
  background:#0c111b;

  border:1px solid #1a2130;

  border-radius:9px;

  padding:12px;

  margin-bottom:8px;
}

.commentName{
  font-size:12px;

  font-weight:bold;

  color:#ff1744;
}

.commentText{
  margin-top:5px;

  color:#c8cdd6;

  font-size:13px;

  line-height:1.5;

  word-break:break-word;
}

.commentDate{
  margin-top:7px;

  color:#777f90;

  font-size:10px;
}

.empty{
  color:#777f90;

  padding:20px 0;

  font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .relatedGrid{
    grid-template-columns:repeat(3,1fr);
  }

}


@media(max-width:650px){

  .container{
    padding:10px 7px 30px;
  }

  .videoTitle{
    font-size:17px;
  }

  .relatedGrid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .cardTitle{
    font-size:12px;
  }

  .cardInfo{
    padding:8px;
  }

  .sectionTitle{
    font-size:18px;
  }

  .commentForm{
    flex-direction:column;
  }

  .commentBtn{
    height:42px;
  }

}

</style>

</head>


<body>


<header>

  <a
    href="index.html"
    class="homeBtn">

    ← Home

  </a>


  <div class="logo">

    DesiVexa

  </div>

</header>



<div class="container">


  <!-- =========================
       VIDEO
  ========================== -->

  <div id="videoArea">

    <div class="loading">

      Loading video...

    </div>

  </div>



  <!-- =========================
       RELATED VIDEOS
  ========================== -->

  <div class="sectionTitle">

    🎬 Related Videos

  </div>


  <div
    id="relatedVideos"
    class="relatedGrid">

  </div>


  <div
    id="relatedMessage"
    class="loading">

    Loading related videos...

  </div>


  <!-- RELATED PAGINATION -->

  <div
    id="pagination"
    class="pagination">

  </div>



  <!-- =========================
       COMMENTS
  ========================== -->

  <div
    class="comments"
    id="commentsSection">

    <div class="sectionTitle">

      💬 Comments

    </div>


    <div class="commentForm">

      <input
        id="commentInput"
        class="commentInput"
        type="text"
        maxlength="500"
        placeholder="Write a comment..."
      >


      <button
        id="commentBtn"
        class="commentBtn">

        Post

      </button>

    </div>


    <div
      id="commentList"
      class="commentList">

      <div class="empty">

        Loading comments...

      </div>

    </div>

  </div>


</div>



<script type="module">


/* =========================
   SUPABASE
========================= */

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );



/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    location.search
  );


const videoId =
  params.get("id");


const RELATED_PER_PAGE = 20;


let currentRelatedPage =
  parseInt(
    params.get("page")
  ) || 1;


if(currentRelatedPage < 1){

  currentRelatedPage = 1;

}


let currentVideo = null;



/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



function fallbackImage(){

  return "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="640"
        height="360"
        viewBox="0 0 640 360">

        <rect
          width="640"
          height="360"
          fill="#151b27"/>

        <text
          x="320"
          y="185"
          text-anchor="middle"
          fill="#ff1744"
          font-size="38"
          font-family="Arial"
          font-weight="bold">

          DesiVexa

        </text>

      </svg>

    `);

}



function timeAgo(date){

  if(!date) return "";


  const seconds =
    Math.floor(

      (
        Date.now() -
        new Date(date).getTime()
      ) / 1000

    );


  if(seconds < 60)

    return seconds + "s ago";


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60)

    return minutes + "m ago";


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24)

    return hours + "h ago";


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 30)

    return days + "d ago";


  return (
    Math.floor(days / 30) +
    "mo ago"
  );

}



/* =========================
   LOAD VIDEO
========================= */

async function loadVideo(){

  const area =
    document.getElementById(
      "videoArea"
    );


  if(!videoId){

    area.innerHTML = `

      <div class="error">

        Video not found.

      </div>

    `;

    return;

  }


  const {
    data,
    error
  } = await supabase

    .from("videos")

    .select(`
      id,
      title,
      category,
      description,
      thumbnail_url,
      video_url,
      views,
      created_at
    `)

    .eq(
      "id",
      videoId
    )

    .eq(
      "published",
      true
    )

    .maybeSingle();


  if(error){

    console.error(error);


    area.innerHTML = `

      <div class="error">

        Failed to load video.

      </div>

    `;

    return;

  }


  if(!data){

    area.innerHTML = `

      <div class="error">

        Video not found or unavailable.

      </div>

    `;

    return;

  }


  currentVideo = data;


  document.title =
    "DesiVexa — " +
    (
      data.title ||
      "Video"
    );


  const title =
    escapeHtml(
      data.title ||
      "Untitled"
    );


  const category =
    escapeHtml(
      data.category ||
      "General"
    );


  const description =
    escapeHtml(
      data.description ||
      "No description available."
    );


  const thumbnail =
    data.thumbnail_url ||
    fallbackImage();


  const views =
    Number(
      data.views || 0
    ).toLocaleString();


  area.innerHTML = `

    <div class="playerBox">

      <video
        id="mainVideo"
        controls
        playsinline
        preload="metadata"
        poster="${escapeHtml(
          thumbnail
        )}">

        <source
          src="${escapeHtml(
            data.video_url || ""
          )}"
          type="video/mp4">

        Your browser does not support
        HTML5 video.

      </video>

    </div>


    <div class="videoInfo">

      <div class="videoTitle">

        ${title}

      </div>


      <div class="videoMeta">

        <span class="category">

          ${category}

        </span>


        <span>

          👁️

          <span id="viewCount">

            ${views}

          </span>

          views

        </span>


        <span>

          •

          ${timeAgo(
            data.created_at
          )}

        </span>

      </div>


      <div class="actions">


        <button
          class="actionBtn"
          id="likeBtn">

          ❤️ Like

        </button>


        <button
          class="actionBtn"
          id="shareBtn">

          🔗 Share

        </button>


        <button
          class="actionBtn"
          id="commentScrollBtn">

          💬 Comments

        </button>


      </div>


      <div class="description">

        ${description}

      </div>

    </div>

  `;


  setupButtons();


  increaseView();


  loadRelatedVideos(
    data.category
  );

}



/* =========================
   BUTTONS
========================= */

function setupButtons(){

  const likeBtn =
    document.getElementById(
      "likeBtn"
    );


  const shareBtn =
    document.getElementById(
      "shareBtn"
    );


  const commentScrollBtn =
    document.getElementById(
      "commentScrollBtn"
    );


  likeBtn.onclick = () => {

    likeBtn.classList.toggle(
      "liked"
    );


    if(
      likeBtn.classList.contains(
        "liked"
      )
    ){

      likeBtn.textContent =
        "❤️ Liked";

    }else{

      likeBtn.textContent =
        "❤️ Like";

    }

  };


  shareBtn.onclick =
    shareVideo;


  commentScrollBtn.onclick = () => {

    document
      .getElementById(
        "commentsSection"
      )
      .scrollIntoView({
        behavior:"smooth"
      });

  };

}



/* =========================
   SHARE
========================= */

async function shareVideo(){

  const shareData = {

    title:
      currentVideo?.title ||
      "DesiVexa Video",

    text:
      "Watch this video on DesiVexa",

    url:
      location.href

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        location.href
      );


      alert(
        "Video link copied!"
      );

    }

  }catch(error){

    console.log(error);

  }

}



/* =========================
   VIEWS
========================= */

async function increaseView(){

  if(!videoId) return;


  const key =
    "desivexa_view_" +
    videoId;


  if(
    sessionStorage.getItem(
      key
    )
  ){

    return;

  }


  sessionStorage.setItem(
    key,
    "1"
  );


  const {
    data,
    error
  } = await supabase

    .from("videos")

    .select("views")

    .eq(
      "id",
      videoId
    )

    .maybeSingle();


  if(
    error ||
    !data
  ){

    console.error(error);

    return;

  }


  const newViews =
    Number(
      data.views || 0
    ) + 1;


  const {
    error:updateError
  } = await supabase

    .from("videos")

    .update({
      views:newViews
    })

    .eq(
      "id",
      videoId
    );


  if(updateError){

    console.error(
      updateError
    );

    return;

  }


  const viewCount =
    document.getElementById(
      "viewCount"
    );


  if(viewCount){

    viewCount.textContent =
      newViews.toLocaleString();

  }

}



/* =========================
   RELATED VIDEOS
========================= */

async function loadRelatedVideos(
  category
){

  const box =
    document.getElementById(
      "relatedVideos"
    );


  const message =
    document.getElementById(
      "relatedMessage"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  let query =
    supabase

      .from("videos")

      .select(`
        id,
        title,
        category,
        description,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)

      .eq(
        "published",
        true
      )

      .neq(
        "id",
        videoId
      );


  if(category){

    query =
      query.eq(
        "category",
        category
      );

  }


  const {
    data:categoryVideos,
    error:categoryError
  } = await query

    .order(
      "created_at",
      {
        ascending:false
      }
    )

    .limit(200);


  if(categoryError){

    console.error(
      categoryError
    );

  }


  let videos =
    categoryVideos || [];


  if(
    videos.length < 20
  ){

    const {
      data:otherVideos
    } = await supabase

      .from("videos")

      .select(`
        id,
        title,
        category,
        description,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)

      .eq(
        "published",
        true
      )

      .neq(
        "id",
        videoId
      )

      .order(
        "views",
        {
          ascending:false
        }
      )

      .limit(200);


    const existing =
      new Set(
        videos.map(
          v => v.id
        )
      );


    for(
      const video of
      (otherVideos || [])
    ){

      if(
        !existing.has(
          video.id
        )
      ){

        videos.push(
          video
        );

      }

    }

  }


  const total =
    videos.length;


  if(total === 0){

    message.textContent =
      "No related videos.";

    pagination.innerHTML = "";

    return;

  }


  const totalPages =
    Math.ceil(
      total /
      RELATED_PER_PAGE
    );


  if(
    currentRelatedPage >
    totalPages
  ){

    currentRelatedPage = 1;

  }


  const from =
    (
      currentRelatedPage - 1
    ) *
    RELATED_PER_PAGE;


  const pageVideos =
    videos.slice(
      from,
      from +
      RELATED_PER_PAGE
    );


  message.style.display =
    "none";


  box.innerHTML =
    pageVideos

      .map(
        relatedCard
      )

      .join("");


  renderPagination(
    totalPages
  );

}



/* =========================
   RELATED CARD
========================= */

function relatedCard(video){

  const title =
    escapeHtml(
      video.title ||
      "Untitled"
    );


  const category =
    escapeHtml(
      video.category ||
      "General"
    );


  const thumbnail =
    video.thumbnail_url ||
    fallbackImage();


  const views =
    Number(
      video.views || 0
    ).toLocaleString();


  return `

    <div
      class="card"
      onclick="openRelated(
        '${encodeURIComponent(
          video.id
        )}'
      )">


      <div class="thumb">


        <img
          src="${escapeHtml(
            thumbnail
          )}"
          alt="${title}"

          onerror="
            this.onerror=null;
            this.src='${fallbackImage()}';
          "
        >


        <div class="play">

          ▶

        </div>


        <div class="hd">

          HD

        </div>


      </div>


      <div class="cardInfo">


        <div class="cardTitle">

          ${title}

        </div>


        <div class="cardMeta">

          <span
            class="cardCategory">

            ${category}

          </span>


          <span>

            ${views} views

          </span>

        </div>


        <div class="cardMeta">

          <span>

            ${timeAgo(
              video.created_at
            )}

          </span>

        </div>


      </div>


    </div>

  `;

}



/* =========================
   OPEN RELATED
========================= */

window.openRelated =
function(id){

  location.href =
    "video.html?id=" +
    encodeURIComponent(
      decodeURIComponent(id)
    );

};



/* =========================
   PAGINATION
========================= */

function renderPagination(
  totalPages
){

  const pagination =
    document.getElementById(
      "pagination"
    );


  pagination.innerHTML = "";


  if(
    totalPages <= 1
  ){

    return;

  }


  const previous =
    document.createElement(
      "button"
    );


  previous.textContent =
    "Previous";


  previous.disabled =
    currentRelatedPage <= 1;


  previous.onclick = () => {

    if(
      currentRelatedPage > 1
    ){

      goRelatedPage(
        currentRelatedPage - 1
      );

    }

  };


  pagination.appendChild(
    previous
  );


  let start =
    Math.max(
      1,
      currentRelatedPage - 2
    );


  let end =
    Math.min(
      totalPages,
      start + 4
    );


  if(
    end - start < 4
  ){

    start =
      Math.max(
        1,
        end - 4
      );

  }


  for(
    let i = start;
    i <= end;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      i;


    if(
      i === currentRelatedPage
    ){

      button.classList.add(
        "active"
      );

    }


    button.onclick = () => {

      goRelatedPage(i);

    };


    pagination.appendChild(
      button
    );

  }


  const next =
    document.createElement(
      "button"
    );


  next.textContent =
    "Next";


  next.disabled =
    currentRelatedPage >=
    totalPages;


  next.onclick = () => {

    if(
      currentRelatedPage <
      totalPages
    ){

      goRelatedPage(
        currentRelatedPage + 1
      );

    }

  };


  pagination.appendChild(
    next
  );

}



/* =========================
   GO RELATED PAGE
========================= */

function goRelatedPage(
  page
){

  location.href =
    "video.html?id=" +
    encodeURIComponent(
      videoId
    ) +
    "&page=" +
    page;

}



/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  const list =
    document.getElementById(
      "commentList"
    );


  if(!videoId){

    list.innerHTML = `

      <div class="empty">

        No video selected.

      </div>

    `;

    return;

  }


  list.innerHTML = `

    <div class="empty">

      Loading comments...

    </div>

  `;


  const {
    data,
    error
  } = await supabase

    .from("comments")

    .select(`
      id,
      video_id,
      comment,
      created_at
    `)

    .eq(
      "video_id",
      String(videoId)
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "Comments error:",
      error
    );


    list.innerHTML = `

      <div class="empty">

        Failed to load comments.

      </div>

    `;

    return;

  }


  renderComments(
    data || []
  );

}



/* =========================
   POST COMMENT
========================= */

commentBtn.onclick =
async function(){

  const text =
    commentInput.value.trim();


  if(!text){

    alert(
      "Please write a comment."
    );

    return;

  }


  if(text.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }


  commentBtn.disabled = true;

  commentBtn.textContent =
    "Posting...";


  const {
    error
  } = await supabase

    .from("comments")

    .insert({

      video_id:
        String(videoId),

      comment:
        text

    });


  if(error){

    console.error(
      "Comment insert error:",
      error
    );


    alert(
      "Comment post nahi ho paya."
    );


    commentBtn.disabled = false;

    commentBtn.textContent =
      "Post";

    return;

  }


  commentInput.value = "";


  commentBtn.disabled = false;

  commentBtn.textContent =
    "Post";


  await loadComments();

};



/* =========================
   RENDER COMMENTS
========================= */

function renderComments(
  comments
){

  const list =
    document.getElementById(
      "commentList"
    );


  if(
    !comments ||
    comments.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        No comments yet.

      </div>

    `;

    return;

  }


  list.innerHTML =
    comments

      .map(
        comment => `

          <div class="comment">


            <div class="commentName">

              Guest

            </div>


            <div class="commentText">

              ${escapeHtml(
                comment.comment
              )}

            </div>


            <div class="commentDate">

              ${timeAgo(
                comment.created_at
              )}

            </div>


          </div>

        `
      )

      .join("");

}

loadVideo();
