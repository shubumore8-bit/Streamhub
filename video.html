<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video — DesiVexa</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ads.css">

</head>

<body>

  <!-- HEADER -->
  <header class="dvHeader">

    <div class="dvHeaderInner">

      <button
        id="menuBtn"
        class="headerIcon"
        type="button"
      >
        ☰
      </button>

      <a
        href="index.html"
        class="dvLogo"
      >
        Desi<span>Vexa</span>
      </a>

      <button
        id="searchBtn"
        class="headerIcon"
        type="button"
      >
        ⌕
      </button>

    </div>

    <div
      id="searchBox"
      class="dvSearchBox"
    >

      <input
        id="search"
        type="search"
        placeholder="Search videos..."
        autocomplete="off"
      >

    </div>

  </header>


  <!-- MOBILE MENU -->

  <div
    id="mobileMenu"
    class="mobileMenu"
  >

    <a href="index.html">
      Home
    </a>

    <a href="most-viewed.html">
      Most Viewed
    </a>

    <a href="latest.html">
      Latest
    </a>

  </div>


  <main class="dvMain">

    <!-- =================================
         JUICYADS 1128314
         308 x 286
    ================================== -->

    <div
      class="dvAdSlot"
      style="
        width:100%;
        max-width:308px;
        min-height:286px;
        margin:15px auto 20px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >

      <!-- JuicyAds v3.0 -->

      <script
        type="text/javascript"
        data-cfasync="false"
        async
        src="https://poweredby.jads.co/js/jads.js">
      </script>

      <ins
        id="1128314"
        data-width="308"
        data-height="286">
      </ins>

      <script
        type="text/javascript"
        data-cfasync="false"
        async
      >
        (adsbyjuicy = window.adsbyjuicy || []).push({
          'adzone': 1128314
        });
      </script>

      <!-- JuicyAds END -->

    </div>


    <!-- =================================
         VIDEO
    ================================== -->

    <main
      class="wrap videoPage"
      id="page"
    >
      Loading video...
    </main>


  </main>


  <!-- VIDEO JS -->

  <script
    type="module"
    src="video.js?v=22">
  </script>


</body>
</html>
