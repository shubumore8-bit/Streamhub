<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#080808">
  <meta
    name="description"
    content="Watch videos on DesiVexa."
  >

  <title>Watch Video - DesiVexa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 9999;
      height: 58px;
      background: #0d0d0d;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .home-btn,
    .search-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 1px solid #333;
      border-radius: 10px;
      background: #151515;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 19px;
      transition: 0.2s ease;
    }

    .home-btn:hover,
    .search-btn:hover {
      background: #202020;
      border-color: #e50914;
    }

    .logo {
      color: #e50914;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .logo span {
      color: #fff;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    #page {
      width: 100%;
      min-height: 200px;
    }

    .loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 16px;
    }

    /* Video-page ad area */
    .ad-slot {
      display: block;
      width: calc(100% - 24px);
      max-width: 970px;
      min-height: 120px;
      margin: 20px auto 28px;
      padding: 8px;
      text-align: center;
      overflow: hidden;
      position: relative;
      background: #101010;
      border-radius: 8px;
    }

    .ad-slot script {
      display: block;
    }

    @media (max-width: 360px) {
      header {
        padding: 0 8px;
      }

      .home-btn,
      .search-btn {
        width: 34px;
        height: 34px;
      }

      .logo {
        font-size: 18px;
      }

      .ad-slot {
        width: calc(100% - 16px);
      }
    }

    @media (min-width: 768px) {
      header {
        padding: 0 25px;
      }

      .logo {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a
      class="home-btn"
      href="./index.html"
      aria-label="Home"
    >⌂</a>

    <div class="logo">
      Desi<span>Vexa</span>
    </div>

    <a
      class="search-btn"
      href="./index.html"
      aria-label="Search videos"
    >⌕</a>
  </header>

  <main>

    <!-- Existing video.js renders the video content here -->
    <div id="page">
      <div class="loading">
        Loading video...
      </div>
    </div>

    <!-- VIDEO PAGE AD ZONE 1 -->
    <div
      class="ad-slot"
      id="videoBannerAd1"
      aria-label="Advertisement"
    >
      <script>
      (function(nlikq){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];

        s.settings = nlikq || {};
        s.src = "//nervousstroke.com/bnXuV.sfd/Gflv0-Y/W/cy/_eNmB9PuOZjUWlFkBPzT/cX1/_M_TtE/zoN/TJcEtvNOzsUIxHMSTpMt2eMjQx";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';

        l.parentNode.insertBefore(s, l);
      })({})
      </script>
    </div>

    <!-- VIDEO PAGE AD ZONE 2 -->
    <div
      class="ad-slot"
      id="videoBannerAd2"
      aria-label="Advertisement"
    >
      <script>
      (function(nlikq){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];

        s.settings = nlikq || {};
        s.src = "//nervousstroke.com/b.XvVZsqdTGKln0jYsWhcq/eeymo9durZaU/lXkxPWTycG1CMtTJE/yfM-juUYtENfzhUxxpMNTmIxygOtQP";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';

        l.parentNode.insertBefore(s, l);
      })({})
      </script>
    </div>

  </main>

  <!-- Keep the existing video functionality -->
  <script type="module" src="./video.js"></script>

</body>
</html>
