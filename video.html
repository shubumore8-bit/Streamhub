<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="DesiVexa video page"
  >

  <title>Video — DesiVexa</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ads.css">

  <style>

    /* =====================================================
       VIDEO PAGE
       COMPACT MOBILE / 2 COLUMN RELATED VIDEOS
    ===================================================== */

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      max-width:100%;
      overflow-x:hidden;
      background:#000;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .dvHeader{
      position:relative;
      z-index:1000;
      background:#c90000;
      border-bottom:2px solid #4d0000;
    }

    .dvHeaderInner{
      width:100%;
      max-width:1100px;
      height:62px;
      margin:auto;
      padding:0 8px;

      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
      gap:5px;
    }

    .headerIcon{
      width:40px;
      height:40px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#b50000;
      border:1px solid #650000;

      color:#fff;
      font-size:22px;
      cursor:pointer;
    }

    .dvLogo{
      text-align:center;

      color:#050505;
      font-size:27px;
      font-weight:900;
      letter-spacing:-1.5px;

      text-transform:uppercase;
    }

    .dvLogo span{
      color:#000;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .dvSearchBox{
      display:none;

      padding:8px;

      background:#090909;
      border-bottom:1px solid #333;
    }

    .dvSearchBox.show{
      display:block;
    }

    .dvSearchBox input{
      width:100%;
      height:40px;

      padding:0 12px;

      background:#151515;
      border:1px solid #555;
      border-radius:3px;

      color:#fff;
      outline:none;
    }


    /* =====================================================
       MENU
    ===================================================== */

    .mobileMenu{
      display:none;

      position:absolute;
      top:62px;
      left:0;
      right:0;

      z-index:3000;

      background:#111;
      border-bottom:2px solid #c90000;
    }

    .mobileMenu.show{
      display:block;
    }

    .mobileMenu a{
      display:block;

      padding:14px 16px;

      color:#ddd;

      border-bottom:1px solid #292929;
    }

    .mobileMenu a:hover{
      background:#1c1c1c;
      color:#fff;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .dvMain{
      width:100%;
      max-width:1100px;

      margin:0 auto;

      padding:0 6px 35px;
    }


    /* =====================================================
       TOP AD
    ===================================================== */

    .videoTopAd{

      width:100%;
      max-width:308px;

      min-height:286px;

      margin:7px auto 8px;

      display:flex;

      justify-content:center;
      align-items:center;

      overflow:hidden;

      background:#111;
    }


    /* =====================================================
       VIDEO PAGE CONTENT
    ===================================================== */

    .videoPage{
      width:100%;
      max-width:1100px;

      margin:0 auto;
    }


    /* =====================================================
       PLAYER
    ===================================================== */

    .videoPlayerWrap{

      position:relative;

      width:100%;

      background:#000;

      overflow:hidden;
    }

    .videoPlayerWrap video{

      display:block;

      width:100%;

      max-height:75vh;

      background:#000;

      object-fit:contain;
    }


    /* =====================================================
       VIDEO INFO
    ===================================================== */

    .videoInfo{

      padding:7px 2px 5px;

      background:#000;
    }

    .videoInfo h1{

      margin:0 0 5px;

      color:#fff;

      font-size:23px;

      line-height:1.18;

      font-weight:400;
    }


    .videoMeta{

      display:flex;

      flex-wrap:wrap;

      gap:8px;

      color:#999;

      font-size:12px;
    }

    .videoMeta span{

      display:inline-block;

      padding:4px 7px;

      background:#292929;

      border-radius:3px;
    }


    .videoDescription{

      margin:8px 0 0;

      color:#aaa;

      font-size:13px;

      line-height:1.45;
    }


    /* =====================================================
       ACTION BAR
       Created for visual structure
    ===================================================== */

    .videoActions{

      display:grid;

      grid-template-columns:
        repeat(5,minmax(0,1fr));

      gap:3px;

      margin-top:7px;
    }

    .videoAction{

      min-height:42px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:#252525;

      color:#fff;

      border:1px solid #333;

      font-size:12px;

      cursor:pointer;
    }

    .videoAction:hover{

      background:#c90000;

    }


    /* =====================================================
       TAGS
    ===================================================== */

    .videoTags{

      display:flex;

      flex-wrap:wrap;

      gap:4px;

      margin:7px 0;
    }

    .videoTag{

      padding:7px 10px;

      background:#484848;

      color:#ddd;

      border-radius:3px;

      font-size:11px;
    }


    /* =====================================================
       AD STRIP
    ===================================================== */

    .videoAdStrip{

      width:100%;

      min-height:50px;

      margin:8px 0;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      background:#111;

      text-align:center;
    }


    /* =====================================================
       RELATED HEADING
    ===================================================== */

    .dvSectionTitle{

      display:flex;

      align-items:center;

      justify-content:space-between;

      margin:8px 0 4px;

      padding:5px 6px;

      background:
        linear-gradient(#1b1b1b,#050505);

      border-left:3px solid #777;

      border-bottom:1px solid #333;
    }

    .dvSectionTitle h2{

      margin:0;

      color:#fff;

      font-size:18px;

      font-weight:400;
    }

    .dvSectionTitle h2::before{

      content:"› ";

      color:#aaa;
    }


    /* =====================================================
       RELATED VIDEO GRID
       MOBILE = 2 COLUMNS
    ===================================================== */

    #randomVideos .dvGrid{

      width:100%;

      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:3px;
    }

    #randomVideos .card{

      width:100%;

      min-width:0;

      overflow:hidden;

      background:#090909;
    }

    #randomVideos .thumb{

      position:relative;

      width:100%;

      aspect-ratio:16/10;

      overflow:hidden;

      background:#222;
    }

    #randomVideos .thumb img{

      width:100%;
      height:100%;

      display:block;

      object-fit:cover;
    }

    #randomVideos .body{

      padding:4px 5px 7px;
    }

    #randomVideos .card h3{

      margin:0;

      color:#ddd;

      font-size:11px;

      line-height:1.25;

      font-weight:400;

      display:-webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;
    }

    #randomVideos .cardMeta{

      display:flex;

      gap:5px;

      margin-top:3px;

      color:#777;

      font-size:8px;

      white-space:nowrap;

      overflow:hidden;
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .videoError{

      padding:50px 20px;

      text-align:center;

      background:#111;
    }

    .videoError h2{

      margin-top:0;

      color:#fff;
    }

    .videoError p{

      color:#888;
    }

    .videoError a{

      display:inline-block;

      margin-top:10px;

      padding:10px 16px;

      background:#c90000;

      border-radius:3px;

      color:#fff;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .videoFooter{

      margin-top:20px;

      padding:22px 10px;

      text-align:center;

      background:#080808;

      border-top:1px solid #292929;
    }

    .videoFooterLogo{

      font-size:24px;

      font-weight:900;
    }

    .videoFooterLogo span{

      color:#e00000;
    }

    .videoFooter p{

      color:#777;

      font-size:10px;
    }


    /* =====================================================
       DESKTOP
    ===================================================== */

    @media(min-width:700px){

      .dvMain{

        padding-left:12px;
        padding-right:12px;
      }

      .videoInfo h1{

        font-size:28px;
      }

      #randomVideos .dvGrid{

        grid-template-columns:
          repeat(4,minmax(0,1fr));

        gap:7px;
      }

      #randomVideos .card h3{

        font-size:13px;
      }

      #randomVideos .cardMeta{

        font-size:10px;
      }

    }


    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media(max-width:360px){

      .dvHeaderInner{

        height:58px;

        grid-template-columns:
          44px 1fr 44px;
      }

      .headerIcon{

        width:37px;
        height:37px;

        font-size:20px;
      }

      .dvLogo{

        font-size:23px;
      }

      .dvMain{

        padding-left:4px;
        padding-right:4px;
      }

      .videoInfo h1{

        font-size:20px;
      }

      .videoActions{

        grid-template-columns:
          repeat(3,minmax(0,1fr));
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="dvHeader">

    <div class="dvHeaderInner">


      <button
        id="menuBtn"
        class="headerIcon"
        type="button"
        aria-label="Menu">

        ☰

      </button>


      <a
        href="index.html"
        class="dvLogo">

        DESI<span>VEXA</span>

      </a>


      <button
        id="searchBtn"
        class="headerIcon"
        type="button"
        aria-label="Search">

        🔍

      </button>


    </div>


    <div
      id="searchBox"
      class="dvSearchBox">

      <input
        id="search"
        type="search"
        placeholder="Find your favorite videos..."
        autocomplete="off">

    </div>

  </header>


  <!-- =====================================================
       MENU
  ====================================================== -->

  <div
    id="mobileMenu"
    class="mobileMenu">

    <a href="index.html">
      🏠 Home
    </a>

    <a href="most-viewed.html">
      🔥 Most Viewed
    </a>

    <a href="latest.html">
      🆕 Latest
    </a>

    <a href="index.html#categories">
      ▦ Categories
    </a>

    <a href="legal.html">
      Terms &amp; Privacy
    </a>

  </div>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="dvMain">


    <!-- ===================================================
         JUICYADS 1128314
    ==================================================== -->

    <div class="videoTopAd">

      <script
        type="text/javascript"
        data-cfasync="false"
        async
        src="https://poweredby.jads.co/js/jads.js">
      </script>

      <ins
        id="1128314"
        data-width="308"
        data-height="286">
      </ins>

      <script
        type="text/javascript"
        data-cfasync="false"
        async>

        (adsbyjuicy =
          window.adsbyjuicy || [])
          .push({
            'adzone':1128314
          });

      </script>

    </div>


    <!-- ===================================================
         VIDEO PAGE
         video.js fills #page
    ==================================================== -->

    <main
      class="videoPage"
      id="page">

      Loading video...

    </main>


  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="videoFooter">

    <div class="videoFooterLogo">

      Desi<span>Vexa</span>

    </div>

    <p>
      18+ only · All content must be lawful and consensual.
    </p>

  </footer>


  <!-- =====================================================
       VIDEO JS
    ====================================================== -->

  <script
    type="module"
    src="video.js?v=41">
  </script>


  <!-- =====================================================
       UI CONTROLS
       These match the current video.js selectors.
  ====================================================== -->

  <script>

    const menuBtn =
      document.getElementById("menuBtn");

    const mobileMenu =
      document.getElementById("mobileMenu");

    const searchBtn =
      document.getElementById("searchBtn");

    const searchBox =
      document.getElementById("searchBox");

    const search =
      document.getElementById("search");


    /* MENU */

    if(menuBtn){

      menuBtn.addEventListener(
        "click",
        function(){

          mobileMenu.classList.toggle("show");

        }
      );

    }


    /* SEARCH */

    if(searchBtn){

      searchBtn.addEventListener(
        "click",
        function(){

          searchBox.classList.toggle("show");

          if(
            searchBox.classList.contains("show")
          ){

            setTimeout(
              function(){

                if(search){
                  search.focus();
                }

              },
              100
            );

          }

        }
      );

    }


    /* SEARCH ENTER */

    if(search){

      search.addEventListener(
        "keydown",
        function(e){

          if(e.key !== "Enter"){
            return;
          }

          const value =
            search.value.trim();

          if(value){

            window.location.href =
              "index.html?search=" +
              encodeURIComponent(value);

          }else{

            window.location.href =
              "index.html";

          }

        }
      );

    }

  </script>


</body>

</html>
