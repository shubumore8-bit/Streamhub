  <title>DesiVexa — Video</title>  <link rel="stylesheet" href="style.css?v=31">  <style>
    body {
      background: #0b0b0b;
      color: #fff;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .video-page {
      max-width: 1000px;
      margin: auto;
      padding: 12px 12px 80px;
    }

    .player {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .player video {
      width: 100%;
      display: block;
      max-height: 75vh;
      background: #000;
    }

    .video-title {
      font-size: 21px;
      font-weight: 800;
      margin: 15px 0 7px;
    }

    .video-meta {
      color: #999;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .description {
      color: #ccc;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin: 15px 0;
    }

    .action-btn {
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #222;
    }

    .comments-box {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #292929;
    }

    .comments-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .comment-form input {
      flex: 1;
      min-width: 0;
      background: #151515;
      color: #fff;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 10px;
      outline: none;
    }

    .comment-form button {
      background: #e50914;
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .comment {
      background: #151515;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .comment-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .comment-text {
      color: #ccc;
      font-size: 13px;
      line-height: 1.4;
    }

    .related {
      margin-top: 30px;
    }

    .related-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .related-card {
      display: block;
      color: #fff;
      text-decoration: none;
      background: #151515;
      border: 1px solid #222;
      border-radius: 7px;
      overflow: hidden;
    }

    .related-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .related-info {
      padding: 7px;
    }

    .related-name {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #999;
    }

    .error {
      color: #ff5555;
    }

    @media (max-width: 600px) {

      .video-page {
        padding: 8px 8px 70px;
      }

      .video-title {
        font-size: 18px;
      }

      .related-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .related-info {
        padding: 5px;
      }

      .related-name {
        font-size: 10px;
      }

    }
