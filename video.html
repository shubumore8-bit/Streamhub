<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Video — DesiVexa</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ads.css">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}


/* HEADER */

.dvHeader{
  position:sticky;
  top:0;
  z-index:100;
  background:#b40000;
  border-bottom:1px solid #650000;
}

.dvHeaderInner{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  max-width:1100px;
  margin:auto;
}

.headerIcon{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.dvLogo{
  color:#fff;
  text-decoration:none;
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.dvLogo span{
  color:#ffb0b0;
}


/* SEARCH */

.dvSearchBox{
  display:none;
  max-width:700px;
  margin:auto;
  padding:8px 12px;
  background:#8d0000;
}

.dvSearchBox.show{
  display:block;
}

.dvSearchBox input{
  width:100%;
  height:40px;
  border:0;
  border-radius:5px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
}


/* MENU */

.mobileMenu{
  display:none;
  background:#151515;
  border-bottom:1px solid #333;
}

.mobileMenu.show{
  display:block;
}

.mobileMenu a{
  display:block;
  padding:12px 15px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #292929;
}


/* MAIN */

.dvMain{
  max-width:1050px;
  margin:auto;
  padding:10px 10px 35px;
}

.videoPage{
  width:100%;
  max-width:1000px;
  margin:auto;
}


/* TOP AD */

.topAd{
  width:100%;
  min-height:286px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:4px auto 12px;
  overflow:hidden;
}


/* VIDEO */

.videoPlayerWrap{
  position:relative;
  width:100%;
  background:#000;
  border:1px solid #2c2c2c;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 12px #000;
}

.videoPlayerWrap video{
  display:block;
  width:100%;
  height:auto;
  max-height:76vh;
  background:#000;
}


/* VIDEO INFO */

.videoInfo{
  padding:12px 2px 4px;
}

.videoTitle{
  font-size:21px;
  line-height:1.25;
  margin:0 0 9px;
  font-weight:700;
}

.videoMeta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.videoMeta span{
  background:#171717;
  border:1px solid #303030;
  border-radius:5px;
  padding:7px 10px;
  color:#ddd;
  font-size:13px;
}

.videoDescription{
  color:#aaa;
  font-size:13px;
  line-height:1.45;
  margin:10px 0;
}


/* BUTTONS */

.actionBar{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:9px 0 12px;
}

.actionBtn{
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:5px;
  padding:9px 14px;
  font-size:14px;
  cursor:pointer;
}

.actionBtn:active{
  background:#272727;
}


/* CREATOR */

.creatorRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#101010;
  border:1px solid #242424;
  border-radius:6px;
  padding:9px 10px;
  margin:8px 0 10px;
}

.creatorName{
  font-size:14px;
  font-weight:700;
}

.subscribeBtn{
  background:#d40000;
  color:#fff;
  border:0;
  border-radius:4px;
  padding:8px 13px;
  font-weight:700;
}


/* TAGS */

.tags{
  margin:4px 0 12px;
}

.videoTag{
  display:inline-block;
  background:#240909;
  color:#ff7070;
  border:1px solid #4d1616;
  border-radius:4px;
  padding:5px 8px;
  margin:3px 4px 3px 0;
  font-size:12px;
}


/* MIDDLE AD */

.midAd{
  width:100%;
  min-height:100px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px auto 15px;
  overflow:hidden;
}


/* MORE VIDEOS */

.dvSectionTitle{
  margin:16px 0 8px;
}

.dvSectionTitle h2{
  margin:2px 0 0;
  font-size:19px;
}

.sectionLabel{
  font-size:10px;
  color:#ff4a4a;
  font-weight:800;
  letter-spacing:1px;
}

#randomVideos .dvGrid{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:6px !important;
}

#randomVideos .card{
  min-width:0 !important;
}

#randomVideos .thumb{
  width:100% !important;
  aspect-ratio:16/10 !important;
  overflow:hidden;
}

#randomVideos .thumb img{
  width:100% !important;
  height:100% !important;
  object-fit:cover;
}


/* ERROR */

.videoError{
  text-align:center;
  padding:30px 15px;
  background:#111;
  border:1px solid #292929;
  border-radius:7px;
}

.videoError a{
  display:inline-block;
  margin-top:10px;
  background:#d40000;
  color:#fff;
  text-decoration:none;
  padding:9px 14px;
  border-radius:5px;
}


/* DESKTOP */

@media(min-width:700px){

  .dvMain{
    padding-left:15px;
    padding-right:15px;
  }

  #randomVideos .dvGrid{
    grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  }

}


/* MOBILE */

@media(max-width:699px){

  .videoTitle{
    font-size:19px;
  }

  .videoPlayerWrap{
    border-radius:7px;
  }

  .dvMain{
    padding:6px 6px 30px;
  }

}
</style>

</head>


<body>


<!-- HEADER -->

<header class="dvHeader">

  <div class="dvHeaderInner">

    <button
      id="menuBtn"
      class="headerIcon"
      type="button"
    >
      ☰
    </button>


    <a
      href="index.html"
      class="dvLogo"
    >
      Desi<span>Vexa</span>
    </a>


    <button
      id="searchBtn"
      class="headerIcon"
      type="button"
    >
      ⌕
    </button>

  </div>


  <!-- SEARCH -->

  <div
    id="searchBox"
    class="dvSearchBox"
  >

    <input
      id="search"
      type="search"
      placeholder="Search videos..."
      autocomplete="off"
    >

  </div>

</header>



<!-- MOBILE MENU -->

<div
  id="mobileMenu"
  class="mobileMenu"
>

  <a href="index.html">
    Home
  </a>

  <a href="most-viewed.html">
    Most Viewed
  </a>

  <a href="latest.html">
    Latest
  </a>

</div>



<main class="dvMain">


  <!-- =================================
       JUICYADS 1128314
       308 x 286
  ================================== -->

  <div class="topAd">

    <script
      type="text/javascript"
      data-cfasync="false"
      async
      src="https://poweredby.jads.co/js/jads.js">
    </script>


    <ins
      id="1128314"
      data-width="308"
      data-height="286">
    </ins>


    <script
      type="text/javascript"
      data-cfasync="false"
      async
    >

      (adsbyjuicy =
        window.adsbyjuicy || [])
        .push({
          'adzone':1128314
        });

    </script>

  </div>



  <!-- =================================
       VIDEO PAGE
  ================================== -->

  <main
    id="page"
    class="videoPage"
  >

    Loading video...

  </main>


</main>



<!-- VIDEO JS -->

<script
  type="module"
  src="video.js?v=60">
</script>



<script>

document
  .getElementById("menuBtn")
  ?.addEventListener(
    "click",
    () => {

      document
        .getElementById("mobileMenu")
        ?.classList
        .toggle("show");

    }
  );


document
  .getElementById("searchBtn")
  ?.addEventListener(
    "click",
    () => {

      const box =
        document.getElementById(
          "searchBox"
        );

      box?.classList.toggle(
        "show"
      );

      box
        ?.querySelector("input")
        ?.focus();

    }
  );


document
  .getElementById("search")
  ?.addEventListener(
    "keydown",
    e => {

      if(e.key !== "Enter"){
        return;
      }

      const q =
        e.target.value.trim();

      location.href =
        q
          ? `index.html?search=${encodeURIComponent(q)}`
          : "index.html";

    }
  );

</script>


</body>
</html>
