<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch Video - DesiVexa</title>

  <meta name="theme-color" content="#080808">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 9999;
      height: 58px;
      background: #0d0d0d;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .home-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 19px;
    }

    .logo {
      color: #e50914;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .logo span {
      color: #fff;
    }

    .search-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    #page {
      width: 100%;
    }

    .loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 16px;
    }

    .error-box {
      margin: 30px 15px;
      padding: 20px;
      border: 1px solid #3a1717;
      border-radius: 12px;
      background: #120909;
      text-align: center;
    }

    .error-box h2 {
      margin: 0 0 10px;
      color: #ff3b3b;
      font-size: 20px;
    }

    .error-box p {
      margin: 0;
      color: #aaa;
      line-height: 1.5;
    }

    @media (min-width: 768px) {
      header {
        padding: 0 25px;
      }

      .logo {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="home-btn" href="index.html" aria-label="Home">⌂</a>

    <div class="logo">
      Desi<span>Vexa</span>
    </div>

    <a class="search-btn" href="index.html" aria-label="Search">⌕</a>
  </header>

  <main>
    <div id="page">
      <div class="loading">
        Loading video...
      </div>
    </div>
  </main>

  <!-- IMPORTANT:
       New video.js is now the ONLY video-page JavaScript.
       Old inline script has been removed.
  -->
  <script type="module" src="./video.js"></script>

</body>
</html>
