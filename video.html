<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <meta
    name="description"
    content="Watch video on DesiVexa."
  >

  <title>Watch Video - DesiVexa</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }


<script src="/ads.js" defer></script>

    
    body {
      margin: 0;
      padding: 0;
      background: #080808;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 9999;

      height: 58px;

      background: #0d0d0d;

      border-bottom:
        1px solid #242424;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 14px;
    }

    .home-btn,
    .search-btn {

      width: 38px;
      height: 38px;

      border-radius: 10px;

      border:
        1px solid #333;

      background: #151515;

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      font-size: 19px;

      transition:
        .2s ease;
    }

    .home-btn:hover,
    .search-btn:hover {

      background: #202020;

      border-color:
        #e50914;
    }

    .logo {

      color: #e50914;

      font-size: 22px;

      font-weight: 800;

      letter-spacing:
        .3px;
    }

    .logo span {
      color: #fff;
    }

    main {

      width: 100%;

      max-width:
        1100px;

      margin:
        0 auto;

      padding-bottom:
        60px;
    }

    #page {
      width: 100%;
    }

    .loading {

      min-height:
        60vh;

      display: flex;

      align-items:
        center;

      justify-content:
        center;

      color: #aaa;

      font-size: 16px;
    }

    @media (min-width: 768px) {

      header {
        padding:
          0 25px;
      }

      .logo {
        font-size: 25px;
      }

    }

  </style>

</head>

<body>

  <header>

    <a
      class="home-btn"
      href="index.html"
      aria-label="Home"
    >
      ⌂
    </a>

    <div class="logo">
      Desi<span>Vexa</span>
    </div>

    <a
      class="search-btn"
      href="index.html"
      aria-label="Search"
    >
      ⌕
    </a>

  </header>


  <main>

    <div id="page">

      <div class="loading">
        Loading video...
      </div>

    </div>

  </main>


  <script
    type="module"
    src="./video.js"
  ></script>

</body>

</html>
