<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Watch Video - DesiVexa</title>
  <meta name="description" content="Watch videos on DesiVexa.">

  <link rel="stylesheet" href="style.css">
<style>
    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px;
      box-sizing: border-box;
    }

    .ad-slot {
      margin: 15px 0;
      min-height: 0;
      text-align: center;
      overflow: hidden;
    }

    .ad-slot:empty {
      display: none;
    }

    .video-heading {
      font-size: 22px;
      margin: 16px 0 8px;
      overflow-wrap: anywhere;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }

    .action-buttons button {
      background: #171717;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .action-buttons button:hover {
      background: #f21d35;
    }

    .section-title {
      border-left: 3px solid #f21d35;
      padding-left: 10px;
      margin-top: 25px;
    }

    #randomVideos {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    #commentsSection {
      scroll-margin-top: 20px;
      margin-top: 25px;
    }

    @media (max-width: 700px) {
      #randomVideos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .video-heading {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <!-- DesiVexa banner ad; kept outside the video app container -->
  <script id="aclib" type="text/javascript" src="https://acscdn.com/script/aclib.js"></script>
  <div class="desivexa-banner-ad" style="width:100%; margin:12px auto; text-align:center; overflow:hidden;">
    <script type="text/javascript">
      aclib.runBanner({ zoneId: '12316182' });
    </script>
  </div>


  <header style="padding:15px;background:#111;border-bottom:1px solid #292929;">
    <a href="index.html"
       style="text-decoration:none;font-size:25px;font-weight:bold;">
      <span style="color:white;">Desi</span><span style="color:#f21d35;">Vexa</span>
    </a>
  </header>

  <main class="video-container">

    <!-- Banner ad above player -->
    <div id="videoBannerAd" class="ad-slot"></div>

    <!-- Main video player -->
    <div class="player-wrapper">
      <video
        id="mainVideo"
        class="video-js vjs-default-skin vjs-big-play-centered"
        controls
        playsinline
        preload="metadata"
      ></video>
    </div>

    <!-- Banner ad below player -->
    <div id="playerBottomAd" class="ad-slot"></div>

    <h1 id="videoTitle" class="video-heading">Loading video...</h1>

    <div id="videoInfo"></div>

    <div class="action-buttons">
      <button id="likeButton" type="button">❤️ Like</button>
      <button id="commentsButton" type="button">💬 Comments</button>
      <button id="shareButton" type="button">🔗 Share</button>
    </div>

    <section>
      <h3 class="section-title">Description</h3>
      <div id="videoDescription">Loading...</div>
    </section>

    <section>
      <h3 class="section-title">Related Videos</h3>
      <div id="randomVideos"></div>
    </section>

    <!-- Banner ad below related videos -->
    <div id="randomBannerAd" class="ad-slot"></div>

    <section id="commentsSection">
      <h3 class="section-title">Comments</h3>

      <form id="commentForm">
        <textarea
          id="commentInput"
          placeholder="Write a comment..."
          rows="3"
          required
          style="box-sizing:border-box;width:100%;padding:12px;background:#171717;color:white;border:1px solid #333;border-radius:8px;"
        ></textarea>

        <button
          type="submit"
          style="margin-top:10px;padding:10px 18px;background:#f21d35;color:white;border:0;border-radius:8px;"
        >
          Post Comment
        </button>
      </form>

      <div id="commentsList"></div>
    </section>

  </main>

  <footer style="padding:20px;text-align:center;color:#888;">
    © <span id="footerYear"></span> DesiVexa
  </footer>

  <!-- Google IMA SDK: used by video.js for VAST pre-roll ads -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>

  <!-- IMPORTANT: video.js uses ES module imports, so load it as a module. -->
  <script type="module" src="video.js"></script>

  <script>
    document.getElementById("footerYear").textContent =
      new Date().getFullYear();

    document.getElementById("commentsButton").addEventListener("click", function () {
      document.getElementById("commentsSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    document.getElementById("shareButton").addEventListener("click", async function () {
      const shareData = {
        title: document.title,
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          alert("Video link copied!");
        } else {
          prompt("Copy video link:", window.location.href);
        }
      } catch (error) {
        console.log("Share cancelled or unavailable.");
      }
    });
  </script>

</body>
</html>
