<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Watch videos on DesiVexa - 18+ video platform.">

  <title>Watch Video - DesiVexa</title>

  <link
    rel="stylesheet"
    href="style.css">

  <link
    rel="stylesheet"
    href="ads.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="dvHeader">

    <div class="dvHeaderInner">

      <button
        id="menuBtn"
        class="headerIcon"
        type="button"
        aria-label="Menu">
        ☰
      </button>

      <a
        href="index.html"
        class="dvLogo">
        Desi<span>Vexa</span>
      </a>

      <button
        id="searchBtn"
        class="headerIcon"
        type="button"
        aria-label="Search">
        ⌕
      </button>

    </div>


    <!-- SEARCH -->

    <div
      id="searchBox"
      class="dvSearchBox">

      <input
        id="search"
        type="search"
        placeholder="Search videos..."
        autocomplete="off">

    </div>

  </header>


  <!-- =========================
       MOBILE MENU
  ========================== -->

  <div
    id="mobileMenu"
    class="mobileMenu">

    <a href="index.html">
      Home
    </a>

    <a href="most-viewed.html">
      Most Viewed
    </a>

    <a href="latest.html">
      Latest
    </a>

    <a href="index.html#categories">
      Categories
    </a>

  </div>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="dvMain wrap">


    <!-- TOP AD -->

    <div
      class="dvAdSlot dvAdWide"
      data-juicy-ad="wide">
    </div>


    <!-- VIDEO CONTENT -->

    <div id="page">

      <p class="muted">
        Loading video...
      </p>

    </div>


    <!-- BANNER AD -->

    <div
      class="dvAdSlot dvAdBanner"
      data-juicy-ad="banner">
    </div>


    <!-- COMPACT AD -->

    <div
      class="dvAdSlot dvAdCompact"
      data-juicy-ad="compact">
    </div>


  </main>


  <!-- =========================
       VIDEO JS
  ========================== -->

  <script
    type="module"
    src="video.js?v=21">
  </script>


  <!-- =========================
       JUICYADS
  ========================== -->

  <script type="module">

    import {
      initJuicyAds
    } from "./ads.js";

    initJuicyAds({
      float: true,
      native: true
    });

  </script>


</body>
</html>
