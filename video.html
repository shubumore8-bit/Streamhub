<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Video — DesiVexa</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ads.css">

  <style>
    body{
      background:#050505;
      color:#fff;
      margin:0;
    }

    .dvMain{
      max-width:1100px;
      margin:auto;
      padding:0 10px 30px;
    }

    .videoPage{
      max-width:1000px;
      margin:auto;
    }

    .videoPlayerWrap{
      background:#000;
      border:1px solid #222;
      border-radius:8px;
      overflow:hidden;
    }

    .videoPlayerWrap video{
      display:block;
      width:100%;
      height:auto;
      max-height:75vh;
      background:#000;
    }

    .videoInfo{
      padding:12px 2px;
    }

    .videoInfo h1{
      font-size:20px;
      line-height:1.3;
      margin:0 0 8px;
    }

    .videoMeta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      color:#aaa;
      font-size:13px;
    }

    .videoMeta span{
      background:#151515;
      border:1px solid #292929;
      border-radius:4px;
      padding:5px 8px;
    }

    .videoDescription{
      color:#bbb;
      font-size:14px;
      line-height:1.5;
      margin:10px 0;
    }

    .videoActions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin:10px 0;
    }

    .videoActions button{
      background:#151515;
      color:#fff;
      border:1px solid #333;
      border-radius:5px;
      padding:8px 12px;
      cursor:pointer;
    }

    .videoActions button:hover{
      border-color:#e00000;
    }

    .videoTag{
      display:inline-block;
      background:#210909;
      color:#ff5a5a;
      border:1px solid #4a1515;
      border-radius:4px;
      padding:5px 8px;
      margin:3px 4px 3px 0;
      font-size:12px;
    }

    .dvAdSlot{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:10px;
      overflow:hidden;
    }

    .topAd{
      min-height:286px;
      margin:12px auto 16px;
    }

    .midAd{
      min-height:100px;
      margin:14px auto;
    }

    .videoError{
      padding:30px 15px;
      text-align:center;
      background:#111;
      border:1px solid #292929;
      border-radius:8px;
    }

    .videoError h2{
      margin-top:0;
    }

    .videoError a{
      display:inline-block;
      margin-top:10px;
      background:#d40000;
      color:#fff;
      text-decoration:none;
      padding:9px 14px;
      border-radius:5px;
    }

    #randomVideos{
      margin-top:18px;
    }

    #randomVideos .dvGrid{
      grid-template-columns:repeat(2,minmax(0,1fr)) !important;
      gap:6px;
    }

    @media(min-width:700px){
      #randomVideos .dvGrid{
        grid-template-columns:repeat(4,minmax(0,1fr)) !important;
      }
    }

    @media(max-width:699px){
      .videoInfo h1{
        font-size:17px;
      }

      .dvMain{
        padding:0 6px 25px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="dvHeader">

    <div class="dvHeaderInner">

      <button
        id="menuBtn"
        class="headerIcon"
        type="button"
      >
        ☰
      </button>

      <a
        href="index.html"
        class="dvLogo"
      >
        Desi<span>Vexa</span>
      </a>

      <button
        id="searchBtn"
        class="headerIcon"
        type="button"
      >
        ⌕
      </button>

    </div>

    <div
      id="searchBox"
      class="dvSearchBox"
    >
      <input
        id="search"
        type="search"
        placeholder="Search videos..."
        autocomplete="off"
      >
    </div>

  </header>


  <!-- MOBILE MENU -->
  <div
    id="mobileMenu"
    class="mobileMenu"
  >

    <a href="index.html">
      Home
    </a>

    <a href="most-viewed.html">
      Most Viewed
    </a>

    <a href="latest.html">
      Latest
    </a>

  </div>


  <main class="dvMain">

    <!-- ==============================
         JUICYADS 1128314
         308 x 286
    =============================== -->

    <div class="dvAdSlot topAd">

      <script
        type="text/javascript"
        data-cfasync="false"
        async
        src="https://poweredby.jads.co/js/jads.js">
      </script>

      <ins
        id="1128314"
        data-width="308"
        data-height="286">
      </ins>

      <script
        type="text/javascript"
        data-cfasync="false"
        async>
        (adsbyjuicy = window.adsbyjuicy || []).push({
          'adzone':1128314
        });
      </script>

    </div>


    <!-- ==============================
         VIDEO PAGE
    =============================== -->

    <main
      class="videoPage"
      id="page"
    >
      Loading video...
    </main>

  </main>


  <!-- VIDEO JS -->

  <script
    type="module"
    src="video.js?v=50">
  </script>


  <script>

    document
      .getElementById("menuBtn")
      ?.addEventListener(
        "click",
        () => {

          document
            .getElementById("mobileMenu")
            ?.classList
            .toggle("show");

        }
      );


    document
      .getElementById("searchBtn")
      ?.addEventListener(
        "click",
        () => {

          const box =
            document.getElementById(
              "searchBox"
            );

          box?.classList.toggle("show");

          box
            ?.querySelector("input")
            ?.focus();

        }
      );


    document
      .getElementById("search")
      ?.addEventListener(
        "keydown",
        (e) => {

          if(e.key !== "Enter"){
            return;
          }

          const q =
            e.target.value.trim();

          location.href =
            q
              ? `index.html?search=${encodeURIComponent(q)}`
              : "index.html";

        }
      );

  </script>

</body>
</html>
