<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Video — DesiVexa</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ads.css">
</head>

<body>

<header>
  <a href="index.html" class="logo">
    Desi<span>Vexa</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="wrap videoPage" id="page">

  <!-- VIDEO CONTENT -->
  <div class="videoWatch">

    <!-- Video page ad -->
    <div class="dvAdSlot dvAdWide"
         data-juicy-ad="wide"></div>

    <!-- Video/player will be inserted by video.js -->
    <div id="videoContainer">
      Loading video...
    </div>

    <!-- Banner ad -->
    <div class="dvAdSlot dvAdBanner"
         data-juicy-ad="banner"></div>

    <!-- Compact ad -->
    <div class="dvAdSlot dvAdCompact"
         data-juicy-ad="compact"></div>

  </div>

</main>

<!-- Your existing video system -->
<script type="module" src="video.js?v=4"></script>

<!-- JuicyAds -->
<script type="module">
  import { initJuicyAds } from "./ads.js";

  initJuicyAds({
    float: true,
    native: true
  });
</script>

</body>
  </html>
