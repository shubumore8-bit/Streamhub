<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DesiVexa - Video</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.search{
  flex:1;
  max-width:600px;
  margin:auto;
}

.search input{
  width:100%;
  padding:11px 17px;
  border-radius:25px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1200px;
  margin:25px auto;
}

.player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #252525;
}

.player video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
}

.video-info{
  padding:18px 0;
}

.video-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:10px;
}

.meta{
  color:#999;
  font-size:14px;
  margin-bottom:15px;
}

.description{
  color:#bbb;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:10px;
  margin:18px 0;
  flex-wrap:wrap;
}

.action{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:11px 18px;
  border-radius:7px;
  cursor:pointer;
}

.action:hover{
  border-color:#e50914;
}

.action.like.active{
  background:#e50914;
  border-color:#e50914;
}

.ad{
  min-height:80px;
  background:#111;
  border:1px dashed #333;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  margin:20px 0;
}

.section-title{
  margin:30px 0 15px;
  font-size:21px;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#121212;
  border:1px solid #222;
  border-radius:9px;
  overflow:hidden;
}

.card:hover{
  border-color:#e50914;
}

.thumb{
  height:145px;
  background:linear-gradient(135deg,#270000,#151515,#400000);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.play{
  color:#e50914;
  font-size:40px;
}

.duration{
  position:absolute;
  right:7px;
  bottom:7px;
  background:#000;
  padding:4px 6px;
  font-size:11px;
  border-radius:4px;
}

.card-info{
  padding:10px;
}

.card-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  color:#777;
  font-size:12px;
  margin-top:6px;
}

/* COMMENTS */

.comments{
  margin-top:35px;
  scroll-margin-top:85px;
}

.comment-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.comment-box input{
  flex:1;
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:12px;
  border-radius:7px;
  outline:none;
}

.comment-box button{
  background:#e50914;
  border:0;
  color:#fff;
  padding:0 18px;
  border-radius:7px;
  cursor:pointer;
}

.comment{
  background:#111;
  border:1px solid #222;
  border-radius:8px;
  padding:13px;
  margin-bottom:10px;
}

.comment-user{
  font-weight:bold;
  margin-bottom:6px;
}

.comment-text{
  color:#bbb;
}

.empty{
  color:#777;
  padding:20px 0;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.bottom-nav a{
  color:#aaa;
  text-align:center;
  font-size:12px;
}

.bottom-nav a:hover{
  color:#e50914;
}

.bottom-nav div{
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:850px){

  .related-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .container{
    width:94%;
    margin-top:15px;
  }

  .video-title{
    font-size:20px;
  }

  .related-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .thumb{
    height:110px;
  }

  .actions{
    gap:7px;
  }

  .action{
    padding:10px 14px;
  }

}

@media(max-width:380px){

  .search{
    display:none;
  }

}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    DesiVexa
  </a>

  <div class="search">
    <input
      type="text"
      placeholder="Search videos..."
      onkeydown="searchVideo(event)"
    >
  </div>

  <a href="profile.html" class="profile">
    P
  </a>

</header>


<main class="container">

  <!-- VIDEO PLAYER -->

  <div class="player">

    <!-- Replace this demo source with your authorized video URL -->
    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    >
      <source
        src=""
        type="video/mp4"
      >

      Your browser does not support video playback.
    </video>

  </div>


  <!-- VIDEO INFORMATION -->

  <section class="video-info">

    <h1
      class="video-title"
      id="videoTitle">
      Loading Video...
    </h1>

    <div
      class="meta"
      id="videoMeta">
      Loading...
    </div>

    <div
      class="description"
      id="videoDescription">
      Video description will appear here.
    </div>


    <!-- LIKE + COMMENT -->

    <div class="actions">

      <button
        class="action like"
        id="likeButton"
        onclick="toggleLike()">
        ♥ Like
      </button>

      <button
        class="action"
        onclick="scrollToComments()">
        💬 Comment
      </button>

      <button
        class="action"
        onclick="shareVideo()">
        ↗ Share
      </button>

    </div>

  </section>


  <!-- AD -->

  <div class="ad">
    Advertisement
  </div>


  <!-- RELATED VIDEOS -->

  <h2 class="section-title">
    Related Videos
  </h2>

  <div
    class="related-grid"
    id="relatedGrid">
  </div>


  <!-- COMMENTS -->

  <section
    class="comments"
    id="comments">

    <h2 class="section-title">
      Comments
    </h2>

    <div class="comment-box">

      <input
        id="commentInput"
        type="text"
        placeholder="Write a comment..."
      >

      <button onclick="addComment()">
        Post
      </button>

    </div>

    <div id="commentList">

      <div class="comment">

        <div class="comment-user">
          User
        </div>

        <div class="comment-text">
          Welcome to DesiVexa.
        </div>

      </div>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="new.html">
    <div>★</div>
    Latest
  </a>

  <a href="trending.html">
    <div>🔥</div>
    Trending
  </a>

  <a href="recommended.html">
    <div>♥</div>
    Recommended
  </a>

  <a href="profile.html">
    <div>●</div>
    Profile
  </a>

</nav>


<script>

/* =========================
   GET VIDEO ID
========================= */

const params = new URLSearchParams(
  window.location.search
);

const videoId =
  params.get("id") || "1";


/* =========================
   DEMO VIDEO DATA
========================= */

const video = {

  id:videoId,

  title:"DesiVexa Video "+videoId,

  views:"12,450 views",

  category:"Recommended",

  description:
    "Video description goes here. " +
    "Replace this demo information with " +
    "your actual authorized video data."

};


/* =========================
   DISPLAY VIDEO
========================= */

document.getElementById("videoTitle")
  .textContent=video.title;

document.getElementById("videoMeta")
  .textContent=
    video.views+
    " • "+
    video.category;

document.getElementById("videoDescription")
  .textContent=video.description;


/* =========================
   RELATED VIDEOS
   24 VIDEOS
========================= */

const related=[];

for(let i=1;i<=24;i++){

  related.push({

    id:"related-"+i,

    title:"Related Video "+i,

    views:(i*921)+" views",

    duration:
      "9:"+
      String((i%50)+5).padStart(2,"0")

  });

}


function renderRelated(){

  const grid=
    document.getElementById(
      "relatedGrid"
    );

  grid.innerHTML=
    related.map(v=>`

      <a
        href="video.html?id=${v.id}"
        class="card">

        <div class="thumb">

          <div class="play">
            ▶
          </div>

          <div class="duration">
            ${v.duration}
          </div>

        </div>

        <div class="card-info">

          <div class="card-title">
            ${v.title}
          </div>

          <div class="card-meta">
            ${v.views}
          </div>

        </div>

      </a>

    `).join("");

}

renderRelated();


/* =========================
   LIKE
========================= */

function toggleLike(){

  const button=
    document.getElementById(
      "likeButton"
    );

  button.classList.toggle("active");

}


/* =========================
   COMMENT SCROLL
========================= */

function scrollToComments(){

  document
    .getElementById("comments")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   ADD COMMENT
========================= */

function addComment(){

  const input=
    document.getElementById(
      "commentInput"
    );

  const text=
    input.value.trim();

  if(!text){
    return;
  }

  const list=
    document.getElementById(
      "commentList"
    );

  const comment=
    document.createElement("div");

  comment.className="comment";

  comment.innerHTML=`

    <div class="comment-user">
      You
    </div>

    <div class="comment-text">
      ${escapeHtml(text)}
    </div>

  `;

  list.prepend(comment);

  input.value="";

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}


/* =========================
   SHARE
========================= */

async function shareVideo(){

  const url=
    window.location.href;

  if(navigator.share){

    try{

      await navigator.share({
        title:video.title,
        url:url
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(url);

    alert("Video link copied!");

  }

}


/* =========================
   SEARCH
========================= */

function searchVideo(event){

  if(event.key==="Enter"){

    const value=
      event.target.value.trim();

    if(value){

      window.location.href=
        "search.html?q="+
        encodeURIComponent(value);

    }

  }

}

</script>

</body>
</html>
