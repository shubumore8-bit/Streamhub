<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Categories - DesiVexa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      height: 60px;
      background: #111;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #ff1744;
      font-size: 22px;
      font-weight: 800;
    }

    .search-icon {
      font-size: 22px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 12px 40px;
    }

    .categories-button {
      width: 100%;
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .categories-button span:last-child {
      color: #aaa;
      font-size: 13px;
    }

    .search-area {
      display: none;
      margin-top: 14px;
    }

    .search-area.show {
      display: block;
    }

    .search-box {
      width: 100%;
      height: 48px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      border-radius: 8px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
    }

    .search-box:focus {
      border-color: #e50935;
    }

    .search-help {
      color: #777;
      font-size: 12px;
      margin-top: 8px;
    }

    .category-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    .category-list::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      flex: 0 0 auto;
      padding: 9px 14px;
      background: #181818;
      border: 1px solid #303030;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      color: #ddd;
    }

    .category-chip:hover,
    .category-chip.active {
      background: #e50935;
      border-color: #e50935;
      color: #fff;
    }

    .result-title {
      margin: 24px 0 14px;
      font-size: 19px;
      font-weight: 700;
    }

    .status {
      text-align: center;
      color: #888;
      padding: 35px 10px;
      font-size: 14px;
    }

    .error {
      color: #ff526f;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .video-card {
      background: #151515;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      position: relative;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0,0,0,.85);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .video-info {
      padding: 9px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      margin-top: 6px;
      color: #888;
      font-size: 11px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 55px 10px;
      color: #777;
      font-size: 14px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 28px;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .page-btn.active {
      background: #e50935;
      border-color: #e50935;
    }

    .page-btn:hover {
      background: #e50935;
    }

    @media (min-width: 700px) {
      .video-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">DesiVexa</a>

  <div class="search-icon" id="topSearch">
    🔍
  </div>
</header>

<div class="container">

  <button class="categories-button" id="categoriesButton">
    <span>Categories</span>
    <span id="arrow">▼</span>
  </button>

  <div class="search-area" id="searchArea">

    <input
      type="search"
      id="searchInput"
      class="search-box"
      placeholder="Search videos or category..."
      autocomplete="off"
    >

    <div class="search-help">
      Video name ya category type karo.
    </div>

    <div class="category-list" id="categoryList">

      <button
        class="category-chip active"
        data-category="all">
        All
      </button>

    </div>

  </div>

  <div class="result-title" id="resultTitle">
    All Videos
  </div>

  <div id="loading" class="status">
    Videos loading...
  </div>

  <div id="videoGrid" class="video-grid"></div>

  <div id="empty" class="empty">
    No videos found.
  </div>

  <div id="errorBox" class="status error" style="display:none;"></div>

  <div class="pagination" id="pagination" style="display:none;"></div>

</div>

<script type="module">

  import { createClient }
    from "https://esm.sh/@supabase/supabase-js@2";

  import {
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  } from "./config.js";


  /* ================================
     SUPABASE
  ================================= */

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* ================================
     ELEMENTS
  ================================= */

  const searchArea =
    document.getElementById("searchArea");

  const searchInput =
    document.getElementById("searchInput");

  const categoriesButton =
    document.getElementById("categoriesButton");

  const categoryList =
    document.getElementById("categoryList");

  const arrow =
    document.getElementById("arrow");

  const videoGrid =
    document.getElementById("videoGrid");

  const empty =
    document.getElementById("empty");

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("errorBox");

  const resultTitle =
    document.getElementById("resultTitle");

  const pagination =
    document.getElementById("pagination");


  /* ================================
     VARIABLES
  ================================= */

  let allVideos = [];

  let filteredVideos = [];

  let currentCategory = "all";

  let currentPage = 1;

  const perPage = 8;


  /* ================================
     OPEN / CLOSE SEARCH
  ================================= */

  function openSearch() {

    searchArea.classList.add("show");

    arrow.textContent = "▲";

    setTimeout(() => {
      searchInput.focus();
    }, 100);

  }


  function closeSearch() {

    searchArea.classList.remove("show");

    arrow.textContent = "▼";

  }


  categoriesButton.addEventListener(
    "click",
    () => {

      if (
        searchArea.classList.contains("show")
      ) {
        closeSearch();
      } else {
        openSearch();
      }

    }
  );


  document
    .getElementById("topSearch")
    .addEventListener(
      "click",
      openSearch
    );


  /* ================================
     LOAD VIDEOS FROM SUPABASE
  ================================= */

  async function loadVideos() {

    loading.style.display = "block";

    errorBox.style.display = "none";

    try {

      const {
        data,
        error
      } = await supabase

        .from("videos")

        .select(`
          id,
          title,
          category,
          description,
          thumbnail_url,
          video_url,
          views,
          created_at
        `)

        .eq("published", true)

        .order(
          "created_at",
          {
            ascending: false
          }
        )

        .limit(200);


      if (error) {
        throw error;
      }


      allVideos = data || [];

      filteredVideos = [...allVideos];


      loading.style.display = "none";


      buildCategories();

      applyFilter(false);


    } catch (error) {

      console.error(
        "Category videos error:",
        error
      );

      loading.style.display = "none";

      errorBox.textContent =
        "Videos load nahi ho paaye. Supabase settings check karo.";

      errorBox.style.display = "block";

    }

  }


  /* ================================
     BUILD REAL CATEGORIES
  ================================= */

  function buildCategories() {

    categoryList.innerHTML = "";


    const allButton =
      document.createElement("button");

    allButton.className =
      "category-chip active";

    allButton.dataset.category =
      "all";

    allButton.textContent =
      "All";

    categoryList.appendChild(
      allButton
    );


    const categories = [
      ...new Set(

        allVideos

          .map(video =>
            String(
              video.category || ""
            ).trim()
          )

          .filter(Boolean)

      )
    ];


    categories.sort(
      (a, b) =>
        a.localeCompare(b)
    );


    categories.forEach(
      category => {

        const button =
          document.createElement("button");

        button.className =
          "category-chip";

        button.dataset.category =
          category;

        button.textContent =
          category;

        categoryList.appendChild(
          button
        );

      }
    );


    document
      .querySelectorAll(
        ".category-chip"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentCategory =
              button.dataset.category;


            document
              .querySelectorAll(
                ".category-chip"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            if (
              currentCategory === "all"
            ) {

              searchInput.value = "";

            } else {

              searchInput.value =
                currentCategory;

            }


            applyFilter();

          }
        );

      });

  }


  /* ================================
     SEARCH + CATEGORY FILTER
  ================================= */

  function applyFilter(
    scrollTop = true
  ) {

    const searchText =
      searchInput.value
        .trim()
        .toLowerCase();


    filteredVideos =
      allVideos.filter(video => {

        const title =
          String(
            video.title || ""
          ).toLowerCase();


        const category =
          String(
            video.category || ""
          ).toLowerCase();


        const description =
          String(
            video.description || ""
          ).toLowerCase();


        const matchesSearch =
          !searchText ||
          title.includes(searchText) ||
          category.includes(searchText) ||
          description.includes(searchText);


        const matchesCategory =
          currentCategory === "all" ||
          category ===
            currentCategory.toLowerCase();


        return (
          matchesSearch &&
          matchesCategory
        );

      });


    currentPage = 1;

    updateResultTitle();

    renderVideos(
      scrollTop
    );

  }


  searchInput.addEventListener(
    "input",
    () => {

      /*
        Agar user manually search kare,
        category ko All kar dete hain.
      */

      currentCategory = "all";


      document
        .querySelectorAll(
          ".category-chip"
        )
        .forEach(btn => {

          btn.classList.toggle(
            "active",
            btn.dataset.category === "all"
          );

        });


      applyFilter();

    }
  );


  /* ================================
     RESULT TITLE
  ================================= */

  function updateResultTitle() {

    const searchText =
      searchInput.value.trim();


    const count =
      filteredVideos.length;


    if (searchText) {

      resultTitle.textContent =
        `Results for "${searchText}" (${count})`;

    } else if (
      currentCategory !== "all"
    ) {

      resultTitle.textContent =
        `${currentCategory} Videos (${count})`;

    } else {

      resultTitle.textContent =
        `All Videos (${count})`;

    }

  }


  /* ================================
     FORMAT VIEWS
  ================================= */

  function formatViews(views) {

    const number =
      Number(views || 0);


    if (number >= 1000000) {

      return (
        (number / 1000000)
          .toFixed(1)
          .replace(".0", "")
        + "M views"
      );

    }


    if (number >= 1000) {

      return (
        (number / 1000)
          .toFixed(1)
          .replace(".0", "")
        + "K views"
      );

    }


    return number + " views";

  }


  /* ================================
     TIME AGO
  ================================= */

  function timeAgo(date) {

    if (!date) {
      return "";
    }


    const seconds =
      Math.floor(
        (
          Date.now() -
          new Date(date).getTime()
        ) / 1000
      );


    if (seconds < 60) {
      return "Just now";
    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    if (minutes < 60) {
      return minutes + "m ago";
    }


    const hours =
      Math.floor(
        minutes / 60
      );


    if (hours < 24) {
      return hours + "h ago";
    }


    const days =
      Math.floor(
        hours / 24
      );


    if (days < 30) {
      return days + "d ago";
    }


    const months =
      Math.floor(
        days / 30
      );


    if (months < 12) {
      return months + "mo ago";
    }


    return (
      Math.floor(
        months / 12
      ) + "y ago"
    );

  }


  /* ================================
     THUMBNAIL FALLBACK
  ================================= */

  function thumbnailFallback() {

    return `
      data:image/svg+xml;charset=UTF-8,
      ${encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="340"
          viewBox="0 0 600 340"
        >
          <rect
            width="600"
            height="340"
            fill="#202020"
          />

          <text
            x="300"
            y="170"
            fill="#777"
            font-size="22"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Arial"
          >
            DesiVexa
          </text>
        </svg>
      `)}
    `;

  }


  /* ================================
     RENDER VIDEOS
  ================================= */

  function renderVideos(
    scrollTop = true
  ) {

    videoGrid.innerHTML = "";


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          filteredVideos.length /
          perPage
        )
      );


    if (
      filteredVideos.length === 0
    ) {

      empty.style.display =
        "block";

      pagination.style.display =
        "none";

      return;

    }


    empty.style.display =
      "none";


    pagination.style.display =
      "flex";


    if (
      currentPage > totalPages
    ) {
      currentPage = totalPages;
    }


    const start =
      (currentPage - 1) *
      perPage;


    const pageVideos =
      filteredVideos.slice(
        start,
        start + perPage
      );


    pageVideos.forEach(
      video => {

        const card =
          document.createElement("a");


        card.className =
          "video-card";


        card.href =
          "video.html?id=" +
          encodeURIComponent(
            video.id
          );


        const thumbnail =
          video.thumbnail_url ||
          thumbnailFallback();


        const title =
          video.title ||
          "Untitled Video";


        const category =
          video.category ||
          "Uncategorized";


        card.innerHTML = `

          <div class="thumb">

            <img
              src="${thumbnail}"
              alt="${escapeHtml(title)}"
              loading="lazy"
              onerror="this.src='${thumbnailFallback()}'"
            >

          </div>

          <div class="video-info">

            <div class="video-title">
              ${escapeHtml(title)}
            </div>

            <div class="meta">
              ${formatViews(video.views)}
              •
              ${escapeHtml(category)}
              ${video.created_at
                ? " • " +
                  timeAgo(video.created_at)
                : ""}
            </div>

          </div>

        `;


        videoGrid.appendChild(
          card
        );

      }
    );


    updatePagination();


    if (scrollTop) {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  }


  /* ================================
     ESCAPE HTML
  ================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ================================
     PAGINATION
  ================================= */

  function updatePagination() {

    pagination.innerHTML = "";


    const totalPages =
      Math.ceil(
        filteredVideos.length /
        perPage
      );


    if (totalPages <= 1) {

      pagination.style.display =
        "none";

      return;

    }


    pagination.style.display =
      "flex";


    /*
      Previous
    */

    const previous =
      document.createElement("button");

    previous.className =
      "page-btn";

    previous.textContent =
      "Previous";

    previous.disabled =
      currentPage === 1;

    previous.style.opacity =
      currentPage === 1
        ? "0.4"
        : "1";


    previous.onclick =
      () => {

        if (currentPage > 1) {

          currentPage--;

          renderVideos();

        }

      };


    pagination.appendChild(
      previous
    );


    /*
      Page numbers
    */

    let startPage =
      Math.max(
        1,
        currentPage - 2
      );


    let endPage =
      Math.min(
        totalPages,
        startPage + 4
      );


    if (
      endPage - startPage < 4
    ) {

      startPage =
        Math.max(
          1,
          endPage - 4
        );

    }


    for (
      let page = startPage;
      page <= endPage;
      page++
    ) {

      const button =
        document.createElement("button");

      button.className =
        "page-btn";


      if (
        page === currentPage
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        page;


      button.onclick =
        () => {

          currentPage =
            page;

          renderVideos();

        };


      pagination.appendChild(
        button
      );

    }


    /*
      Next
    */

    const next =
      document.createElement("button");

    next.className =
      "page-btn";

    next.textContent =
      "Next";


    next.style.display =
      currentPage < totalPages
        ? "block"
        : "none";


    next.onclick =
      () => {

        if (
          currentPage <
          totalPages
        ) {

          currentPage++;

          renderVideos();

        }

      };


    pagination.appendChild(
      next
    );

  }


  /* ================================
     START
  ================================= */

  loadVideos();

</script>

</body>
</html>
