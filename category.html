<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Category Videos - DesiVexa</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#121212;--red:#f21d35;--text:#f6f6f6;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:#090909;border-bottom:1px solid #292929;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:24px;text-decoration:none;color:#fff}.logo span{color:var(--red)}.back{color:#fff;text-decoration:none;border:1px solid #3a2529;border-radius:999px;padding:9px 13px;font-size:13px}
main{max-width:1200px;margin:auto;padding:18px 14px 40px}.searchrow{display:flex;gap:8px;margin:12px 0 18px}.searchrow input{min-width:0;flex:1;background:#111;border:1px solid #3a2529;border-radius:12px;padding:12px;color:#fff;outline:none}.searchrow input:focus{border-color:var(--red)}button{background:var(--red);color:white;border:0;border-radius:12px;padding:0 16px;font-weight:bold}
h1{font-size:22px;margin:10px 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{min-width:0;text-decoration:none;color:#fff;background:var(--panel);border:1px solid #242424;border-radius:12px;overflow:hidden}.thumb{aspect-ratio:16/9;background:#1a1a1a;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:10px}.title{font-size:14px;line-height:1.4;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{color:var(--muted);font-size:11px;margin-top:7px}.state{padding:26px 12px;text-align:center;color:#bbb;background:#111;border-radius:12px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.pill{border:1px solid #462027;border-radius:999px;padding:7px 12px;color:#fff;background:#12090b;cursor:pointer}.pill.active{background:var(--red);border-color:var(--red)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.logo{font-size:21px}main{padding:14px 10px 30px}.title{font-size:13px}.info{padding:8px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Desi<span>Vexa</span></a><a class="back" href="index.html">← Home</a></header>
<main>
<h1 id="heading">Category Videos</h1><div class="sub" id="count">Loading videos…</div>
<form class="searchrow" id="categoryForm"><input id="categoryInput" type="search" placeholder="Search category name…" autocomplete="off"><button type="submit">Search</button></form>
<div class="pills" id="categoryPills"></div>
<div id="message" class="state">Loading videos…</div><div class="grid" id="videoGrid"></div>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const params=new URLSearchParams(location.search);
let selected=(params.get("name")||"").trim();
const heading=document.getElementById("heading"), count=document.getElementById("count"), input=document.getElementById("categoryInput"), grid=document.getElementById("videoGrid"), message=document.getElementById("message"), pills=document.getElementById("categoryPills");
input.value=selected;
function categories(value){if(Array.isArray(value))return value.map(x=>String(x).trim()).filter(Boolean);let s=String(value||"").trim();if(!s)return [];try{let p=JSON.parse(s);if(Array.isArray(p))return p.map(x=>String(x).trim()).filter(Boolean)}catch(e){}return s.split(",").map(x=>x.trim()).filter(Boolean)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function categoryMatches(video,name){if(!name)return true;return categories(video.category).some(c=>c.toLowerCase()===name.toLowerCase()) || String(video.title||"").toLowerCase().includes(name.toLowerCase())}
function renderPills(videos){const names=[...new Set(videos.flatMap(v=>categories(v.category)))].sort((a,b)=>a.localeCompare(b));pills.innerHTML=names.map(n=>`<button class="pill ${n.toLowerCase()===selected.toLowerCase()?'active':''}" type="button" data-name="${esc(n)}">${esc(n)}</button>`).join("");pills.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{location.href="category.html?name="+encodeURIComponent(b.dataset.name)}))}
function render(videos){const filtered=videos.filter(v=>categoryMatches(v,selected));heading.textContent=selected?`${selected} Videos`:"All Category Videos";count.textContent=`${filtered.length} video${filtered.length===1?'':'s'} found`;renderPills(videos);grid.innerHTML=filtered.map(v=>{const thumb=v.thumbnail_url||v.thumbnail||"";return `<a class="card" href="video.html?id=${encodeURIComponent(v.id)}"><div class="thumb">${thumb?`<img loading="lazy" src="${esc(thumb)}" alt="${esc(v.title||'Video')}" onerror="this.style.display='none'">`:'▶'}</div><div class="info"><div class="title">${esc(v.title||'Untitled video')}</div><div class="meta">${esc(categories(v.category).join(' · ')||'DesiVexa')} · ${Number(v.views||0).toLocaleString()} views</div></div></a>`}).join("");message.hidden=filtered.length>0;message.textContent=selected?`No videos found for “${selected}”. Try another category.`:"No published videos found.";grid.hidden=filtered.length===0}
document.getElementById("categoryForm").addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();location.href=q?"category.html?name="+encodeURIComponent(q):"category.html"});
async function load(){try{const {data,error}=await supabase.from("videos").select("id,title,category,description,thumbnail_url,video_url,views,created_at,published").eq("published",true).order("created_at",{ascending:false}).limit(500);if(error)throw error;render(data||[])}catch(e){message.hidden=false;message.textContent="Videos load nahi ho paaye. Supabase/config.js aur published status check karein.";count.textContent="Could not load videos";console.error(e)}}
load();
</script>
</body>
</html>
