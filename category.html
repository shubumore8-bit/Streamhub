<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - DesiVexa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      height: 60px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #ff1744;
      font-size: 23px;
      font-weight: 800;
    }

    .menu {
      font-size: 25px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 12px 40px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 18px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      background: #171717;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 14px;
      color: #ddd;
    }

    .category.active {
      background: #e50935;
      border-color: #e50935;
      color: #fff;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .video-card {
      background: #151515;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      position: relative;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0,0,0,.8);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .video-info {
      padding: 9px;
    }

    .video-title {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      color: #888;
      font-size: 11px;
      margin-top: 6px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .page-btn.active {
      background: #e50935;
      border-color: #e50935;
    }

    .page-btn:hover {
      background: #e50935;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px 10px;
      display: none;
    }

    @media (min-width: 700px) {
      .video-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">DesiVexa</a>
  <div class="menu">☰</div>
</header>

<div class="container">

  <h1>Categories</h1>

  <div class="categories">
    <a href="category.html?cat=all" class="category active">All</a>
    <a href="category.html?cat=popular" class="category">Popular</a>
    <a href="category.html?cat=new" class="category">New</a>
    <a href="category.html?cat=trending" class="category">Trending</a>
    <a href="category.html?cat=featured" class="category">Featured</a>
  </div>

  <div id="videoGrid" class="video-grid"></div>

  <div id="empty" class="empty">
    No videos found.
  </div>

  <div class="pagination">
    <button class="page-btn active" data-page="1">1</button>
    <button class="page-btn" data-page="2">2</button>
    <button class="page-btn" data-page="3">3</button>
    <button class="page-btn" data-page="4">4</button>
    <button class="page-btn" data-page="5">5</button>
    <button class="page-btn" id="nextBtn">Next</button>
  </div>

</div>

<script>
  /*
    Demo data.
    Baad me isi jagah Supabase/API se real videos load kar sakte hain.
  */

  const videos = [
    {
      id: "1",
      title: "Featured Video 01",
      thumbnail: "https://picsum.photos/600/340?random=101",
      views: "12K views",
      duration: "08:21"
    },
    {
      id: "2",
      title: "Featured Video 02",
      thumbnail: "https://picsum.photos/600/340?random=102",
      views: "9.8K views",
      duration: "12:10"
    },
    {
      id: "3",
      title: "Featured Video 03",
      thumbnail: "https://picsum.photos/600/340?random=103",
      views: "8.2K views",
      duration: "06:42"
    },
    {
      id: "4",
      title: "Featured Video 04",
      thumbnail: "https://picsum.photos/600/340?random=104",
      views: "7.4K views",
      duration: "10:05"
    },
    {
      id: "5",
      title: "Featured Video 05",
      thumbnail: "https://picsum.photos/600/340?random=105",
      views: "6.7K views",
      duration: "09:33"
    },
    {
      id: "6",
      title: "Featured Video 06",
      thumbnail: "https://picsum.photos/600/340?random=106",
      views: "5.9K views",
      duration: "07:18"
    },
    {
      id: "7",
      title: "Featured Video 07",
      thumbnail: "https://picsum.photos/600/340?random=107",
      views: "5.1K views",
      duration: "11:24"
    },
    {
      id: "8",
      title: "Featured Video 08",
      thumbnail: "https://picsum.photos/600/340?random=108",
      views: "4.8K views",
      duration: "05:56"
    },
    {
      id: "9",
      title: "Featured Video 09",
      thumbnail: "https://picsum.photos/600/340?random=109",
      views: "4.1K views",
      duration: "08:45"
    },
    {
      id: "10",
      title: "Featured Video 10",
      thumbnail: "https://picsum.photos/600/340?random=110",
      views: "3.9K views",
      duration: "13:02"
    },
    {
      id: "11",
      title: "Featured Video 11",
      thumbnail: "https://picsum.photos/600/340?random=111",
      views: "3.4K views",
      duration: "09:12"
    },
    {
      id: "12",
      title: "Featured Video 12",
      thumbnail: "https://picsum.photos/600/340?random=112",
      views: "2.8K views",
      duration: "06:31"
    }
  ];

  const grid = document.getElementById("videoGrid");
  const empty = document.getElementById("empty");

  const perPage = 8;
  let currentPage = 1;

  function renderVideos(page) {

    currentPage = page;

    grid.innerHTML = "";

    const start = (page - 1) * perPage;
    const end = start + perPage;

    const pageVideos = videos.slice(start, end);

    if (!pageVideos.length) {
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";

    pageVideos.forEach(video => {

      const card = document.createElement("a");

      card.className = "video-card";

      /*
        Video detail page.
        Agar tumhare video.html me query parameter ka naam
        alag hai to baad me isi line ko change kar denge.
      */
      card.href = "video.html?id=" + encodeURIComponent(video.id);

      card.innerHTML = `
        <div class="thumb">
          <img
            src="${video.thumbnail}"
            alt="${video.title}"
            loading="lazy"
          >
          <span class="duration">${video.duration}</span>
        </div>

        <div class="video-info">
          <div class="video-title">${video.title}</div>
          <div class="meta">${video.views}</div>
        </div>
      `;

      grid.appendChild(card);
    });

    document.querySelectorAll(".page-btn[data-page]").forEach(btn => {
      btn.classList.toggle(
        "active",
        Number(btn.dataset.page) === currentPage
      );
    });

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  document.querySelectorAll(".page-btn[data-page]").forEach(btn => {

    btn.addEventListener("click", () => {

      const page = Number(btn.dataset.page);

      renderVideos(page);

    });

  });

  document.getElementById("nextBtn").addEventListener("click", () => {

    const maxPage = Math.ceil(videos.length / perPage);

    if (currentPage < maxPage) {
      renderVideos(currentPage + 1);
    }

  });

  renderVideos(1);
</script>

</body>
</html>
