<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DesiVexa - Category</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 5%;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.search{
  flex:1;
  max-width:600px;
  margin:auto;
}

.search input{
  width:100%;
  padding:11px 17px;
  border-radius:25px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1400px;
  margin:25px auto;
}

.category-head{
  background:#111;
  border:1px solid #292929;
  border-radius:10px;
  padding:20px;
  margin-bottom:25px;
}

.category-head h1{
  font-size:26px;
}

.category-head p{
  color:#888;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:#121212;
  border:1px solid #222;
  border-radius:9px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#e50914;
}

.thumb{
  height:160px;
  background:linear-gradient(135deg,#270000,#151515,#400000);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.play{
  font-size:42px;
  color:#e50914;
}

.duration{
  position:absolute;
  right:7px;
  bottom:7px;
  background:#000;
  padding:4px 7px;
  border-radius:4px;
  font-size:11px;
}

.info{
  padding:12px;
}

.title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  color:#888;
  font-size:12px;
  margin-top:7px;
}

.empty{
  color:#777;
  padding:30px 0;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:30px 0;
}

.pagination button{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px 14px;
  border-radius:6px;
  cursor:pointer;
}

.pagination button:hover,
.pagination button.active{
  background:#e50914;
  border-color:#e50914;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-nav a{
  color:#aaa;
  text-align:center;
  font-size:12px;
}

.bottom-nav a.active{
  color:#e50914;
}

.bottom-nav div{
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .search{
    max-width:none;
  }

  .container{
    width:94%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .thumb{
    height:115px;
  }

  .category-head h1{
    font-size:21px;
  }
}

@media(max-width:380px){
  .search{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    DesiVexa
  </a>

  <div class="search">
    <input
      type="text"
      placeholder="Search videos..."
      onkeydown="searchVideo(event)"
    >
  </div>

  <a href="profile.html" class="profile">
    P
  </a>

</header>


<main class="container">

  <section class="category-head">

    <h1 id="categoryTitle">
      Category
    </h1>

    <p id="categoryDescription">
      Videos in this category
    </p>

  </section>


  <div
    class="grid"
    id="categoryGrid">
  </div>


  <div
    class="pagination"
    id="pagination">
  </div>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="new.html">
    <div>★</div>
    Latest
  </a>

  <a href="trending.html">
    <div>🔥</div>
    Trending
  </a>

  <a href="recommended.html">
    <div>♥</div>
    Recommended
  </a>

  <a href="profile.html">
    <div>●</div>
    Profile
  </a>

</nav>


<script>

/* =========================
   GET CATEGORY
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const category =
  params.get("cat") || "All";


document.getElementById(
  "categoryTitle"
).textContent =
  category + " Videos";


document.getElementById(
  "categoryDescription"
).textContent =
  "Browse videos from the " +
  category +
  " category.";


/* =========================
   DEMO CATEGORY VIDEOS
========================= */

const videos=[];

for(let i=1;i<=60;i++){

  videos.push({

    id:
      "cat-" +
      category +
      "-" +
      i,

    title:
      category +
      " Video " +
      i,

    views:
      (i*1325) +
      " views",

    duration:
      "8:" +
      String(
        (i%55)+1
      ).padStart(2,"0")

  });

}


/* =========================
   PAGINATION
========================= */

const perPage=30;
let currentPage=1;

function render(){

  const start =
    (currentPage-1) *
    perPage;

  const end =
    start +
    perPage;

  const pageVideos =
    videos.slice(
      start,
      end
    );


  const grid =
    document.getElementById(
      "categoryGrid"
    );


  grid.innerHTML =
    pageVideos.map(video => `

      <a
        class="card"
        href="video.html?id=${encodeURIComponent(video.id)}">

        <div class="thumb">

          <div class="play">
            ▶
          </div>

          <div class="duration">
            ${video.duration}
          </div>

        </div>

        <div class="info">

          <div class="title">
            ${video.title}
          </div>

          <div class="meta">
            ${video.views}
          </div>

        </div>

      </a>

    `).join("");


  renderPagination();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   PAGINATION BUTTONS
========================= */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );

  const totalPages =
    Math.ceil(
      videos.length /
      perPage
    );

  let html="";


  html += `
    <button
      onclick="changePage(${currentPage-1})"
      ${currentPage===1?"disabled":""}>
      Previous
    </button>
  `;


  for(
    let i=1;
    i<=totalPages;
    i++
  ){

    html += `
      <button
        class="${i===currentPage?"active":""}"
        onclick="changePage(${i})">
        ${i}
      </button>
    `;

  }


  html += `
    <button
      onclick="changePage(${currentPage+1})"
      ${currentPage===totalPages?"disabled":""}>
      Next
    </button>
  `;


  pagination.innerHTML=html;

}


/* =========================
   CHANGE PAGE
========================= */

function changePage(page){

  const totalPages =
    Math.ceil(
      videos.length /
      perPage
    );

  if(
    page<1 ||
    page>totalPages
  ){
    return;
  }

  currentPage=page;

  render();

}


/* =========================
   SEARCH
========================= */

function searchVideo(event){

  if(event.key==="Enter"){

    const value =
      event.target.value.trim();

    if(value){

      window.location.href =
        "search.html?q=" +
        encodeURIComponent(value);

    }

  }

}


/* START */

render();

</script>

</body>
</html>
