<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="DesiVexa - Trending, New and Recommended videos">

  <title>DesiVexa - Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #02070d;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      min-height: 100vh;
      background: #06111a;
      padding-bottom: 90px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 72px;
      display: grid;
      grid-template-columns: 55px 1fr 110px;
      align-items: center;
      padding: 0 18px;
      background: #030b12;
      border-bottom: 1px solid #182631;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .menu-btn,
    .icon-btn {
      background: none;
      border: 0;
      color: white;
      font-size: 30px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff1744;
    }

    .header-right {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .icon-btn {
      font-size: 27px;
    }

    /* =========================
       SIDE MENU
    ========================= */

    .side-menu {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      background: #07131d;
      z-index: 2000;
      transition: .25s ease;
      border-right: 1px solid #243440;
      box-shadow: 10px 0 30px rgba(0,0,0,.45);
    }

    .side-menu.active {
      left: 0;
    }

    .menu-header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #243440;
    }

    .menu-logo {
      font-size: 24px;
      font-weight: 800;
    }

    .menu-logo span {
      color: #ff1744;
    }

    .close-menu {
      background: none;
      border: 0;
      color: white;
      font-size: 30px;
    }

    .menu-list {
      padding: 15px;
    }

    .menu-item {
      width: 100%;
      padding: 15px;
      margin-bottom: 8px;
      background: #0b1b27;
      border: 1px solid #172c3b;
      border-radius: 12px;
      color: white;
      text-align: left;
      font-size: 16px;
    }

    .menu-item:hover {
      background: #ff1744;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 1500;
      display: none;
    }

    .menu-overlay.active {
      display: block;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      display: none;
      padding: 12px 18px;
      background: #06111a;
      border-bottom: 1px solid #172936;
    }

    .search-box.active {
      display: block;
    }

    .search-input {
      width: 100%;
      height: 46px;
      border: 1px solid #2a3c4a;
      background: #0a1823;
      color: white;
      border-radius: 12px;
      padding: 0 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #ff1744;
    }

    /* =========================
       TOP BANNER
    ========================= */

    .top-banner {
      margin: 18px;
      min-height: 74px;
      border: 1px solid #ff1744;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #160914,
        #25101a,
        #120b12
      );
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      gap: 15px;
    }

    .banner-text {
      font-size: 15px;
      font-weight: 700;
    }

    .banner-button {
      border: 0;
      border-radius: 22px;
      background: #ff1744;
      color: white;
      padding: 11px 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       CATEGORIES
    ========================= */

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 18px 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid #20394a;
      background: #0b1c2a;
      color: #dce5ed;
      border-radius: 11px;
      padding: 10px 19px;
      font-weight: 600;
    }

    .category.active,
    .category:hover {
      background: #ff1744;
      border-color: #ff1744;
      color: white;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      padding: 15px 18px 0;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      font-weight: 800;
    }

    .section-title .emoji {
      font-size: 25px;
    }

    .view-all {
      border: 0;
      background: transparent;
      color: #ff1744;
      font-weight: 700;
      font-size: 14px;
    }

    /* =========================
       VIDEO GRID
    ========================= */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .video-card {
      min-width: 0;
      cursor: pointer;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-radius: 9px;
      background: #0b1822;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .25s ease;
    }

    .video-card:hover .thumbnail img {
      transform: scale(1.04);
    }

    .play-icon {
      position: absolute;
      left: 9px;
      bottom: 9px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .duration {
      position: absolute;
      right: 7px;
      bottom: 7px;
      background: rgba(0,0,0,.82);
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
    }

    .video-title {
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      min-height: 39px;
    }

    .tag {
      display: inline-block;
      margin-top: 7px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #ff1744;
      color: white;
      font-size: 11px;
      font-weight: 800;
    }

    .video-info {
      margin-top: 7px;
      color: #aebdca;
      font-size: 12px;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      opacity: .6;
    }

    /* =========================
       RANDOM
    ========================= */

    .random-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 13px;
    }

    .random-grid .video-title {
      font-size: 13px;
      min-height: auto;
    }

    .random-grid .tag,
    .random-grid .video-info {
      display: none;
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 22px 0 8px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid #24394a;
      background: #0b1b28;
      color: white;
      padding: 0 11px;
    }

    .page-btn.active,
    .page-btn:hover {
      background: #ff1744;
      border-color: #ff1744;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      color: #8293a1;
      padding: 35px 10px;
      display: none;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1100px;
      height: 72px;
      background: rgba(3,11,18,.97);
      border-top: 1px solid #1b2b38;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 1200;
      backdrop-filter: blur(12px);
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #aebdca;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
    }

    .nav-icon {
      font-size: 22px;
    }

    .nav-item.active {
      color: #ff1744;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 901px) {

      .bottom-nav {
        position: static;
        transform: none;
        margin-top: 30px;
        max-width: none;
        border: 0;
      }

      .app {
        padding-bottom: 0;
      }

      .header {
        border-radius: 0;
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .video-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .random-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        height: 66px;
        grid-template-columns: 48px 1fr 92px;
        padding: 0 12px;
      }

      .logo {
        font-size: 27px;
      }

      .menu-btn {
        font-size: 27px;
      }

      .icon-btn {
        font-size: 24px;
      }

      .top-banner {
        margin: 14px 14px 16px;
        min-height: 67px;
        padding: 10px 12px;
      }

      .banner-text {
        font-size: 13px;
      }

      .banner-button {
        font-size: 12px;
        padding: 9px 13px;
      }

      .section {
        padding: 13px 14px 0;
      }

      .section-title {
        font-size: 20px;
      }

      .view-all {
        font-size: 13px;
      }

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px 12px;
      }

      .video-title {
        font-size: 14px;
      }

      .video-info {
        font-size: 11px;
      }

      .random-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .random-grid .video-title {
        font-size: 12px;
      }

      .categories {
        padding-left: 14px;
        padding-right: 14px;
      }

      .category {
        padding: 9px 16px;
        font-size: 13px;
      }
    }

    /* =========================
       SMALL PHONE
    ========================= */

    @media (max-width: 390px) {

        font-size: 24px;
      }

      .header {

      }

      .top-banner {
        gap: 8px;
      }

      .banner-text {
        font-size: 11px;
      }

      .banner-button {
        padding: 8px 10px;
        font-size: 11px;
      }

      .video-grid {
        gap: 15px 9px;
      }

      .video-title {
        font-size: 13px;
      }

      .random-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

      {
        title: "City Travel Guide",
        category: "Travel",
        duration: "14:20",
        image: "https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=700&q=80"
      },

      {
        title: "New Camera Review",
        category: "Tech",
        duration: "08:50",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=700&q=80"
      },

      {

        duration: "06:32",
        image: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=700&q=80"
      }

    ];


    /* ======================================
       CREATE VIDEO CARD
    ====================================== */

    function createCard(video) {

      return `
        <article
          class="video-card"
          data-title="${video.title.toLowerCase()}"
          data-category="${video.category.toLowerCase()}"
          onclick="openVideo('${escapeText(video.title)}')">

          <div class="thumbnail">

            <img
              src="${video.image}"
              alt="${escapeText(video.title)}"
              loading="lazy">

            <div class="play-icon">
              ▶
            </div>

            <div class="duration">
              ${video.duration}
            </div>

          </div>

          <div class="video-title">
            ${escapeText(video.title)}
          </div>

          <span class="tag">
            ${escapeText(video.category)}
          </span>

          ${
            video.views
            ?
            `
              <div class="video-info">
                <span>◉ ${video.views} views</span>
                <span class="dot">•</span>
                <span>${video.time}</span>
              </div>
            `
            :
            ""
          }

        </article>
      `;
    }


    function escapeText(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ======================================
       RENDER
    ====================================== */

    function renderVideos() {

      document.getElementById("trendingGrid").innerHTML =
        trendingVideos.map(createCard).join("");

      document.getElementById("newGrid").innerHTML =
        newVideos.map(createCard).join("");

      document.getElementById("recommendedGrid").innerHTML =
        recommendedVideos.map(createCard).join("");

      renderRandom();

    }


    /* ======================================
       RANDOM PAGINATION
    ====================================== */

    let randomPage = 1;

    const randomPerPage = 3;


    function renderRandom() {

      const start =
        (randomPage - 1) * randomPerPage;

      const end =
        start + randomPerPage;

      const videos =
        randomVideos.slice(start, end);

      document.getElementById("randomGrid").innerHTML =
        videos.map(createCard).join("");

      renderPagination();

    }


    function renderPagination() {

      const totalPages =
        Math.ceil(randomVideos.length / randomPerPage);

      let html = "";

      if (randomPage > 1) {

        html += `
          <button
            class="page-btn"
            onclick="changeRandomPage(${randomPage - 1})">
            ‹
          </button>
        `;

      }

      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        html += `
          <button
            class="page-btn ${i === randomPage ? "active" : ""}"
            onclick="changeRandomPage(${i})">
            ${i}
          </button>
        `;

      }

      if (randomPage < totalPages) {

        html += `
          <button
            class="page-btn"
            onclick="changeRandomPage(${randomPage + 1})">
            ›
          </button>
        `;

      }

      document.getElementById("pagination").innerHTML =
        html;

    }


    function changeRandomPage(page) {

      randomPage = page;

      renderRandom();

      document.getElementById("random")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    /* ======================================
       SEARCH
    ====================================== */

    const searchBtn =
      document.getElementById("searchBtn");

    const searchBox =
      document.getElementById("searchBox");

    const searchInput =
      document.getElementById("searchInput");


    searchBtn.addEventListener("click", () => {

      searchBox.classList.toggle("active");

      if (searchBox.classList.contains("active")) {
        searchInput.focus();
      }

    });


    searchInput.addEventListener("input", () => {

      const query =
        searchInput.value.toLowerCase().trim();

      document
        .querySelectorAll(".video-card")
        .forEach(card => {

          const title =
            card.dataset.title || "";

          const category =
            card.dataset.category || "";

          const match =
            title.includes(query) ||
            category.includes(query);

          card.style.display =
            match ? "" : "none";

        });

    });


    /* ======================================
       CATEGORY FILTER
    ====================================== */

    document
      .querySelectorAll(".category")
      .forEach(button => {

        button.addEventListener("click", () => {

          document
            .querySelectorAll(".category")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          const selected =
            button.dataset.category;

          if (selected === "All" || selected === "More") {

            document
              .querySelectorAll(".video-card")
              .forEach(card => {
                card.style.display = "";
              });

            return;
          }

          document
            .querySelectorAll(".video-card")
            .forEach(card => {

              const category =
                card.dataset.category || "";

              card.style.display =
                category === selected.toLowerCase()
                ? ""
                : "none";

            });

        });

      });


    /* ======================================
       MENU
    ====================================== */

    const menuBtn =
      document.getElementById("menuBtn");

    const closeMenu =
      document.getElementById("closeMenu");

    const sideMenu =
      document.getElementById("sideMenu");

    const menuOverlay =
      document.getElementById("menuOverlay");


    function openMenu() {

      sideMenu.classList.add("active");

      menuOverlay.classList.add("active");

    }


    function hideMenu() {

      sideMenu.classList.remove("active");

      menuOverlay.classList.remove("active");

    }


    menuBtn.addEventListener("click", openMenu);

    closeMenu.addEventListener("click", hideMenu);

    menuOverlay.addEventListener("click", hideMenu);


    /* ======================================
       SCROLL
    ====================================== */

    function scrollToSection(id) {

      hideMenu();

      const section =
        document.getElementById(id);

      if (section) {

        section.scrollIntoView({
          behavior: "smooth"
        });

      }

    }


    /* ======================================
       OTHER BUTTONS
    ====================================== */

    function showProfile() {

      alert(
        "Profile page yahan connect ki ja sakti hai."
      );

    }


    function showCategories() {

      hideMenu();

      document
        .getElementById("categories")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    function showAll(sectionName) {

      alert(
        sectionName +
        " videos ka full page yahan connect kiya ja sakta hai."
      );

    }


    function openVideo(title) {

      alert(
        "Video open: " + title
      );

    }


    /* ======================================
       INITIAL LOAD
    ====================================== */

    renderVideos();

  </script>

</body>
