<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DesiVexa - Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020911;
    --panel:#07131d;
    --panel2:#0b1924;
    --border:#1b2d3a;
    --red:#ff1744;
    --red2:#ff0038;
    --white:#fff;
    --muted:#aeb8c0;
}

body{
    background:#02070c;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* MAIN MOBILE APP */
.app{
    width:100%;
    max-width:700px;
    min-height:100vh;
    margin:auto;
    background:linear-gradient(180deg,#020a12,#06111a);
    padding-bottom:85px;
}

/* HEADER */
.header{
    height:92px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #26333c;
    background:#020910;
}

.menu{
    font-size:32px;
    cursor:pointer;
}

.logo{
    font-size:27px;
    font-weight:800;
}

.logo span{
    color:var(--red);
}

.header-icons{
    display:flex;
    gap:22px;
    align-items:center;
}

.search-icon{
    width:24px;
    height:24px;
    border:3px solid white;
    border-radius:50%;
    position:relative;
}

.search-icon:after{
    content:"";
    position:absolute;
    width:10px;
    height:3px;
    background:white;
    transform:rotate(45deg);
    right:-7px;
    bottom:-4px;
}

.profile-icon{
    width:22px;
    height:22px;
    border:2px solid white;
    border-radius:50%;
    position:relative;
}

.profile-icon:after{
    content:"";
    position:absolute;
    width:23px;
    height:11px;
    border:2px solid white;
    border-radius:15px 15px 0 0;
    left:-3px;
    top:18px;
}

/* AD */
.top-ad{
    margin:8px 18px 14px;
    height:58px;
    border:2px solid var(--red);
    border-radius:8px;
    background:linear-gradient(90deg,#350917,#220710);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

/* CATEGORIES */
.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:0 18px 13px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    padding:11px 17px;
    border-radius:11px;
    background:#101e29;
    border:1px solid #203442;
    color:white;
    font-size:14px;
}

.category.active{
    background:var(--red);
    border-color:var(--red);
}

/* SECTION */
.section{
    padding:0 18px;
    margin-bottom:15px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:4px 0 10px;
}

.title-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.title-icon{
    font-size:29px;
}

.section-title h2{
    font-size:21px;
}

.view-all{
    color:var(--red);
    font-size:14px;
    font-weight:bold;
}

/* FEATURED GRIDS */
.video-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.video-card{
    min-width:0;
    border-bottom:1px solid #1b2b35;
    padding-bottom:8px;
}

.thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:5px;
    background:
        linear-gradient(135deg,#5d4e4c,#252a31,#684c52);
}

.thumb:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 35% 45%,rgba(210,180,170,.7),transparent 23%),
        radial-gradient(circle at 70% 55%,rgba(130,100,105,.7),transparent 25%);
    filter:blur(10px);
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    z-index:2;
}

.duration{
    position:absolute;
    right:4px;
    bottom:4px;
    background:#000;
    padding:3px 5px;
    border-radius:3px;
    font-size:10px;
    z-index:3;
}

.video-title{
    font-size:12px;
    font-weight:bold;
    margin:7px 3px 5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tag{
    display:inline-block;
    padding:4px 8px;
    border-radius:8px;
    background:var(--red);
    font-size:10px;
    margin-bottom:5px;
}

.meta{
    color:#d3d8dc;
    font-size:10px;
    line-height:18px;
}

.dots{
    float:right;
    font-size:19px;
    line-height:15px;
}

/* RANDOM */
.random-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px 10px;
}

.random-card{
    min-width:0;
}

.random-card .thumb{
    border-radius:4px;
}

.random-card .play{
    width:28px;
    height:28px;
    font-size:13px;
}

.random-card .video-title{
    font-size:11px;
    font-weight:normal;
    margin-top:4px;
}

/* PAGINATION */
.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:12px 0 20px;
    flex-wrap:wrap;
}

.page-btn{
    min-width:38px;
    height:36px;
    padding:0 12px;
    border-radius:7px;
    border:1px solid #2b4351;
    background:#0b1924;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

.page-btn.active{
    background:var(--red);
    border-color:var(--red);
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:700px;
    height:76px;
    background:#020910;
    border-top:1px solid #24333d;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:11px;
    color:#fff;
}

.nav-icon{
    font-size:24px;
}

.nav-item.active{
    color:var(--red);
}

/* DESKTOP */
@media(min-width:701px){

    body{
        padding:20px 0;
    }

    .app{
        border:1px solid #20303b;
        border-radius:28px;
        overflow:hidden;
        box-shadow:0 0 50px rgba(0,0,0,.7);
    }

    .bottom-nav{
        position:fixed;
        bottom:20px;
        border-radius:0 0 28px 28px;
    }
}

/* SMALL PHONES */
@media(max-width:390px){

    .header{
        height:75px;
        padding:0 15px;
    }

    .logo{
        font-size:22px;
    }

    .video-grid{
        gap:7px;
    }

    .section{
        padding:0 12px;
    }

    .categories{
        padding-left:12px;
        padding-right:12px;
    }

    .section-title h2{
        font-size:18px;
    }

    .random-grid{
        gap:7px;
    }

    .video-title{
        font-size:10px;
    }

    .meta{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="menu">☰</div>

        <div class="logo">
            Desi<span>Vexa</span>
        </div>

        <div class="header-icons">
            <div class="search-icon"></div>
            <div class="profile-icon"></div>
        </div>

    </header>


    <!-- TOP AD -->
    <div class="top-ad">
        Top Banner Ad (320×100)
    </div>


    <!-- CATEGORIES -->
    <div class="categories">

        <div class="category active">All</div>
        <div class="category">Indian</div>
        <div class="category">Bhabhi</div>
        <div class="category">Desi</div>
        <div class="category">Mature</div>
        <div class="category">Lesbian</div>
        <div class="category">More⌄</div>

    </div>


    <!-- TRENDING -->
    <section class="section">

        <div class="section-title">

            <div class="title-left">
                <span class="title-icon">🔥</span>
                <h2>Trending Videos</h2>
            </div>

            <span class="view-all">View All →</span>

        </div>

        <div class="video-grid">

            <script>
                const trending = [
                    ["Trending Video 1","Indian","12:34","124K views","2 hours ago"],
                    ["Trending Video 2","Bhabhi","08:50","98K views","4 hours ago"],
                    ["Trending Video 3","Desi","15:20","156K views","6 hours ago"],
                    ["Trending Video 4","Mature","10:12","78K views","8 hours ago"]
                ];

                trending.forEach(v=>{
                    document.write(`
                    <div class="video-card">

                        <div class="thumb">
                            <div class="play">▶</div>
                            <div class="duration">${v[2]}</div>
                        </div>

                        <div class="video-title">${v[0]}</div>

                        <span class="tag">${v[1]}</span>

                        <div class="meta">
                            👁 ${v[3]} <span class="dots">⋮</span><br>
                            ◷ ${v[4]}
                        </div>

                    </div>
                    `);
                });
            </script>

        </div>

    </section>


    <!-- NEW VIDEOS -->
    <section class="section">

        <div class="section-title">

            <div class="title-left">
                <span class="title-icon">⭐</span>
                <h2>New Videos</h2>
            </div>

            <span class="view-all">View All →</span>

        </div>

        <div class="video-grid">

            <script>
                const newest = [
                    ["New Video 1","Desi","09:12","45K views","1 hour ago"],
                    ["New Video 2","Bhabhi","14:37","67K views","3 hours ago"],
                    ["New Video 3","Indian","07:45","32K views","5 hours ago"],
                    ["New Video 4","Mature","12:08","89K views","7 hours ago"]
                ];

                newest.forEach(v=>{
                    document.write(`
                    <div class="video-card">

                        <div class="thumb">
                            <div class="play">▶</div>
                            <div class="duration">${v[2]}</div>
                        </div>

                        <div class="video-title">${v[0]}</div>

                        <span class="tag">${v[1]}</span>

                        <div class="meta">
                            👁 ${v[3]} <span class="dots">⋮</span><br>
                            ◷ ${v[4]}
                        </div>

                    </div>
                    `);
                });
            </script>

        </div>

    </section>


    <!-- RECOMMENDED -->
    <section class="section">

        <div class="section-title">

            <div class="title-left">
                <span class="title-icon">👤</span>
                <h2>Recommended Videos</h2>
            </div>

            <span class="view-all">View All →</span>

        </div>

        <div class="video-grid">

            <script>
                const recommended = [
                    ["Recommended 1","Indian","11:30","76K views","12 hours ago"],
                    ["Recommended 2","Desi","08:15","93K views","14 hours ago"],
                    ["Recommended 3","Bhabhi","13:40","61K views","16 hours ago"],
                    ["Recommended 4","Mature","09:25","102K views","18 hours ago"]
                ];

                recommended.forEach(v=>{
                    document.write(`
                    <div class="video-card">

                        <div class="thumb">
                            <div class="play">▶</div>
                            <div class="duration">${v[2]}</div>
                        </div>

                        <div class="video-title">${v[0]}</div>

                        <span class="tag">${v[1]}</span>

                        <div class="meta">
                            👁 ${v[3]} <span class="dots">⋮</span><br>
                            ◷ ${v[4]}
                        </div>

                    </div>
                    `);
                });
            </script>

        </div>

    </section>


    <!-- RANDOM -->
    <section class="section">

        <div class="section-title">

            <div class="title-left">
                <span class="title-icon">🎲</span>
                <h2>Random Videos</h2>
            </div>

            <span class="view-all">View All →</span>

        </div>

        <div class="random-grid" id="randomGrid"></div>

    </section>


    <!-- PAGINATION -->
    <div class="pagination">

        <button class="page-btn">‹ Previous</button>

        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn">4</button>
        <button class="page-btn">5</button>

        <button class="page-btn">Next ›</button>

    </div>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <div class="nav-item active">
            <div class="nav-icon">⌂</div>
            <div>Home</div>
        </div>

        <div class="nav-item">
            <div class="nav-icon">◷</div>
            <div>Latest</div>
        </div>

        <div class="nav-item">
            <div class="nav-icon">♨</div>
            <div>Most Viewed</div>
        </div>

        <div class="nav-item">
            <div class="nav-icon">▦</div>
            <div>Categories</div>
        </div>

        <div class="nav-item">
            <div class="nav-icon">♙</div>
            <div>Profile</div>
        </div>

    </nav>

</div>


<script>

/* 30 RANDOM VIDEOS */

const randomVideos = [
    ["Video 1","06:12"],
    ["Video 2","09:34"],
    ["Video 3","11:20"],
    ["Video 4","08:45"],
    ["Video 5","12:33"],

    ["Video 6","07:18"],
    ["Video 7","14:52"],
    ["Video 8","10:17"],
    ["Video 9","13:40"],
    ["Video 10","13:40"],

    ["Video 11","11:56"],
    ["Video 12","08:29"],
    ["Video 13","15:12"],
    ["Video 14","07:46"],
    ["Video 15","12:08"],

    ["Video 16","09:37"],
    ["Video 17","14:03"],
    ["Video 18","06:54"],
    ["Video 19","11:22"],
    ["Video 20","13:17"],

    ["Video 21","00:48"],
    ["Video 22","12:37"],
    ["Video 23","12:37"],
    ["Video 24","09:06"],
    ["Video 25","15:44"],

    ["Video 26","07:33"],
    ["Video 27","11:09"],
    ["Video 28","14:28"],
    ["Video 29","08:50"],
    ["Video 30","12:16"]
];

const randomGrid = document.getElementById("randomGrid");

randomVideos.forEach(video => {

    const card = document.createElement("div");

    card.className = "random-card";

    card.innerHTML = `
        <div class="thumb">

            <div class="play">▶</div>

            <div class="duration">
                ${video[1]}
            </div>

        </div>

        <div class="video-title">
            ${video[0]}
        </div>
    `;

    randomGrid.appendChild(card);

});


/* CATEGORY BUTTON */

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".category")
            .forEach(x => x.classList.remove("active"));

        button.classList.add("active");

    });

});


/* PAGINATION */

document.querySelectorAll(".page-btn").forEach(button => {

    button.addEventListener("click", () => {

        if(
            button.textContent.trim() !== "‹ Previous" &&
            button.textContent.trim() !== "Next ›"
        ){

            document.querySelectorAll(".page-btn")
                .forEach(x => x.classList.remove("active"));

            button.classList.add("active");

        }

    });

});

</script>

</body>
</html>
