<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="DesiVexa - Discover trending, latest and recommended videos.">
  <title>DesiVexa - Home</title>

  <style>
    :root {
      --bg: #080808;
      --panel: #111111;
      --panel2: #171717;
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --red: #ff1744;
      --border: #292929;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }

    .app {
      max-width: 1200px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 80px;
      background: var(--bg);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 66px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 48px 1fr 88px;
      align-items: center;
      background: rgba(8,8,8,.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .menu-btn, .icon-btn {
      width: 42px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 0;
      color: white;
      background: transparent;
      font-size: 25px;
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -.8px;
    }
    .logo span, .menu-logo span { color: var(--red); }
    .header-right {
      display: flex;
      justify-content: flex-end;
      gap: 3px;
    }

    .side-menu {
      position: fixed;
      z-index: 2000;
      top: 0;
      bottom: 0;
      left: -300px;
      width: 280px;
      background: #101010;
      border-right: 1px solid var(--border);
      transition: left .25s ease;
    }
    .side-menu.active { left: 0; }
    .menu-header {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }
    .menu-logo { font-size: 23px; font-weight: 900; }
    .close-menu {
      border: 0;
      background: transparent;
      color: white;
      font-size: 30px;
    }
    .menu-list { padding: 14px; }
    .menu-item {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: white;
      text-align: left;
    }
    .menu-item:hover { border-color: var(--red); color: var(--red); }

    .menu-overlay {
      display: none;
      position: fixed;
      z-index: 1500;
      inset: 0;
      background: rgba(0,0,0,.7);
    }
    .menu-overlay.active { display: block; }

    .search-box {
      display: none;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .search-box.active { display: block; }
    .search-input {
      width: 100%;
      height: 45px;
      padding: 0 14px;
      color: white;
      background: #080808;
      border: 1px solid #383838;
      border-radius: 10px;
      outline: none;
    }
    .search-input:focus { border-color: var(--red); }

    .banner {
      margin: 15px;
      padding: 15px;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #702033;
      border-radius: 13px;
      background: linear-gradient(110deg, #1b0a0e, #171010, #0d0d0d);
    }
    .banner h2 { font-size: 16px; margin-bottom: 5px; }
    .banner p { color: #c4c4c4; font-size: 12px; line-height: 1.5; }
    .primary-btn {
      padding: 10px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: white;
      font-weight: 800;
      white-space: nowrap;
    }

    .category-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 0 15px 8px;
      scrollbar-width: none;
    }
    .category-row::-webkit-scrollbar { display: none; }
    .category {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid #333;
      border-radius: 22px;
      background: #151515;
      color: #ddd;
      font-size: 12px;
      font-weight: 700;
    }
    .category.active, .category:hover {
      border-color: var(--red);
      background: var(--red);
      color: white;
    }

    .section { padding: 12px 15px 0; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }
    .section-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.3;
    }
    .view-all {
      flex: 0 0 auto;
      padding: 6px 0 6px 8px;
      border: 0;
      background: transparent;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px 14px;
    }
    .video-card { min-width: 0; cursor: pointer; }
    .thumbnail {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 9px;
      background: #171717;
      border: 1px solid #222;
    }
    .thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .25s;
    }
    .video-card:hover .thumbnail img { transform: scale(1.04); }
    .fallback-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #181818, #300d18);
      color: var(--red);
      font-weight: 900;
      font-size: 20px;
    }
    .play-icon {
      position: absolute;
      bottom: 7px;
      left: 7px;
      width: 29px;
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0,0,0,.78);
      font-size: 12px;
    }
    .duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,.85);
      color: white;
      font-size: 10px;
      font-weight: 800;
    }
    .video-title {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .tag {
      display: inline-block;
      max-width: 100%;
      margin-top: 6px;
      padding: 4px 8px;
      overflow: hidden;
      border-radius: 20px;
      background: #291016;
      color: #ff718c;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .video-info {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .random-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px 12px;
    }
    .random-grid .video-title { font-size: 12px; }
    .random-grid .tag, .random-grid .video-info { display: none; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 22px 0 12px;
    }
    .page-btn {
      min-width: 37px;
      height: 37px;
      padding: 0 10px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #151515;
      color: white;
    }
    .page-btn.active, .page-btn:hover {
      border-color: var(--red);
      background: var(--red);
    }

    .status {
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .status.error { color: #ff8095; }
    .hidden { display: none !important; }

    .bottom-nav {
      position: fixed;
      z-index: 1200;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1200px;
      height: 68px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(10,10,10,.97);
      border-top: 1px solid #292929;
      backdrop-filter: blur(12px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 10px;
    }
    .nav-icon { font-size: 21px; }
    .nav-item.active { color: var(--red); }

    footer {
      padding: 25px 15px 10px;
      color: #777;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .video-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .random-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px 11px; }
      .random-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px 9px; }
      .section-title { font-size: 18px; }
      .video-title { font-size: 12px; }
      .banner h2 { font-size: 14px; }
      .banner p { font-size: 11px; }
    }
    @media (max-width: 380px) {
      .header { grid-template-columns: 42px 1fr 78px; padding: 0 8px; }
      .logo { font-size: 24px; }
      .random-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .banner { margin: 10px; padding: 11px; }
      .primary-btn { padding: 9px 10px; font-size: 11px; }
    }
  </style>
</head>

<body>
<div class="app" id="home">

  <header class="header">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <a href="index.html" class="logo">Desi<span>Vexa</span></a>
    <div class="header-right">
      <button class="icon-btn" id="searchBtn" aria-label="Search videos">⌕</button>
      <button class="icon-btn" id="categorySearchBtn" aria-label="Search categories">▦</button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <div class="menu-header">
      <div class="menu-logo">Desi<span>Vexa</span></div>
      <button class="close-menu" id="closeMenu" aria-label="Close menu">×</button>
    </div>
    <div class="menu-list">
      <button class="menu-item" data-scroll="home">⌂ Home</button>
      <button class="menu-item" data-scroll="trending">🔥 Trending Videos</button>
      <button class="menu-item" data-scroll="newVideos">✦ New Videos</button>
      <button class="menu-item" data-scroll="recommended">▣ Recommended Videos</button>
      <button class="menu-item" data-scroll="random">🎲 Random Videos</button>
      <button class="menu-item" id="menuCategories">▦ Search Categories</button>
    </div>
  </aside>

  <div class="search-box" id="searchBox">
    <input
      type="search"
      id="searchInput"
      class="search-input"
      placeholder="Search video title or category..."
      autocomplete="off"
      aria-label="Search videos by title or category"
    >
  </div>

  <section class="banner">
    <div>
      <h2>Welcome to DesiVexa</h2>
      <p>Discover trending videos and explore something new.</p>
    </div>
    <button class="primary-btn" id="exploreBtn">Explore Videos</button>
  </section>

  <div class="category-row" id="categories" aria-label="Video categories">
    <button class="category active" data-category="All">All Videos</button>
  </div>

  <section class="section" id="trending">
    <div class="section-header">
      <h2 class="section-title">🔥 Trending Videos</h2>
      <button class="view-all" data-scroll="trending">View All →</button>
    </div>
    <div class="video-grid" id="trendingGrid"></div>
  </section>

  <section class="section" id="newVideos">
    <div class="section-header">
      <h2 class="section-title">✦ New Videos</h2>
      <button class="view-all" data-scroll="newVideos">View All →</button>
    </div>
    <div class="video-grid" id="newGrid"></div>
  </section>

  <section class="section" id="recommended">
    <div class="section-header">
      <h2 class="section-title">▣ Recommended Videos</h2>
      <button class="view-all" data-scroll="recommended">View All →</button>
    </div>
    <div class="video-grid" id="recommendedGrid"></div>
  </section>

  <section class="section" id="random">
    <div class="section-header">
      <h2 class="section-title">🎲 Random Videos</h2>
    </div>
    <div class="random-grid" id="randomGrid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <div class="status" id="statusMessage">Loading videos...</div>

  <footer>
    <p>© <span id="year"></span> DesiVexa. All rights reserved.</p>
  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-scroll="home">
      <span class="nav-icon">⌂</span><span>Home</span>
    </button>
    <button class="nav-item" data-scroll="newVideos">
      <span class="nav-icon">◷</span><span>New</span>
    </button>
    <button class="nav-item" data-scroll="trending">
      <span class="nav-icon">🔥</span><span>Trending</span>
    </button>
    <button class="nav-item" data-scroll="recommended">
      <span class="nav-icon">▣</span><span>Recommended</span>
    </button>
    <button class="nav-item" data-scroll="random">
      <span class="nav-icon">🎲</span><span>Random</span>
    </button>
  </nav>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  let allVideos = [];
  let activeCategory = "All";
  let searchQuery = "";
  let randomPage = 1;
  let randomOrder = [];

  const RANDOM_PER_PAGE = 16;

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function shuffle(list) {
    const result = [...list];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function latestFirst(list) {
    return [...list].sort(
      (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)
    );
  }

  function mostViewedFirst(list) {
    return [...list].sort(
      (a, b) => Number(b.views || 0) - Number(a.views || 0)
    );
  }

  function relativeTime(value) {
    if (!value) return "Recently";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "Recently";

    const mins = Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
    if (mins < 60) return mins + "m ago";

    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + "h ago";

    const days = Math.floor(hours / 24);
    if (days < 30) return days + "d ago";

    return Math.floor(days / 30) + "mo ago";
  }

  function fallbackEmoji(category) {
    const c = String(category || "").toLowerCase();
    if (c.includes("music")) return "♫";
    if (c.includes("sport")) return "⚽";
    if (c.includes("food")) return "🍲";
    if (c.includes("travel")) return "✈";
    if (c.includes("tech")) return "⌘";
    return "▶";
  }

  function videoCard(video, compact = false) {
    const title = escapeHTML(video.title || "Untitled video");
    const category = escapeHTML(video.category || "Other");
    const views = Number(video.views || 0).toLocaleString();
    const time = relativeTime(video.created_at);
    const duration = escapeHTML(video.duration || "HD");
    const id = encodeURIComponent(video.id);
    const thumbnail = String(video.thumbnail_url || "").trim();

    const imageHTML = thumbnail
      ? `<img
          src="${escapeHTML(thumbnail)}"
          alt="${title}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        >`
      : "";

    return `
      <a class="video-card" href="video.html?id=${id}"
         aria-label="Watch ${title}">
        <div class="thumbnail">
          ${imageHTML}
          <div class="fallback-thumb" style="${thumbnail ? "display:none" : ""}">
            ${fallbackEmoji(video.category)}
          </div>
          <span class="play-icon">▶</span>
          <span class="duration">${duration}</span>
        </div>
        <div class="video-title">${title}</div>
        ${compact ? "" : `
          <span class="tag">${category}</span>
          <div class="video-info">
            <span>${views} views</span>
            <span>•</span>
            <span>${time}</span>
          </div>
        `}
      </a>
    `;
  }

  function getFilteredVideos() {
    let videos = [...allVideos];

    if (activeCategory !== "All") {
      videos = videos.filter(video =>
        String(video.category || "Other").toLowerCase() ===
        activeCategory.toLowerCase()
      );
    }

    if (searchQuery) {
      videos = videos.filter(video => {
        const title = String(video.title || "").toLowerCase();
        const category = String(video.category || "Other").toLowerCase();
        const description = String(video.description || "").toLowerCase();

        return title.includes(searchQuery) ||
               category.includes(searchQuery) ||
               description.includes(searchQuery);
      });
    }

    return videos;
  }

  function renderSection(elementId, videos, compact = false) {
    $(elementId).innerHTML = videos.length
      ? videos.map(video => videoCard(video, compact)).join("")
      : `<div class="status" style="grid-column:1/-1;padding:20px 5px">
           No videos found in this section.
         </div>`;
  }

  function renderRandom(videos) {
    const validIds = new Set(videos.map(video => video.id));

    randomOrder = randomOrder.filter(video => validIds.has(video.id));

    if (randomOrder.length !== videos.length) {
      randomOrder = shuffle(videos);
    }

    const totalPages = Math.max(1, Math.ceil(videos.length / RANDOM_PER_PAGE));
    randomPage = Math.min(randomPage, totalPages);

    const start = (randomPage - 1) * RANDOM_PER_PAGE;
    const pageVideos = randomOrder.slice(start, start + RANDOM_PER_PAGE);

    renderSection("randomGrid", pageVideos, true);

    let buttons = "";

    if (randomPage > 1) {
      buttons += `<button class="page-btn" data-page="${randomPage - 1}">‹ Prev</button>`;
    }

    const first = Math.max(1, Math.min(randomPage - 2, totalPages - 4));
    const last = Math.min(totalPages, first + 4);

    for (let page = first; page <= last; page++) {
      buttons += `
        <button class="page-btn ${page === randomPage ? "active" : ""}"
                data-page="${page}" ${page === randomPage ? 'aria-current="page"' : ""}>
          ${page}
        </button>
      `;
    }

    if (randomPage < totalPages) {
      buttons += `<button class="page-btn" data-page="${randomPage + 1}">Next →</button>`;
    }

    $("pagination").innerHTML = buttons;

    $("pagination").querySelectorAll("[data-page]").forEach(button => {
      button.addEventListener("click", () => {
        randomPage = Number(button.dataset.page);
        renderRandom(videos);
        $("random").scrollIntoView({ behavior: "smooth" });
      });
    });
  }

  function render() {
    const videos = getFilteredVideos();

    const trending = mostViewedFirst(videos).slice(0, 8);
    const latest = latestFirst(videos).slice(0, 8);
    const recommended = shuffle(videos).slice(0, 8);

    renderSection("trendingGrid", trending);
    renderSection("newGrid", latest);
    renderSection("recommendedGrid", recommended);
    renderRandom(videos);

    $("statusMessage").textContent = videos.length
      ? `${videos.length} video${videos.length === 1 ? "" : "s"} found.`
      : "No published videos found. Try another search or category.";

    $("statusMessage").classList.toggle("error", false);
  }

  function buildCategories() {
    const names = [
      ...new Set(
        allVideos.map(video => String(video.category || "Other").trim())
          .filter(Boolean)
      )
    ].sort((a, b) => a.localeCompare(b));

    $("categories").innerHTML = `
      <button class="category ${activeCategory === "All" ? "active" : ""}"
              data-category="All">All Videos</button>
      ${names.map(name => `
        <button class="category ${activeCategory === name ? "active" : ""}"
                data-category="${escapeHTML(name)}">
          ${escapeHTML(name)}
        </button>
      `).join("")}
    `;

    $("categories").querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        randomPage = 1;
        randomOrder = [];
        buildCategories();
        render();
      });
    });
  }

  async function loadVideos() {
    $("statusMessage").textContent = "Loading videos...";

    const { data, error } = await supabase
      .from("videos")
      .select("id,title,category,description,thumbnail_url,views,created_at,published,duration")
      .eq("published", true)
      .order("created_at", { ascending: false })
      .limit(1000);

    if (error) {
      console.error("DesiVexa video loading error:", error);
      $("statusMessage").textContent =
        "Videos load nahi ho paaye. Supabase connection aur videos table ki read policy check karein.";
      $("statusMessage").classList.add("error");
      return;
    }

    allVideos = data || [];
    randomOrder = shuffle(allVideos);
    buildCategories();
    render();
  }

  function openSearch() {
    $("searchBox").classList.add("active");
    $("searchInput").focus();
    $("searchBox").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function closeMenu() {
    $("sideMenu").classList.remove("active");
    $("menuOverlay").classList.remove("active");
  }

  $("menuBtn").addEventListener("click", () => {
    $("sideMenu").classList.add("active");
    $("menuOverlay").classList.add("active");
  });

  $("closeMenu").addEventListener("click", closeMenu);
  $("menuOverlay").addEventListener("click", closeMenu);

  $("searchBtn").addEventListener("click", () => {
    $("searchBox").classList.toggle("active");
    if ($("searchBox").classList.contains("active")) {
      $("searchInput").focus();
    } else {
      $("searchInput").value = "";
      searchQuery = "";
      randomPage = 1;
      randomOrder = [];
      render();
    }
  });

  $("categorySearchBtn").addEventListener("click", openSearch);
  $("menuCategories").addEventListener("click", () => {
    closeMenu();
    openSearch();
  });

  $("searchInput").addEventListener("input", () => {
    searchQuery = $("searchInput").value.trim().toLowerCase();
    randomPage = 1;
    randomOrder = [];
    render();
  });

  $("exploreBtn").addEventListener("click", () => {
    $("trending").scrollIntoView({ behavior: "smooth" });
  });

  document.querySelectorAll("[data-scroll]").forEach(button => {
    button.addEventListener("click", () => {
      closeMenu();
      const target = button.dataset.scroll;
      document.getElementById(target)?.scrollIntoView({ behavior: "smooth" });

      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.scroll === target);
      });
    });
  });

  $("year").textContent = new Date().getFullYear();

  loadVideos();
</script>
</body>
  </html>
