  <style>
    /* =====================================================
       DESIVEXA MOBILE — 2 COLUMNS
    ===================================================== */

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      max-width:100%;
      overflow-x:hidden;
      background:#000;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,
    input{
      font:inherit;
    }


    /* =====================================================
       AGE GATE
    ===================================================== */

    .gate{
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:#000;
    }

    .gatebox{
      width:min(420px,100%);
      padding:28px 20px;
      text-align:center;
      background:#111;
      border:1px solid #333;
      border-radius:8px;
    }

    .gateLogo{
      font-size:34px;
      font-weight:900;
    }

    .gateLogo span{
      color:#e00000;
    }

    .adultBadge{
      display:inline-block;
      margin:15px 0 8px;
      padding:5px 10px;
      background:#d90000;
      border-radius:3px;
      font-weight:900;
    }

    .gatebox p{
      color:#aaa;
    }

    .btn{
      padding:12px 20px;
      border:0;
      border-radius:4px;
      background:#e00000;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .dvHeader{
      position:relative;
      z-index:1000;
      background:#c90000;
      border-bottom:2px solid #4d0000;
    }

    .dvHeaderInner{
      width:100%;
      max-width:1100px;
      height:62px;
      margin:auto;
      padding:0 8px;

      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
      gap:5px;
    }

    .headerIcon{
      width:40px;
      height:40px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#b50000;
      border:1px solid #650000;
      color:#fff;

      font-size:22px;
      cursor:pointer;
    }

    .dvLogo{
      text-align:center;
      color:#050505;
      font-size:27px;
      font-weight:900;
      letter-spacing:-1.5px;
      text-transform:uppercase;
    }

    .dvLogo span{
      color:#000;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .dvSearchBox{
      display:none;
      padding:8px;
      background:#090909;
      border-bottom:1px solid #333;
    }

    .dvSearchBox.open{
      display:block;
    }

    .dvSearchBox input{
      width:100%;
      height:40px;
      padding:0 12px;

      background:#151515;
      border:1px solid #555;
      border-radius:3px;

      color:#fff;
      outline:none;
    }


    /* =====================================================
       MENU
    ===================================================== */

    .mobileMenu{
      display:none;
      position:absolute;
      top:62px;
      left:0;
      right:0;
      z-index:3000;

      background:#111;
      border-bottom:2px solid #c90000;
    }

    .mobileMenu.open{
      display:block;
    }

    .mobileMenu a{
      display:block;
      padding:14px 16px;
      border-bottom:1px solid #292929;
      color:#ddd;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .dvMain{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:0 6px 35px;
    }


    /* =====================================================
       CATEGORY
    ===================================================== */

    .toolbar{
      margin-top:7px;
    }

    .categoryBtn{
      width:100%;
      min-height:40px;

      padding:0 11px;

      background:#151515;
      border:1px solid #444;
      border-radius:2px;

      color:#fff;
      text-align:left;
      cursor:pointer;
    }

    .categoryList{
      display:none;
      margin-top:4px;
      padding:7px;

      background:#101010;
      border:1px solid #333;
    }

    .categoryList.open{
      display:block;
    }

    #categorySearch{
      width:100%;
      height:37px;
      margin-bottom:7px;
      padding:0 9px;

      background:#050505;
      border:1px solid #555;

      color:#fff;
      outline:none;
    }

    #categoryItems{

      flex-wrap:wrap;
      gap:5px;
    }

    .catItem{

      background:#414141;
      color:#ddd;
      border-radius:3px;
      font-size:11px;
    }


    /* =====================================================
       ADS
    ===================================================== */

      text-align:center;
      background:#111;
      margin:7px 0;
    }

    ===================================================== */

    .dvSectionTitle{

      justify-content:space-between;

      padding:5px 6px;

      background:linear-gradient(#1b1b1b,#050505);

    .dvSectionTitle h2{

      font-size:18px;
      font-weight:400;
      line-height:1.2;
    }

    .dvSectionTitle h2::before{
      content:"› ";
      color:#aaa;
    }

    .dvSectionTitle a{
      color:#aaa;
      font-size:10px;
    }

    .sectionLabel{
      display:none;
    }


    /* =====================================================
       VIDEO GRID — 2 COLUMNS
    ===================================================== */

    .dvGrid{
      width:100%;
      display:grid;

      /* MOBILE = 2 COLUMNS */
      grid-template-columns:repeat(2,minmax(0,1fr));

      gap:3px;
    }

    .dvGrid .card{
      min-width:0;
      overflow:hidden;

      background:#090909;
      border:0;
      border-radius:0;
    }

    .dvGrid .thumb{
      position:relative;
      width:100%;
      aspect-ratio:16/10;
      overflow:hidden;
      background:#222;
    }

    .dvGrid .thumb img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .dvGrid .body{
      padding:4px 5px 7px;
    }

    .dvGrid .card h3{
      margin:0;

      color:#ddd;
      font-size:11px;
      font-weight:400;
      line-height:1.25;

      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .dvGrid .cardMeta{
      margin-top:3px;
      color:#777;
      font-size:8px;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .dvGrid .playCircle{
      width:28px !important;
      height:28px !important;
      font-size:11px !important;
    }

    .dvGrid .cardViews{
      font-size:8px !important;
      padding:2px 3px !important;
    }


    /* =====================================================
       DESKTOP
    ===================================================== */

        gap:7px;

      .dvGrid .card h3{
        font-size:13px;
      }

      .dvGrid .cardMeta{
        font-size:10px;
      }

      .dvSectionTitle h2{
        font-size:21px;
      }

    footer a{
      color:#aaa;
      font-size:12px;
    }

  </style>

  <!-- =====================================================
       UI CONTROLS
  ====================================================== -->

  <script>

    const menuBtn =
      document.getElementById("menuBtn");

    const mobileMenu =
      document.getElementById("mobileMenu");

    const searchBtn =
      document.getElementById("searchBtn");

    const searchBox =
      document.getElementById("searchBox");

    const categoryBtn =
      document.getElementById("categoryBtn");

    const cats =
      document.getElementById("cats");

    const search =
      document.getElementById("search");


    /* MENU */

    if(menuBtn){

      menuBtn.addEventListener("click", function(){

        mobileMenu.classList.toggle("open");

      });

    }


    /* SEARCH */

    if(searchBtn){

      searchBtn.addEventListener("click", function(){

        searchBox.classList.toggle("open");

        if(searchBox.classList.contains("open")){

          setTimeout(function(){

            if(search){
              search.focus();
            }

          },100);

        }

      });

    }


    /* CATEGORY */

    if(categoryBtn){

      categoryBtn.addEventListener("click", function(){

        cats.classList.toggle("open");

      });

    }


    /* SEARCH ENTER */

    if(search){

      search.addEventListener("keydown", function(e){

        if(e.key === "Enter"){

          const value =
            search.value.trim();

          if(value){

            window.location.href =
              "index.html?search=" +
              encodeURIComponent(value);

          }

        }

      });

    }

  </script>
