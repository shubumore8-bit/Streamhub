<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DesiVexa — Home</title>

  <link rel="stylesheet" href="style.css?v=42">

  <style>
    .homeWrap {
      max-width:1100px;
      margin:auto;
      padding:12px 10px 90px;
    }

    .homeTop {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .homeLogo {
      font-size:25px;
      font-weight:800;
      color:white;
    }

    .homeLogo span {
      color:#e00000;
    }

    .homeLinks {
      display:flex;
      gap:7px;
    }

    .homeLinks a {
      color:white;
      background:#e00000;
      padding:8px 11px;
      border-radius:7px;
      text-decoration:none;
      font-size:12px;
      font-weight:600;
    }

    .sectionTitle {
      color:white;
      font-size:20px;
      margin:22px 0 12px;
    }

    .videoGrid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .videoCard {
      display:block;
      min-width:0;
      color:white;
      text-decoration:none;
    }

    .thumb {
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      display:block;
      border-radius:8px;
      background:#171717;
    }

    .noThumb {
      width:100%;
      aspect-ratio:16/9;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#171717;
      border-radius:8px;
      font-size:28px;
    }

    .videoTitle {
      margin-top:6px;
      font-size:14px;
      font-weight:600;
      line-height:1.3;
    }

    .videoMeta {
      color:#888;
      font-size:11px;
      margin-top:4px;
    }

    @media (max-width:380px) {
      .videoGrid {
        gap:8px;
      }

      .videoTitle {
        font-size:13px;
      }
    }
  </style>
</head>

<body>

<main class="homeWrap">

  <div class="homeTop">

    <div class="homeLogo">
      Desi<span>Vexa</span>
    </div>

    <div class="homeLinks">
      <a href="new.html">Latest</a>
      <a href="recommended.html">Recommended</a>
    </div>

  </div>


  <!-- LATEST -->

  <h2 class="sectionTitle">
    Latest Videos
  </h2>

  <div
    id="latestVideos"
    class="videoGrid"
  >
    <p style="color:#888;">
      Loading...
    </p>
  </div>


  <!-- RECOMMENDED -->

  <h2 class="sectionTitle">
    Recommended
  </h2>

  <div
    id="recommendedVideos"
    class="videoGrid"
  >
    <p style="color:#888;">
      Loading...
    </p>
  </div>

</main>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
} from "./config.js";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const latestBox =
  document.getElementById("latestVideos");

const recommendedBox =
  document.getElementById("recommendedVideos");


loadLatest();
loadRecommended();


async function loadLatest() {

  const result = await supabase
    .from("videos")
    .select(`
      id,
      title,
      category,
      thumbnail_url,
      views,
      created_at
    `)
    .eq("published", true)
    .order("created_at", {
      ascending:false
    })
    .limit(20);

  if (result.error) {

    console.error(result.error);

    latestBox.innerHTML = `
      <p style="color:#888;">
        Unable to load latest videos.
      </p>
    `;

    return;
  }

  renderVideos(
    latestBox,
    result.data || []
  );
}


async function loadRecommended() {

  const result = await supabase
    .from("videos")
    .select(`
      id,
      title,
      category,
      thumbnail_url,
      views,
      created_at
    `)
    .eq("published", true)
    .order("views", {
      ascending:false
    })
    .order("created_at", {
      ascending:false
    })
    .limit(20);

  if (result.error) {

    console.error(result.error);

    recommendedBox.innerHTML = `
      <p style="color:#888;">
        Unable to load recommended videos.
      </p>
    `;

    return;
  }

  renderVideos(
    recommendedBox,
    result.data || []
  );
}


function renderVideos(box, videos) {

  if (!videos.length) {

    box.innerHTML = `
      <p style="color:#888;">
        No videos available.
      </p>
    `;

    return;
  }

  box.innerHTML =
    videos.map(video => {

      const id =
        encodeURIComponent(video.id);

      return `
        <a
          class="videoCard"
          href="video.html?id=${id}"
        >

          ${
            video.thumbnail_url
              ? `
                <img
                  class="thumb"
                  src="${escapeHTML(video.thumbnail_url)}"
                  loading="lazy"
                  alt=""
                >
              `
              : `
                <div class="noThumb">
                  ▶
                </div>
              `
          }

          <div class="videoTitle">
            ${escapeHTML(
              video.title || "Untitled"
            )}
          </div>

          <div class="videoMeta">
            ${escapeHTML(
              video.category || "Video"
            )}
            ·
            ${Number(video.views || 0)}
            views
          </div>

        </a>
      `;

    }).join("");
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
