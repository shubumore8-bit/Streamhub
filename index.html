<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#02070d">
<meta name="description" content="DesiVexa - Latest, Trending and Recommended Videos">
<title>DesiVexa - Home</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#02070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  background:#06111a;
  padding-bottom:80px;
}

/* HEADER */
.header{
  height:68px;
  display:grid;
  grid-template-columns:52px 1fr 52px;
  align-items:center;
  padding:0 14px;
  background:#030b12;
  border-bottom:1px solid #172733;
  position:sticky;
  top:0;
  z-index:1000;
}
.menu-btn,.search-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}
.menu-btn{font-size:29px}
.search-btn{font-size:25px}
.logo{
  text-align:center;
  font-size:29px;
  font-weight:900;
}
.logo span{color:#ff1744}

/* MENU */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1500;
  display:none;
}
.overlay.show{display:block}

.side-menu{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100vh;
  background:#07131d;
  border-right:1px solid #243440;
  z-index:2000;
  transition:left .25s ease;
}
.side-menu.show{left:0}

.menu-header{
  height:68px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1d303d;
}
.menu-logo{
  font-size:24px;
  font-weight:900;
}
.menu-logo span{color:#ff1744}
.close-menu{
  border:0;
  background:transparent;
  color:white;
  font-size:31px;
}
.menu-list{padding:15px}
.menu-item{
  width:100%;
  border:1px solid #1b3140;
  background:#0a1a26;
  color:white;
  padding:14px;
  margin-bottom:9px;
  border-radius:11px;
  text-align:left;
  font-size:15px;
}
.menu-item:hover{
  background:#ff1744;
  border-color:#ff1744;
}

/* SEARCH */
.search-area{
  display:none;
  padding:12px 14px;
  border-bottom:1px solid #182b38;
}
.search-area.show{display:block}
.search-input{
  width:100%;
  height:45px;
  padding:0 14px;
  border-radius:11px;
  border:1px solid #28404f;
  background:#0a1924;
  color:#fff;
  outline:none;
}
.search-input:focus{border-color:#ff1744}

/* BANNER */
.top-banner{
  margin:15px 14px;
  min-height:68px;
  padding:10px 13px;
  border:1px solid #ff1744;
  border-radius:12px;
  background:linear-gradient(90deg,#160914,#24101a,#100b12);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.banner-text{
  font-size:14px;
  font-weight:700;
}
.banner-btn{
  background:#ff1744;
  color:white;
  border:0;
  border-radius:22px;
  padding:10px 15px;
  font-weight:700;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 14px 7px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category-btn{
  flex:0 0 auto;
  padding:9px 17px;
  border-radius:10px;
  border:1px solid #20394a;
  background:#0b1c2a;
  color:#dbe5ed;
  font-size:13px;
  font-weight:600;
}
.category-btn.active{
  background:#ff1744;
  border-color:#ff1744;
  color:#fff;
}

/* SECTION */
.section{
  padding:12px 14px 0;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:12px 0 13px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:21px;
  font-weight:800;
}
.view-all{
  border:0;
  background:transparent;
  color:#ff1744;
  font-weight:700;
  font-size:13px;
}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:19px;
}
.video-card{
  min-width:0;
  cursor:pointer;
}
.thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#0a1822;
  border-radius:9px;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .25s ease;
}
.video-card:hover .thumb img{
  transform:scale(1.04);
}
.play{
  position:absolute;
  left:8px;
  bottom:8px;
  width:31px;
  height:31px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  font-size:13px;
}
.duration{
  position:absolute;
  right:7px;
  bottom:7px;
  padding:4px 6px;
  border-radius:5px;
  background:rgba(0,0,0,.82);
  font-size:11px;
  font-weight:700;
}
.video-title{
  margin-top:7px;
  font-size:14px;
  font-weight:700;
  line-height:1.35;
  min-height:38px;
}
.tag{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;
  border-radius:18px;
  background:#ff1744;
  color:#fff;
  font-size:10px;
  font-weight:800;
}
.video-meta{
  margin-top:6px;
  color:#aebdca;
  font-size:11px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

/* RANDOM */
.random-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.random-grid .video-title{
  min-height:auto;
  font-size:13px;
}
.random-grid .tag,
.random-grid .video-meta{
  display:none;
}

/* STATUS */
.loading,.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 10px;
  color:#9aaab7;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:1100px;
  height:70px;
  background:rgba(3,11,18,.97);
  border-top:1px solid #1b2d3a;
  z-index:1200;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  backdrop-filter:blur(12px);
}
.nav-btn{
  border:0;
  background:transparent;
  color:#9eafbd;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}
.nav-icon{font-size:21px}
.nav-btn.active{color:#ff1744}

/* MOBILE */
@media(max-width:900px){
  .video-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){
  .video-grid{
    grid-template-columns:repeat(2,1fr);
    gap:17px 11px;
  }
  .random-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .video-title{font-size:13px}
  .section-title{font-size:20px}
}

@media(max-width:390px){
  .logo{font-size:25px}
  .banner-text{font-size:11px}
  .banner-btn{
    font-size:11px;
    padding:8px 10px;
  }
}
</style>
</head>

<body>

<div class="app" id="home">

<header class="header">

<a href="index.html" class="logo">
Desi<span>Vexa</span>
</a>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
SUPABASE_URL,
SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


let allVideos = [];

let activeCategory = "All";


const trendingGrid =
document.getElementById("trendingGrid");

const latestGrid =
document.getElementById("latestGrid");

const recommendedGrid =
document.getElementById("recommendedGrid");

const randomGrid =
document.getElementById("randomGrid");

const searchInput =
document.getElementById("searchInput");


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   VIEWS
========================= */

function formatViews(value){

const views =
Number(value || 0);

if(views >= 1000000)
return (views/1000000)
.toFixed(1)
.replace(".0","")+"M";

if(views >= 1000)
return (views/1000)
.toFixed(1)
.replace(".0","")+"K";

return String(views);

}


/* =========================
   TIME
========================= */

function timeAgo(dateString){

if(!dateString) return "";

const date =
new Date(dateString);

const now =
new Date();

const seconds =
Math.floor((now-date)/1000);

if(seconds < 60)
return "just now";

const minutes =
Math.floor(seconds/60);

if(minutes < 60)
return minutes+"m ago";

const hours =
Math.floor(minutes/60);

if(hours < 24)
return hours+"h ago";

const days =
Math.floor(hours/24);

if(days < 30)
return days+"d ago";

const months =
Math.floor(days/30);

if(months < 12)
return months+"mo ago";

return Math.floor(months/12)+"y ago";

}


/* =========================
   FALLBACK IMAGE
========================= */

function fallbackImage(){

const svg = `
<svg xmlns="http://www.w3.org/2000/svg"
width="800"
height="450">

<rect width="100%" height="100%"
fill="#101d28"/>

<text
x="50%"
y="50%"
text-anchor="middle"
dominant-baseline="middle"
fill="#ff1744"
font-size="46"
font-family="Arial"
font-weight="bold">
DesiVexa
</text>

</svg>
`;

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(svg);

}


/* =========================
   CARD
========================= */

function createCard(video){

const id =
encodeURIComponent(
String(video.id)
);

const title =
escapeHTML(
video.title || "Untitled Video"
);

const category =
escapeHTML(
video.category || "Other"
);

const image =
video.thumbnail_url ||
fallbackImage();

return `

<article
class="video-card"
data-title="${title.toLowerCase()}"
data-category="${category.toLowerCase()}"
onclick="openVideo('${id}')">

<div class="thumb">

<img
src="${escapeHTML(image)}"
alt="${title}"
loading="lazy"
onerror="this.src='${fallbackImage()}'">

<div class="play">
▶
</div>

<div class="duration">
HD
</div>

</div>

<div class="video-title">
${title}
</div>

<span class="tag">
${category}
</span>

<div class="video-meta">

<span>
◉ ${formatViews(video.views)} views
</span>

<span>•</span>

<span>
${timeAgo(video.created_at)}
</span>

</div>

</article>

`;

}


/* =========================
   LOAD
========================= */

async function loadVideos(){

const {
data,
error
} = await supabase

.from("videos")

.select(
"id,title,category,description,thumbnail_url,video_url,views,created_at"
)

.eq(
"published",
true
)

.order(
"created_at",
{
ascending:false
}
)

.limit(200);


if(error){

console.error(error);

const msg =
`<div class="empty">
Videos load nahi ho paaye.
</div>`;

trendingGrid.innerHTML = msg;
latestGrid.innerHTML = msg;
recommendedGrid.innerHTML = msg;
randomGrid.innerHTML = msg;

return;

}


allVideos =
Array.isArray(data)
? data
: [];


render();

}


/* =========================
   FILTER
========================= */

function getFiltered(){

const query =
searchInput.value
.trim()
.toLowerCase();


return allVideos.filter(video=>{

const category =
video.category || "Other";


if(
activeCategory !== "All" &&
category !== activeCategory
){
return false;
}


if(!query)
return true;


const text = `

${video.title || ""}
${video.category || ""}
${video.description || ""}

`.toLowerCase();


return text.includes(query);

});

}


/* =========================
   RENDER
========================= */

function render(){

const videos =
getFiltered();


/*
TRENDING
ONLY 4
*/

const trending =
[...videos]
.sort(
(a,b)=>
Number(b.views||0) -
Number(a.views||0)
)
.slice(0,4);


trendingGrid.innerHTML =
trending.length
?
trending
.map(createCard)
.join("")
:
`<div class="empty">
No trending videos found.
</div>`;


/*
NEW
ONLY 4
*/

const latest =
[...videos]
.sort(
(a,b)=>
new Date(b.created_at) -
new Date(a.created_at)
)
.slice(0,4);


latestGrid.innerHTML =
latest.length
?
latest
.map(createCard)
.join("")
:
`<div class="empty">
No new videos found.
</div>`;


/*
RECOMMENDED
ONLY 4
*/

const recommended =
[...videos]
.sort(
(a,b)=>
Number(b.views||0) -
Number(a.views||0)
)
.slice(0,4);


recommendedGrid.innerHTML =
recommended.length
?
recommended
.map(createCard)
.join("")
:
`<div class="empty">
No recommended videos found.
</div>`;


/*
RANDOM
16 ONLY
*/

const random =
[...videos]
.sort(
()=>Math.random()-0.5
)
.slice(0,16);


randomGrid.innerHTML =
random.length
?
random
.map(createCard)
.join("")
:
`<div class="empty">
No random videos found.
</div>`;

}


/* =========================
   OPEN VIDEO
========================= */

window.openVideo =
function(encodedId){

const id =
decodeURIComponent(encodedId);

window.location.href =
"video.html?id="+
encodeURIComponent(id);

};


/* =========================
   PAGE NAVIGATION
========================= */

window.goPage =
function(page){

window.location.href = page;

};


/* =========================
   SCROLL
========================= */

window.scrollToId =
function(id){

closeMenu();

const element =
document.getElementById(id);

if(element){

element.scrollIntoView({
behavior:"smooth"
});

}

};


/* =========================
   LOGIN
========================= */

window.showLogin =
function(){

closeMenu();

alert(
"Login page yahan connect ki ja sakti hai."
);

};


/* =========================
   SEARCH
========================= */

document
.getElementById("searchBtn")
.addEventListener(
"click",
()=>{

document
.getElementById("searchArea")
.classList.toggle("show");

if(
document
.getElementById("searchArea")
.classList.contains("show")
){

searchInput.focus();

}

}
);


searchInput.addEventListener(
"input",
render
);


/* =========================
   CATEGORY
========================= */

document
.querySelectorAll(".category-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".category-btn")
.forEach(btn=>
btn.classList.remove("active")
);

button.classList.add("active");

activeCategory =
button.dataset.category;

render();

}
);

});


/* =========================
   MENU
========================= */

const menuBtn =
document.getElementById("menuBtn");

const closeMenuBtn =
document.getElementById("closeMenu");

const sideMenu =
document.getElementById("sideMenu");

const overlay =
document.getElementById("overlay");


function openMenu(){

sideMenu.classList.add("show");

overlay.classList.add("show");

}


function closeMenu(){

sideMenu.classList.remove("show");

overlay.classList.remove("show");

}


menuBtn.addEventListener(
"click",
openMenu
);

closeMenuBtn.addEventListener(
"click",
closeMenu
);

overlay.addEventListener(
"click",
closeMenu
);


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
