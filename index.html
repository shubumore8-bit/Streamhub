<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DesiVexa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#02070d;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    max-width:700px;
    min-height:100vh;
    margin:auto;
    background:#06111a;
    padding-bottom:85px;
}

/* HEADER */

header{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:#020a11;
    border-bottom:1px solid #263540;
}

.menu{
    font-size:30px;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#ff1744;
}

.icons{
    font-size:24px;
    word-spacing:12px;
}


/* AD */

.ad{
    margin:8px 18px 13px;
    height:58px;
    border:2px solid #ff1744;
    border-radius:8px;
    background:#280914;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
}


/* CATEGORIES */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 18px 15px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;
    padding:10px 16px;
    border-radius:10px;
    background:#10202c;
    border:1px solid #233a49;
    color:white;
    text-decoration:none;
    font-size:13px;
}

.category.active{
    background:#ff1744;
    border-color:#ff1744;
}


/* SECTION */

.section{
    padding:0 18px;
    margin:20px 0;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.section-header h2{
    font-size:20px;
}

.view-all{
    color:#ff1744;
    font-size:13px;
    font-weight:bold;
    text-decoration:none;
}


/* VIDEO GRID */

.video-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.video-card{
    min-width:0;
}

.thumbnail{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:5px;

    background:
    linear-gradient(
        135deg,
        #675451,
        #202a32,
        #754f59
    );
}

.thumbnail::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(180,150,150,.18);
    backdrop-filter:blur(7px);
}

.play{
    position:absolute;
    z-index:2;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:36px;
    height:36px;

    border-radius:50%;

    background:rgba(0,0,0,.65);

    display:flex;
    align-items:center;
    justify-content:center;
}

.duration{
    position:absolute;
    z-index:3;

    right:4px;
    bottom:4px;

    background:#000;

    padding:3px 5px;

    font-size:9px;

    border-radius:3px;
}

.video-title{
    font-size:11px;
    font-weight:bold;

    margin:5px 2px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tag{
    display:inline-block;

    background:#ff1744;

    padding:3px 7px;

    border-radius:8px;

    font-size:9px;
}

.video-info{
    color:#ccd2d6;
    font-size:9px;
    line-height:16px;
}


/* RANDOM */

.random-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:8px;
}

.random-grid .play{
    width:28px;
    height:28px;
    font-size:12px;
}

.random-grid .video-title{
    font-weight:normal;
    font-size:10px;
}


/* PAGINATION */

.pagination{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

    padding:5px 18px 25px;
}

.page-btn{
    min-width:38px;
    height:36px;

    border:1px solid #29404f;

    background:#0b1b27;

    color:white;

    border-radius:7px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    padding:0 10px;
}

.page-btn.active{
    background:#ff1744;
    border-color:#ff1744;
}


/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:700px;

    height:75px;

    background:#020910;

    border-top:1px solid #26343e;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    z-index:100;
}

.nav-item{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    color:white;

    text-decoration:none;

    font-size:10px;
}

.nav-icon{
    font-size:23px;
}

.nav-item.active{
    color:#ff1744;
}


/* DESKTOP */

@media(min-width:701px){

    body{
        padding:20px 0;
    }

    .app{
        border:1px solid #233541;
        border-radius:25px;
        overflow:hidden;
    }

    .bottom-nav{
        bottom:20px;
        border-radius:0 0 25px 25px;
    }
}


/* SMALL PHONE */

@media(max-width:390px){

    .section{
        padding:0 12px;
    }

    .categories{
        padding-left:12px;
    }

    .video-grid{
        gap:6px;
    }

    .random-grid{
        gap:5px;
    }

    .section-header h2{
        font-size:18px;
    }
}
</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<header>

    <div class="menu">
        ☰
    </div>

    <div class="logo">
        Desi<span>Vexa</span>
    </div>

    <div class="icons">
        ⌕ ♙
    </div>

</header>


<!-- AD -->

<div class="ad">
    Top Banner Ad (320×100)
</div>


<!-- CATEGORIES -->

<div class="categories">

    <a href="#" class="category active">
        All
    </a>

    <a href="#" class="category">
        Indian
    </a>

    <a href="#" class="category">
        Bhabhi
    </a>

    <a href="#" class="category">
        Desi
    </a>

    <a href="#" class="category">
        Mature
    </a>

    <a href="#" class="category">
        More⌄
    </a>

</div>



<!-- TRENDING -->

<section class="section">

    <div class="section-header">

        <h2>
            🔥 Trending Videos
        </h2>

        <a
            href="trending.html"
            class="view-all">
            View All →
        </a>

    </div>


    <div
        class="video-grid"
        id="trendingVideos">
    </div>

</section>



<!-- NEW -->

<section class="section">

    <div class="section-header">

        <h2>
            ⭐ New Videos
        </h2>

        <a
            href="new.html"
            class="view-all">
            View All →
        </a>

    </div>


    <div
        class="video-grid"
        id="newVideos">
    </div>

</section>



<!-- RECOMMENDED -->

<section class="section">

    <div class="section-header">

        <h2>
            👤 Recommended Videos
        </h2>

        <a
            href="recommended.html"
            class="view-all">
            View All →
        </a>

    </div>


    <div
        class="video-grid"
        id="recommendedVideos">
    </div>

</section>



<!-- RANDOM -->

<section class="section">

    <div class="section-header">

        <h2>
            🎲 Random Videos
        </h2>

    </div>


    <div
        class="random-grid"
        id="randomVideos">
    </div>

</section>



<!-- PAGINATION -->

<div
    class="pagination"
    id="pagination">
</div>



<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <a
        href="index.html"
        class="nav-item active">

        <div class="nav-icon">
            ⌂
        </div>

        Home

    </a>


    <a
        href="new.html"
        class="nav-item">

        <div class="nav-icon">
            ◷
        </div>

        Latest

    </a>


    <a
        href="trending.html"
        class="nav-item">

        <div class="nav-icon">
            ♨
        </div>

        Trending

    </a>


    <a
        href="recommended.html"
        class="nav-item">

        <div class="nav-icon">
            ▦
        </div>

        Recommended

    </a>


    <a
        href="#"
        class="nav-item">

        <div class="nav-icon">
            ♙
        </div>

        Profile

    </a>

</nav>


</div>



<script>


/* ============================
   VIDEO DATA
============================ */


const trending = [

    ["Trending Video 1","Indian","12:34","124K"],
    ["Trending Video 2","Bhabhi","08:50","98K"],
    ["Trending Video 3","Desi","15:20","156K"],
    ["Trending Video 4","Mature","10:12","78K"],
    ["Trending Video 5","Indian","09:45","112K"],
    ["Trending Video 6","Desi","13:22","91K"],
    ["Trending Video 7","Bhabhi","07:42","87K"],
    ["Trending Video 8","Mature","11:31","105K"]

];


const newVideos = [

    ["New Video 1","Desi","09:12","45K"],
    ["New Video 2","Bhabhi","14:37","67K"],
    ["New Video 3","Indian","07:45","32K"],
    ["New Video 4","Mature","12:08","89K"],
    ["New Video 5","Desi","10:25","55K"],
    ["New Video 6","Indian","08:33","61K"],
    ["New Video 7","Bhabhi","13:12","74K"],
    ["New Video 8","Mature","06:50","39K"]

];


const recommended = [

    ["Recommended 1","Indian","11:30","76K"],
    ["Recommended 2","Desi","08:15","93K"],
    ["Recommended 3","Bhabhi","13:40","61K"],
    ["Recommended 4","Mature","09:25","102K"],
    ["Recommended 5","Indian","12:10","81K"],
    ["Recommended 6","Desi","07:55","68K"],
    ["Recommended 7","Bhabhi","14:22","97K"],
    ["Recommended 8","Mature","10:18","72K"]

];



/* ============================
   CARD FUNCTION
============================ */


function createCard(video){

    return `

    <div class="video-card">

        <div class="thumbnail">

            <div class="play">
                ▶
            </div>

            <div class="duration">
                ${video[2]}
            </div>

        </div>


        <div class="video-title">
            ${video[0]}
        </div>


        <span class="tag">
            ${video[1]}
        </span>


        <div class="video-info">

            👁 ${video[3]} views<br>

            ◷ Recently

        </div>

    </div>

    `;

}



/* ============================
   RENDER MAIN SECTIONS
============================ */


document.getElementById(
    "trendingVideos"
).innerHTML =
    trending.map(createCard).join("");


document.getElementById(
    "newVideos"
).innerHTML =
    newVideos.map(createCard).join("");


document.getElementById(
    "recommendedVideos"
).innerHTML =
    recommended.map(createCard).join("");



/* ============================
   RANDOM 150 VIDEOS
   30 PER PAGE
============================ */


const randomVideos = [];


for(
    let i = 1;
    i <= 150;
    i++
){

    randomVideos.push({

        title:
            "Random Video " + i,

        duration:
            String(
                Math.floor(
                    Math.random() * 15
                ) + 1
            ).padStart(2,"0")
            +
            ":"
            +
            String(
                Math.floor(
                    Math.random() * 60
                )
            ).padStart(2,"0")

    });

}



let currentPage = 1;

const videosPerPage = 30;



/* ============================
   RANDOM RENDER
============================ */


function renderRandomVideos(){

    const box =
        document.getElementById(
            "randomVideos"
        );


    const start =
        (currentPage - 1)
        *
        videosPerPage;


    const end =
        start +
        videosPerPage;


    const currentVideos =
        randomVideos.slice(
            start,
            end
        );


    box.innerHTML =
        currentVideos.map(video => `

        <div class="video-card">

            <div class="thumbnail">

                <div class="play">
                    ▶
                </div>

                <div class="duration">
                    ${video.duration}
                </div>

            </div>


            <div class="video-title">
                ${video.title}
            </div>

        </div>

    `).join("");


    renderPagination();

}



/* ============================
   PAGINATION
============================ */


function renderPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );


    pagination.innerHTML = "";


    /* PREVIOUS */

    const previous =
        document.createElement(
            "button"
        );

    previous.className =
        "page-btn";

    previous.innerText =
        "‹ Previous";

    previous.disabled =
        currentPage === 1;


    previous.onclick = function(){

        if(currentPage > 1){

            currentPage--;

            renderRandomVideos();

            scrollToRandom();

        }

    };


    pagination.appendChild(
        previous
    );



    /* PAGE NUMBERS */

    for(
        let page = 1;
        page <= 5;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-btn";


        if(
            page === currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.innerText =
            page;


        button.onclick =
            function(){

                currentPage =
                    page;

                renderRandomVideos();

                scrollToRandom();

            };


        pagination.appendChild(
            button
        );

    }



    /* NEXT */

    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-btn";


    next.innerText =
        "Next ›";


    next.disabled =
        currentPage === 5;


    next.onclick =
        function(){

            if(currentPage < 5){

                currentPage++;

                renderRandomVideos();

                scrollToRandom();

            }

        };


    pagination.appendChild(
        next
    );

}



/* ============================
   SCROLL TO RANDOM
============================ */


function scrollToRandom(){

    document.getElementById(
        "randomVideos"
    ).scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}



/* ============================
   START
============================ */


renderRandomVideos();


</script>

</body>
</html>
