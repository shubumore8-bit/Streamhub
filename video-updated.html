<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080808">

  <meta
    name="description"
    content="Watch videos on DesiVexa."
  >

  <title>Watch Video - DesiVexa</title>

  <!-- Google IMA SDK: VAST video ad support -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 9999;
      height: 58px;
      background: #0d0d0d;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .home-btn,
    .search-btn {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
    }

    .home-btn:hover,
    .search-btn:hover {
      background: #202020;
      border-color: #e50914;
    }

    .logo {
      color: #e50914;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .logo span {
      color: #ffffff;
    }

    /* MAIN CONTENT */
    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 35px;
    }

    #page {
      width: 100%;
      min-width: 0;
    }

    .loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }

    /* BANNER AD SLOTS */
    .ad-slot,
    .dv-ad-slot {
      width: calc(100% - 24px);
      max-width: 970px;
      min-height: 90px;
      margin: 18px auto 24px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      color: #888;
      background: #101010;
      border: 1px dashed #444;
      border-radius: 8px;
      font-size: 11px;
    }

    .ad-slot iframe,
    .ad-slot img,
    .dv-ad-slot iframe,
    .dv-ad-slot img {
      max-width: 100%;
    }

    .bottom-ad {
      min-height: 100px;
      margin-top: 20px;
      margin-bottom: 28px;
    }

    /* VIDEO PLAYER */
    #mainVideo {
      display: block;
      width: 100%;
      max-height: 70vh;
      min-height: 200px;
      background: #000;
    }

    #imaAdContainer {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      background: #000;
    }

    #imaAdContainer video {
      width: 100%;
      height: 100%;
    }

    /* BUTTONS */
    .video-action {
      background: #242424;
      color: #fff;
      border: 0;
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .video-action:active {
      background: #383838;
    }

    /* COMMENTS */
    #commentInput {
      box-sizing: border-box;
      width: 100%;
      min-height: 90px;
      background: #171717;
      color: #fff;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      resize: vertical;
    }

    /* RELATED VIDEOS */
    #randomVideos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 360px) {
      .site-header {
        padding: 0 8px;
      }

      .home-btn,
      .search-btn {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .logo {
        font-size: 19px;
      }
    }

    @media (min-width: 768px) {
      .site-header {
        padding: 0 25px;
      }

      .logo {
        font-size: 25px;
      }

      .dv-ad-slot {
        min-height: 110px;
      }
    }
  </style>
</head>

<body>

  <!-- WEBSITE HEADER -->
  <header class="site-header">

    <a
      class="home-btn"
      href="index.html"
      aria-label="Home"
    >⌂</a>

    <div class="logo">
      Desi<span>Vexa</span>
    </div>

    <a
      class="search-btn"
      href="index.html"
      aria-label="Search"
    >⌕</a>

  </header>

  <!-- VIDEO PAGE -->
  <main>

    <div id="page">

      <div class="loading">
        Loading video...
      </div>

    </div>

  </main>

  <!-- KEEP YOUR EXISTING SUPABASE VIDEO LOGIC -->
  <script
    type="module"
    src="./video.js?v=12">
  </script>

</body>
</html>
