<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Latest Videos — DesiVexa</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="dvHeader">

  <div class="dvHeaderInner">

    <!-- MENU -->

    <button
      class="headerIcon"
      id="menuBtn"
      type="button"
      aria-label="Menu"
    >
      ☰
    </button>


    <!-- LOGO -->

    <a
      href="index.html"
      class="dvLogo"
    >
      Desi<span>Vexa</span>
    </a>


    <!-- SEARCH -->

    <button
      class="headerIcon"
      id="searchBtn"
      type="button"
      aria-label="Search"
    >
      ⌕
    </button>

  </div>


  <!-- SEARCH BOX -->

  <div
    class="dvSearchBox"
    id="searchBox"
  >

    <input
      id="search"
      type="search"
      placeholder="Search videos..."
      autocomplete="off"
    >

    <span>⌕</span>

  </div>

</header>



<!-- ================= MOBILE MENU ================= -->

<div
  class="mobileMenu"
  id="mobileMenu"
>

  <a href="index.html">
    Home
  </a>

  <a href="most-viewed.html">
    Most Viewed
  </a>

  <a href="latest.html">
    Latest
  </a>

</div>



<!-- ================= MAIN ================= -->

<main class="dvMain">

  <section class="dvSection">


    <!-- SECTION TITLE -->

    <div class="dvSectionTitle pageSectionTitle">

      <a
        href="index.html"
        class="sectionBack"
      >
        ‹
      </a>

      <span>
        ›
      </span>

      <h1>
        Latest Videos
      </h1>

    </div>


    <!-- VIDEOS -->

    <div
      id="videos"
      class="dvGrid"
    ></div>

  </section>

</main>



<!-- ================= FOOTER ================= -->

<footer>

  <p>
    © DesiVexa
  </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";



/* ================================================
   SUPABASE
================================================ */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );



/* ================================================
   ELEMENT
================================================ */

const videosEl =
  document.querySelector("#videos");



/* ================================================
   ESCAPE HTML
================================================ */

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"

        }[character];

      }
    );

}



/* ================================================
   VIDEO CARD
================================================ */

function videoCard(video) {


  const id =
    encodeURIComponent(
      video.id
    );


  const title =
    esc(
      video.title ||
      "Untitled video"
    );


  const category =
    esc(
      video.category ||
      "Other"
    );


  const views =
    Number(
      video.views || 0
    ).toLocaleString();



  /* THUMBNAIL */

  const thumbnail =
    video.thumbnail_url
      ? `
        <img
          src="${esc(video.thumbnail_url)}"
          alt="${title}"
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `
      : "";



  return `

    <a
      class="card"
      href="video.html?id=${id}"
    >

      <div class="thumb">

        ${thumbnail}


        <!-- DARK OVERLAY -->

        <div class="thumbOverlay"></div>


        <!-- PLAY BUTTON -->

        <div class="playCircle">
          ▶
        </div>


        <!-- VIEWS -->

        <div class="cardViews">
          ${views} views
        </div>

      </div>


      <!-- CARD BODY -->

      <div class="body">

        <h3>
          ${title}
        </h3>


        <div class="cardMeta">

          <span>
            ${category}
          </span>

          <span>
            ${views} views
          </span>

        </div>

      </div>

    </a>

  `;

}



/* ================================================
   LOAD LATEST VIDEOS
================================================ */

async function load() {


  /* LOADING */

  videosEl.innerHTML = `

    <p class="muted">
      Loading videos...
    </p>

  `;



  try {


    /* ============================================
       GET PUBLISHED VIDEOS
    ============================================ */

    const {
      data,
      error
    } = await supabase

      .from("videos")

      .select("*")

      .eq(
        "published",
        true
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );



    /* ============================================
       DATABASE ERROR
    ============================================ */

    if (error) {

      console.error(
        "Supabase error:",
        error
      );


      videosEl.innerHTML = `

        <div class="videoError">

          <h3>
            Could not load videos
          </h3>

          <p>
            Please try again later.
          </p>

        </div>

      `;

      return;

    }



    /* ============================================
       NO VIDEOS
    ============================================ */

    if (
      !data ||
      !data.length
    ) {

      videosEl.innerHTML = `

        <div class="videoError">

          <h3>
            No videos available
          </h3>

          <p>
            Add published videos from
            the admin panel.
          </p>

        </div>

      `;

      return;

    }



    /* ============================================
       SHOW VIDEOS
    ============================================ */

    videosEl.innerHTML =
      data
        .map(videoCard)
        .join("");


  }


  /* ==============================================
     GENERAL ERROR
  ============================================== */

  catch (error) {

    console.error(
      "Latest page error:",
      error
    );


    videosEl.innerHTML = `

      <div class="videoError">

        <h3>
          Something went wrong
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}



/* ================================================
   START
================================================ */

load();



/* ================================================
   MOBILE MENU
================================================ */

const menuBtn =
  document.querySelector(
    "#menuBtn"
  );


const mobileMenu =
  document.querySelector(
    "#mobileMenu"
  );


menuBtn?.addEventListener(
  "click",
  () => {

    mobileMenu?.classList.toggle(
      "show"
    );

  }
);



/* ================================================
   SEARCH BUTTON
================================================ */

const searchBtn =
  document.querySelector(
    "#searchBtn"
  );


const searchBox =
  document.querySelector(
    "#searchBox"
  );


searchBtn?.addEventListener(
  "click",
  () => {


    searchBox?.classList.toggle(
      "show"
    );


    if (
      searchBox?.classList.contains(
        "show"
      )
    ) {

      document
        .querySelector(
          "#search"
        )
        ?.focus();

    }

  }
);



/* ================================================
   SEARCH
================================================ */

document
  .querySelector("#search")
  ?.addEventListener(
    "keydown",
    event => {


      if (
        event.key !== "Enter"
      ) {

        return;

      }


      event.preventDefault();


      const value =
        event.target.value.trim();


      if (!value) {

        return;

      }


      location.href =
        `index.html?search=${encodeURIComponent(value)}`;

    }
  );

</script>


</body>

</html>
