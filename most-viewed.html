<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Most viewed videos on DesiVexa - 18+ video platform.">

  <title>Most Viewed - DesiVexa</title>

  <link
    rel="stylesheet"
    href="style.css">

  <link
    rel="stylesheet"
    href="ads.css">

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="dvHeader">

    <div class="dvHeaderInner">

      <button
        id="menuBtn"
        class="headerIcon"
        type="button"
        aria-label="Menu">

        ☰

      </button>


      <a
        href="index.html"
        class="dvLogo">

        Desi<span>Vexa</span>

      </a>


      <button
        id="searchBtn"
        class="headerIcon"
        type="button"
        aria-label="Search">

        ⌕

      </button>

    </div>


    <!-- SEARCH -->

    <div
      id="searchBox"
      class="dvSearchBox">

      <input
        id="search"
        type="search"
        placeholder="Search videos..."
        autocomplete="off">

    </div>

  </header>



  <!-- =========================
       MOBILE MENU
  ========================== -->

  <div
    id="mobileMenu"
    class="mobileMenu">

    <a href="index.html">
      Home
    </a>

    <a href="most-viewed.html">
      Most Viewed
    </a>

    <a href="latest.html">
      Latest
    </a>

    <a href="index.html#categories">
      Categories
    </a>

  </div>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="dvMain">


    <!-- TOP AD -->

    <div
      class="dvAdSlot dvAdWide"
      data-juicy-ad="wide">
    </div>



    <!-- PAGE TITLE -->

    <div class="dvSectionTitle">

      <div>

        <span class="sectionLabel">
          TRENDING
        </span>

        <h2>
          Most Viewed
        </h2>

      </div>


      <a href="index.html">
        Home
      </a>

    </div>



    <!-- VIDEO LIST -->

    <div
      id="mostViewedVideos"
      class="dvGrid">

      <p class="muted">
        Loading videos...
      </p>

    </div>



    <!-- COMPACT AD -->

    <div
      class="dvAdSlot dvAdCompact"
      data-juicy-ad="compact">
    </div>



    <!-- BANNER AD -->

    <div
      class="dvAdSlot dvAdBanner"
      data-juicy-ad="banner">
    </div>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footerLogo">

      Desi<span>Vexa</span>

    </div>


    <p>
      18+ only · All content must be
      lawful and consensual.
    </p>


    <a href="legal.html">
      Terms & Privacy
    </a>

  </footer>



  <!-- =========================
       PAGE SCRIPT
  ========================== -->

  <script type="module">

    import {
      createClient
    } from
      "https://esm.sh/@supabase/supabase-js@2";


    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const container =
      document.querySelector(
        "#mostViewedVideos"
      );


    /* =========================
       ESCAPE HTML
    ========================== */

    function esc(value) {

      return String(value ?? "")
        .replace(
          /[&<>"']/g,
          char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char])
        );

    }


    /* =========================
       VIDEO CARD
    ========================== */

    function card(video) {

      const title =
        esc(
          video.title ||
          "Untitled video"
        );


      const category =
        esc(
          video.category ||
          "Other"
        );


      const views =
        Number(
          video.views || 0
        ).toLocaleString();


      const thumbnail =
        video.thumbnail_url

          ? `
            <img
              src="${esc(
                video.thumbnail_url
              )}"
              alt="${title}"
              loading="lazy"
              decoding="async">
          `

          : `
            <div class="noThumb">
              DESIVEXA
            </div>
          `;


      return `

        <a
          class="card"
          href="video.html?id=${encodeURIComponent(
            video.id
          )}">


          <div class="thumb">

            ${thumbnail}


            <div class="thumbOverlay">
            </div>


            <div class="playCircle">
              ▶
            </div>


            <div class="cardViews">
              ${views} views
            </div>

          </div>


          <div class="body">

            <h3>
              ${title}
            </h3>


            <div class="cardMeta">

              <span>
                ${category}
              </span>

              <span>
                ${views} views
              </span>

            </div>

          </div>


        </a>

      `;

    }


    /* =========================
       LOAD MOST VIEWED
    ========================== */

    async function loadMostViewed() {

      const {
        data,
        error
      } = await supabase

        .from("videos")

        .select(`
          id,
          title,
          category,
          thumbnail_url,
          views,
          created_at
        `)

        .eq(
          "published",
          true
        )

        .order(
          "views",
          {
            ascending: false
          }
        )

        .limit(30);


      if (error) {

        console.error(
          "Most viewed videos:",
          error
        );


        container.innerHTML = `

          <p class="muted">
            Could not load videos.
          </p>

        `;

        return;

      }


      if (
        !data ||
        !data.length
      ) {

        container.innerHTML = `

          <p class="muted">
            No videos available.
          </p>

        `;

        return;

      }


      container.innerHTML =
        data
          .map(card)
          .join("");

    }


    /* =========================
       MENU
    ========================== */

    document
      .querySelector("#menuBtn")
      ?.addEventListener(
        "click",
        () => {

          document
            .querySelector(
              "#mobileMenu"
            )
            ?.classList
            .toggle("show");

        }
      );


    /* =========================
       SEARCH BUTTON
    ========================== */

    document
      .querySelector("#searchBtn")
      ?.addEventListener(
        "click",
        () => {

          const box =
            document.querySelector(
              "#searchBox"
            );


          box
            ?.classList
            .toggle("show");


          box
            ?.querySelector("input")
            ?.focus();

        }
      );


    /* =========================
       SEARCH
    ========================== */

    document
      .querySelector("#search")
      ?.addEventListener(
        "keydown",
        event => {

          if (
            event.key !== "Enter"
          ) {

            return;

          }


          const query =
            event.target.value.trim();


          if (query) {

            window.location.href =
              `index.html?search=${encodeURIComponent(
                query
              )}`;

          } else {

            window.location.href =
              "index.html";

          }

        }
      );


    /* =========================
       START
    ========================== */

    loadMostViewed();

  </script>



  <!-- =========================
       JUICYADS
  ========================== -->

  <script type="module">

    import {
      initJuicyAds
    } from "./ads.js";


    initJuicyAds({

      float: true,

      native: true

    });

  </script>


</body>

</html>
