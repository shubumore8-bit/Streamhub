<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DesiVexa - Search</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 5%;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.searchBox{
  flex:1;
  max-width:700px;
  margin:auto;
}

.searchBox input{
  width:100%;
  padding:12px 18px;
  border-radius:25px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

.searchBox input:focus{
  border-color:#e50914;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1400px;
  margin:25px auto;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:24px;
}

.heading p{
  color:#888;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:#121212;
  border:1px solid #222;
  border-radius:9px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#e50914;
}

.thumb{
  height:160px;
  background:linear-gradient(135deg,#270000,#151515,#400000);
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#e50914;
  font-size:40px;
  text-shadow:0 2px 10px #000;
}

.info{
  padding:12px;
}

.title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  color:#888;
  font-size:12px;
  margin-top:7px;
}

.message{
  grid-column:1/-1;
  background:#111;
  border:1px solid #292929;
  padding:40px 20px;
  border-radius:10px;
  text-align:center;
  color:#888;
}

.message h2{
  color:#fff;
  margin-bottom:8px;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:30px 0;
}

.pagination button{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px 14px;
  border-radius:6px;
  cursor:pointer;
}

.pagination button.active,
.pagination button:hover{
  background:#e50914;
  border-color:#e50914;
}

.pagination button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-nav a{
  color:#aaa;
  text-align:center;
  font-size:12px;
}

.bottom-nav div{
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .container{
    width:94%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .thumb{
    height:115px;
  }

  .info{
    padding:9px;
  }

  .title{
    font-size:14px;
  }
}

@media(max-width:380px){

  .profile{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    DesiVexa
  </a>

  <div class="searchBox">
    <input
      id="searchInput"
      type="text"
      placeholder="Search videos..."
      autocomplete="off"
    >
  </div>

  <a href="profile.html" class="profile">
    P
  </a>

</header>


<main class="container">

  <div class="heading">

    <h1 id="pageTitle">
      Search Results
    </h1>

    <p id="resultCount">
      Loading...
    </p>

  </div>


  <div
    id="videoGrid"
    class="grid">

    <div class="message">
      <h2>Loading...</h2>
      <p>Please wait.</p>
    </div>

  </div>


  <div
    id="pagination"
    class="pagination">
  </div>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="new.html">
    <div>★</div>
    Latest
  </a>

  <a href="trending.html">
    <div>🔥</div>
    Trending
  </a>

  <a href="recommended.html">
    <div>♥</div>
    Recommended
  </a>

  <a href="profile.html">
    <div>●</div>
    Profile
  </a>

</nav>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let search =
  params.get("q") || "";

search =
  search.trim();


let currentPage =
  parseInt(
    params.get("page") || "1",
    10
  );


if(
  isNaN(currentPage) ||
  currentPage < 1
){
  currentPage = 1;
}


const PER_PAGE = 20;

let allVideos = [];

let results = [];


/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById(
    "searchInput"
  );

const grid =
  document.getElementById(
    "videoGrid"
  );

const title =
  document.getElementById(
    "pageTitle"
  );

const count =
  document.getElementById(
    "resultCount"
  );

const pagination =
  document.getElementById(
    "pagination"
  );


input.value = search;


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   VIEWS
========================= */

function formatViews(value){

  const n =
    Number(value) || 0;

  if(n >= 1000000){

    return (
      (n / 1000000)
      .toFixed(1)
      .replace(".0","") +
      "M"
    );

  }

  if(n >= 1000){

    return (
      (n / 1000)
      .toFixed(1)
      .replace(".0","") +
      "K"
    );

  }

  return String(n);

}


/* =========================
   NORMALIZE SEARCH
========================= */

function normalize(text){

  return String(text || "")
    .toLowerCase()
    .trim();

}


/* =========================
   LOAD ALL PUBLISHED VIDEOS
========================= */

async function loadVideos(){

  grid.innerHTML = `
    <div class="message">
      <h2>Loading videos...</h2>
      <p>Please wait.</p>
    </div>
  `;


  const {
    data,
    error
  } =
  await supabase
    .from("videos")
    .select(`
      id,
      title,
      category,
      thumbnail_url,
      video_url,
      views,
      created_at
    `)
    .eq(
      "published",
      true
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1000);


  if(error){

    console.error(
      "VIDEOS ERROR:",
      error
    );


    grid.innerHTML = `
      <div class="message">
        <h2>Videos load nahi ho rahe</h2>
        <p>${escapeHTML(error.message)}</p>
      </div>
    `;

    count.textContent =
      "Database error";

    return;

  }


  allVideos =
    data || [];


  /*
    SEARCH
  */

  const q =
    normalize(search);


  if(!q){

    results =
      allVideos;

  }else{

    results =
      allVideos.filter(
        video => {

          const videoTitle =
            normalize(
              video.title
            );

          const category =
            normalize(
              video.category
            );


          return (
            videoTitle.includes(q) ||
            category.includes(q)
          );

        }
      );

  }


  render();

}


/* =========================
   RENDER
========================= */

function render(){

  if(search){

    title.textContent =
      'Results for "' +
      search +
      '"';

  }else{

    title.textContent =
      "All Videos";

  }


  count.textContent =
    results.length +
    (
      results.length === 1
      ? " video found"
      : " videos found"
    );


  if(results.length === 0){

    grid.innerHTML = `

      <div class="message">

        <h2>
          No videos found
        </h2>

        <p>
          ${
            search
            ? 'No video found for "' +
              escapeHTML(search) +
              '".'
            : "No published videos available."
          }
        </p>

      </div>

    `;


    pagination.innerHTML = "";

    return;

  }


  const totalPages =
    Math.ceil(
      results.length /
      PER_PAGE
    );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (currentPage - 1) *
    PER_PAGE;


  const end =
    start +
    PER_PAGE;


  const pageVideos =
    results.slice(
      start,
      end
    );


  grid.innerHTML =
    pageVideos
      .map(video => {

        const videoTitle =
          escapeHTML(
            video.title ||
            "Untitled Video"
          );


        const category =
          escapeHTML(
            video.category ||
            "Uncategorized"
          );


        const views =
          formatViews(
            video.views
          );


        let image = "";


        if(
          video.thumbnail_url
        ){

          image = `

            <img
              src="${escapeHTML(
                video.thumbnail_url
              )}"
              alt="${videoTitle}"
              loading="lazy"
            >

          `;

        }


        return `

          <a
            href="video.html?id=${
              encodeURIComponent(
                video.id
              )
            }"
            class="card">

            <div class="thumb">

              ${image}

              <div class="play">
                ▶
              </div>

            </div>

            <div class="info">

              <div class="title">
                ${videoTitle}
              </div>

              <div class="meta">

                👁 ${views}
                •
                ${category}

              </div>

            </div>

          </a>

        `;

      })
      .join("");


  renderPagination();

}


/* =========================
   PAGINATION
========================= */

function renderPagination(){

  const totalPages =
    Math.ceil(
      results.length /
      PER_PAGE
    );


  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }


  let html = "";


  html += `
    <button
      id="prevBtn"
      ${currentPage === 1 ? "disabled" : ""}>
      Previous
    </button>
  `;


  let start =
    Math.max(
      1,
      currentPage - 2
    );


  let end =
    Math.min(
      totalPages,
      start + 4
    );


  if(
    end - start < 4
  ){

    start =
      Math.max(
        1,
        end - 4
      );

  }


  for(
    let i = start;
    i <= end;
    i++
  ){

    html += `
      <button
        class="${
          i === currentPage
          ? "active"
          : ""
        }"
        data-page="${i}">
        ${i}
      </button>
    `;

  }


  html += `
    <button
      id="nextBtn"
      ${currentPage === totalPages ? "disabled" : ""}>
      Next
    </button>
  `;


  pagination.innerHTML =
    html;


  document
    .getElementById("prevBtn")
    .onclick =
    () => goToPage(
      currentPage - 1
    );


  document
    .getElementById("nextBtn")
    .onclick =
    () => goToPage(
      currentPage + 1
    );


  document
    .querySelectorAll(
      "[data-page]"
    )
    .forEach(button => {

      button.onclick =
      () => goToPage(
        Number(
          button.dataset.page
        )
      );

    });

}


/* =========================
   PAGE CHANGE
========================= */

function goToPage(newPage){

  const totalPages =
    Math.ceil(
      results.length /
      PER_PAGE
    );


  if(
    newPage < 1 ||
    newPage > totalPages
  ){

    return;

  }


  currentPage =
    newPage;


  const url =
    new URL(
      window.location.href
    );


  if(search){

    url.searchParams.set(
      "q",
      search
    );

  }


  url.searchParams.set(
    "page",
    currentPage
  );


  window.history.pushState(
    {},
    "",
    url
  );


  render();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   SEARCH
========================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key !== "Enter"
    ){

      return;

    }


    const value =
      input.value.trim();


    if(!value){

      window.location.href =
        "search.html";

      return;

    }


    window.location.href =
      "search.html?q=" +
      encodeURIComponent(
        value
      );

  }
);


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
