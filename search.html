<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DesiVexa - Search</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  gap:12px;
  padding:0 5%;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.searchBox{
  flex:1;
  max-width:700px;
  margin:auto;
}

.searchBox input{
  width:100%;

  padding:12px 18px;

  border-radius:25px;

  border:1px solid #333;

  background:#1b1b1b;

  color:#fff;

  outline:none;

  font-size:15px;
}

.searchBox input:focus{
  border-color:#e50914;
}

.profile{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#e50914;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
}

/* MAIN */

.container{
  width:92%;
  max-width:1400px;

  margin:25px auto;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:24px;
}

.heading p{
  color:#888;
  margin-top:7px;
}

/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:18px;
}

/* CARD */

.card{
  background:#121212;

  border:1px solid #222;

  border-radius:9px;

  overflow:hidden;

  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);

  border-color:#e50914;
}

/* THUMBNAIL */

.thumb{
  height:160px;

  background:
    linear-gradient(
      135deg,
      #270000,
      #151515,
      #400000
    );

  position:relative;

  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.play{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  color:#e50914;

  font-size:40px;

  text-shadow:
    0 2px 10px #000;
}

/* INFO */

.info{
  padding:12px;
}

.title{
  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.meta{
  color:#888;

  font-size:12px;

  margin-top:7px;
}

/* MESSAGE */

.message{
  grid-column:1/-1;

  background:#111;

  border:1px solid #292929;

  padding:40px 20px;

  border-radius:10px;

  text-align:center;

  color:#888;
}

.message h2{
  color:#fff;

  margin-bottom:8px;
}

/* PAGINATION */

.pagination{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;

  margin:30px 0;
}

.pagination button{
  background:#171717;

  border:1px solid #333;

  color:#fff;

  padding:9px 14px;

  border-radius:6px;

  cursor:pointer;

  font-size:14px;
}

.pagination button:hover{
  background:#e50914;

  border-color:#e50914;
}

.pagination button.active{
  background:#e50914;

  border-color:#e50914;
}

.pagination button:disabled{
  opacity:.35;

  cursor:not-allowed;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;

  bottom:0;
  left:0;

  width:100%;

  height:65px;

  background:#111;

  border-top:1px solid #292929;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:100;
}

.bottom-nav a{
  color:#aaa;

  text-align:center;

  font-size:12px;
}

.bottom-nav a.active{
  color:#e50914;
}

.bottom-nav div{
  font-size:20px;

  margin-bottom:3px;
}

/* TABLET */

@media(max-width:900px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

/* MOBILE */

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .container{
    width:94%;
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:10px;
  }

  .thumb{
    height:115px;
  }

  .info{
    padding:9px;
  }

  .title{
    font-size:14px;
  }

  .meta{
    font-size:11px;
  }

}

/* SMALL MOBILE */

@media(max-width:380px){

  .profile{
    display:none;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

  <a
    href="index.html"
    class="logo">

    DesiVexa

  </a>


  <div class="searchBox">

    <input
      id="searchInput"
      type="text"
      placeholder="Search videos..."
      autocomplete="off"
    >

  </div>


  <a
    href="profile.html"
    class="profile">

    P

  </a>

</header>



<!-- MAIN -->

<main class="container">


  <div class="heading">

    <h1 id="pageTitle">
      Search Results
    </h1>

    <p id="resultCount">
      Loading...
    </p>

  </div>


  <div
    id="videoGrid"
    class="grid">

    <div class="message">

      Loading videos...

    </div>

  </div>


  <div
    id="pagination"
    class="pagination">
  </div>


</main>



<!-- BOTTOM NAV -->

<nav class="bottom-nav">


  <a href="index.html">

    <div>⌂</div>

    Home

  </a>


  <a href="new.html">

    <div>★</div>

    Latest

  </a>


  <a
    href="trending.html">

    <div>🔥</div>

    Trending

  </a>


  <a
    href="recommended.html">

    <div>♥</div>

    Recommended

  </a>


  <a
    href="profile.html">

    <div>●</div>

    Profile

  </a>


</nav>



<script type="module">


/* =========================
   SUPABASE
========================= */

import {
  createClient
}
from
"https://esm.sh/@supabase/supabase-js@2";


import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );



/* =========================
   URL SEARCH
========================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


let search =
  urlParams.get("q") || "";


search =
  search.trim();


let page =
  parseInt(
    urlParams.get("page") || "1"
  );


if(
  isNaN(page) ||
  page < 1
){

  page = 1;

}



/* =========================
   SETTINGS
========================= */

const PER_PAGE = 20;

let videos = [];



/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById(
    "searchInput"
  );


const grid =
  document.getElementById(
    "videoGrid"
  );


const title =
  document.getElementById(
    "pageTitle"
  );


const count =
  document.getElementById(
    "resultCount"
  );


const pagination =
  document.getElementById(
    "pagination"
  );



/* =========================
   INPUT
========================= */

input.value =
  search;



/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(text){

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================
   VIEWS
========================= */

function formatViews(value){

  const number =
    Number(value) || 0;


  if(
    number >= 1000000
  ){

    return (
      (number / 1000000)
      .toFixed(1)
      .replace(".0","")
      +
      "M"
    );

  }


  if(
    number >= 1000
  ){

    return (
      (number / 1000)
      .toFixed(1)
      .replace(".0","")
      +
      "K"
    );

  }


  return String(number);

}



/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){


  grid.innerHTML = `

    <div class="message">

      Searching...

    </div>

  `;


  let request =
    supabase
      .from("videos")
      .select(`
        id,
        title,
        category,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)
      .eq(
        "published",
        true
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  /*
    SEARCH TITLE OR CATEGORY
  */

  if(search){

    const cleanSearch =
      search
        .replace(
          /[%_]/g,
          ""
        )
        .replace(
          /,/g,
          " "
        );


    if(cleanSearch){

      request =
        request.or(
          "title.ilike.%" +
          cleanSearch +
          "%," +
          "category.ilike.%" +
          cleanSearch +
          "%"
        );

    }

  }


  const {
    data,
    error
  } =
  await request;


  if(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    grid.innerHTML = `

      <div class="message">

        <h2>
          Search Error
        </h2>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;


    count.textContent =
      "Unable to load videos";


    pagination.innerHTML =
      "";


    return;

  }


  videos =
    data || [];


  render();

}



/* =========================
   RENDER
========================= */

function render(){


  /*
    TITLE
  */

  if(search){

    title.textContent =
      'Results for "' +
      search +
      '"';

  }
  else{

    title.textContent =
      "All Videos";

  }


  /*
    COUNT
  */

  count.textContent =
    videos.length +
    (
      videos.length === 1
      ? " video found"
      : " videos found"
    );



  /*
    NO RESULTS
  */

  if(videos.length === 0){

    grid.innerHTML = `

      <div class="message">

        <h2>
          No videos found
        </h2>

        <p>
          ${
            search
              ? 'No videos found for "' +
                escapeHTML(search) +
                '".'
              : "There are no published videos yet."
          }
        </p>

      </div>

    `;


    pagination.innerHTML =
      "";


    return;

  }



  /*
    TOTAL PAGES
  */

  const totalPages =
    Math.ceil(
      videos.length /
      PER_PAGE
    );


  if(
    page > totalPages
  ){

    page =
      totalPages;

  }



  /*
    CURRENT PAGE
  */

  const start =
    (page - 1) *
    PER_PAGE;


  const end =
    start +
    PER_PAGE;


  const pageVideos =
    videos.slice(
      start,
      end
    );



  /*
    CARDS
  */

  grid.innerHTML =
    pageVideos
      .map(
        video => {

          const videoTitle =
            escapeHTML(
              video.title ||
              "Untitled Video"
            );


          const category =
            escapeHTML(
              video.category ||
              "Uncategorized"
            );


          const views =
            formatViews(
              video.views
            );


          let thumbnailHTML = `

            <div class="play">
              ▶
            </div>

          `;


          if(
            video.thumbnail_url
          ){

            thumbnailHTML = `

              <img
                src="${
                  escapeHTML(
                    video.thumbnail_url
                  )
                }"
                alt="${videoTitle}"
                loading="lazy"
              >

              <div class="play">
                ▶
              </div>

            `;

          }


          return `

            <a
              class="card"
              href="video.html?id=${
                encodeURIComponent(
                  video.id
                )
              }">


              <div class="thumb">

                ${thumbnailHTML}

              </div>


              <div class="info">

                <div class="title">

                  ${videoTitle}

                </div>


                <div class="meta">

                  👁 ${views}

                  •

                  ${category}

                </div>

              </div>


            </a>

          `;

        }
      )
      .join("");



  renderPagination();

}



/* =========================
   PAGINATION
========================= */

function renderPagination(){


  const totalPages =
    Math.ceil(
      videos.length /
      PER_PAGE
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";

    return;

  }


  let html = "";



  /*
    PREVIOUS
  */

  html += `

    <button
      id="previousButton">

      Previous

    </button>

  `;



  /*
    PAGE NUMBERS
  */

  let startPage =
    Math.max(
      1,
      page - 2
    );


  let endPage =
    Math.min(
      totalPages,
      startPage + 4
    );


  if(
    endPage - startPage < 4
  ){

    startPage =
      Math.max(
        1,
        endPage - 4
      );

  }


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="${
          i === page
          ? "active"
          : ""
        }"
        data-page="${i}">

        ${i}

      </button>

    `;

  }



  /*
    NEXT
  */

  html += `

    <button
      id="nextButton">

      Next

    </button>

  `;


  pagination.innerHTML =
    html;



  /*
    BUTTON EVENTS
  */

  const previous =
    document.getElementById(
      "previousButton"
    );


  const next =
    document.getElementById(
      "nextButton"
    );


  previous.disabled =
    page === 1;


  next.disabled =
    page === totalPages;



  previous.onclick =
    function(){

      if(page > 1){

        goToPage(
          page - 1
        );

      }

    };



  next.onclick =
    function(){

      if(
        page < totalPages
      ){

        goToPage(
          page + 1
        );

      }

    };



  document
    .querySelectorAll(
      "[data-page]"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            goToPage(
              Number(
                this.dataset.page
              )
            );

          };

      }
    );

}



/* =========================
   GO TO PAGE
========================= */

function goToPage(
  newPage
){

  page =
    newPage;


  const url =
    new URL(
      window.location.href
    );


  if(search){

    url.searchParams.set(
      "q",
      search
    );

  }


  url.searchParams.set(
    "page",
    page
  );


  window.history.pushState(
    {},
    "",
    url
  );


  render();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================
   SEARCH
========================= */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Enter"
    ){

      return;

    }


    const value =
      this.value.trim();


    if(!value){

      window.location.href =
        "search.html";

      return;

    }


    window.location.href =
      "search.html?q=" +
      encodeURIComponent(
        value
      );

  }
);



/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
