<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DesiVexa - Search</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 5%;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.search{
  flex:1;
  max-width:700px;
  margin:auto;
}

.search input{
  width:100%;
  padding:12px 18px;
  border-radius:25px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

.search input:focus{
  border-color:#e50914;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1400px;
  margin:25px auto;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:24px;
}

.heading p{
  color:#888;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:#121212;
  border:1px solid #222;
  border-radius:9px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#e50914;
}

.thumb{
  height:160px;
  background:#151515;
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumbPlaceholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    135deg,
    #270000,
    #151515,
    #400000
  );
}

.play{
  color:#e50914;
  font-size:42px;
}

.info{
  padding:12px;
}

.title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  color:#888;
  font-size:12px;
  margin-top:7px;
}

.no-results{
  background:#111;
  border:1px solid #292929;
  padding:35px 20px;
  border-radius:10px;
  text-align:center;
  color:#888;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#888;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:30px 0;
}

.pagination button{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px 14px;
  border-radius:6px;
  cursor:pointer;
}

.pagination button:hover,
.pagination button.active{
  background:#e50914;
  border-color:#e50914;
}

.pagination button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-nav a{
  color:#aaa;
  text-align:center;
  font-size:12px;
}

.bottom-nav a.active{
  color:#e50914;
}

.bottom-nav div{
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .container{
    width:94%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .thumb{
    height:115px;
  }

  .info{
    padding:9px;
  }

  .title{
    font-size:14px;
  }

}

@media(max-width:380px){

  .profile{
    display:none;
  }

}

</style>

</head>

<body>

<header>

  <a href="index.html" class="logo">
    DesiVexa
  </a>

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Search videos..."
      autocomplete="off"
      onkeydown="handleSearch(event)"
    >

  </div>

  <a href="profile.html" class="profile">
    P
  </a>

</header>


<main class="container">

  <div class="heading">

    <h1 id="searchTitle">
      All Videos
    </h1>

    <p id="resultCount">
      Loading...
    </p>

  </div>


  <div
    class="grid"
    id="resultsGrid">

    <div class="loading">
      Loading videos...
    </div>

  </div>


  <div
    class="pagination"
    id="pagination">
  </div>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="new.html">
    <div>★</div>
    Latest
  </a>

  <a href="trending.html">
    <div>🔥</div>
    Trending
  </a>

  <a href="recommended.html">
    <div>♥</div>
    Recommended
  </a>

  <a href="profile.html">
    <div>●</div>
    Profile
  </a>

</nav>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   SEARCH QUERY
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let query =
  params.get("q") || "";

query =
  query.trim();


document.getElementById(
  "searchInput"
).value = query;


/* =========================
   SETTINGS
========================= */

const perPage = 20;

let currentPage =
  parseInt(
    params.get("page") || "1",
    10
  );

if(
  !Number.isFinite(currentPage) ||
  currentPage < 1
){
  currentPage = 1;
}


let results = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   FORMAT VIEWS
========================= */

function formatViews(views){

  const number =
    Number(views) || 0;

  if(number >= 1000000){

    return (
      (number / 1000000)
      .toFixed(
        number >= 10000000 ? 0 : 1
      )
      .replace(".0","")
      + "M"
    );

  }

  if(number >= 1000){

    return (
      (number / 1000)
      .toFixed(
        number >= 10000 ? 0 : 1
      )
      .replace(".0","")
      + "K"
    );

  }

  return String(number);

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  const grid =
    document.getElementById(
      "resultsGrid"
    );

  const count =
    document.getElementById(
      "resultCount"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading videos...
    </div>
  `;

  let queryBuilder =
    supabase
      .from("videos")
      .select(`
        id,
        title,
        category,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)
      .eq("published", true)
      .order(
        "created_at",
        {ascending:false}
      );


  /*
    Agar search query hai,
    title/category dono me
    search karenge.
  */

  if(query){

    const safeQuery =
      query.replace(
        /[%_]/g,
        ""
      );

    if(safeQuery){

      queryBuilder =
        queryBuilder.or(
          `title.ilike.%${safeQuery}%,category.ilike.%${safeQuery}%`
        );

    }

  }


  const {
    data,
    error
  } =
    await queryBuilder;


  if(error){

    console.error(
      "Search error:",
      error
    );

    grid.innerHTML = `
      <div
        class="no-results"
        style="grid-column:1/-1">

        <h2>
          Failed to load videos
        </h2>

        <p style="margin-top:8px">
          Please refresh the page.
        </p>

      </div>
    `;

    count.textContent =
      "Unable to load results";

    document.getElementById(
      "pagination"
    ).innerHTML = "";

    return;

  }


  results =
    data || [];


  render();

}


/* =========================
   RENDER
========================= */

function render(){

  const grid =
    document.getElementById(
      "resultsGrid"
    );

  const title =
    document.getElementById(
      "searchTitle"
    );

  const count =
    document.getElementById(
      "resultCount"
    );


  if(query){

    title.textContent =
      `Search: "${query}"`;

  }else{

    title.textContent =
      "All Videos";

  }


  count.textContent =
    results.length +
    " videos found";


  if(results.length === 0){

    grid.innerHTML = `

      <div
        class="no-results"
        style="grid-column:1/-1">

        <h2>
          No videos found
        </h2>

        <p style="margin-top:8px">
          Try another search.
        </p>

      </div>

    `;

    document.getElementById(
      "pagination"
    ).innerHTML = "";

    return;

  }


  const totalPages =
    Math.ceil(
      results.length /
      perPage
    );


  if(currentPage > totalPages){

    currentPage =
      totalPages;

  }


  const start =
    (currentPage - 1) *
    perPage;

  const end =
    start + perPage;


  const pageResults =
    results.slice(
      start,
      end
    );


  grid.innerHTML =
    pageResults
      .map(video => {

        const title =
          escapeHtml(
            video.title ||
            "Untitled Video"
          );

        const category =
          escapeHtml(
            video.category ||
            "Uncategorized"
          );

        const views =
          formatViews(
            video.views
          );

        const thumbnail =
          video.thumbnail_url
            ? `
              <img
                src="${escapeHtml(video.thumbnail_url)}"
                alt="${title}"
                loading="lazy"
                onerror="this.parentElement.innerHTML='<div class=&quot;thumbPlaceholder&quot;><div class=&quot;play&quot;>▶</div></div>'"
              >
            `
            : `
              <div class="thumbPlaceholder">
                <div class="play">
                  ▶
                </div>
              </div>
            `;


        return `

          <a
            href="video.html?id=${encodeURIComponent(video.id)}"
            class="card">

            <div class="thumb">

              ${thumbnail}

            </div>

            <div class="info">

              <div class="title">
                ${title}
              </div>

              <div class="meta">

                👁 ${views}
                •
                ${category}

              </div>

            </div>

          </a>

        `;

      })
      .join("");


  renderPagination();

}


/* =========================
   PAGINATION
========================= */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );

  const totalPages =
    Math.ceil(
      results.length /
      perPage
    );


  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }


  let html = "";


  /*
    Previous
  */

  html += `

    <button
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}>

      Previous

    </button>

  `;


  /*
    Page numbers:
    1 2 3 4 5
  */

  const maxButtons = 5;

  let startPage =
    Math.max(
      1,
      currentPage - 2
    );

  let endPage =
    Math.min(
      totalPages,
      startPage + maxButtons - 1
    );


  if(
    endPage - startPage + 1
    < maxButtons
  ){

    startPage =
      Math.max(
        1,
        endPage - maxButtons + 1
      );

  }


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="${i === currentPage ? "active" : ""}"
        onclick="changePage(${i})">

        ${i}

      </button>

    `;

  }


  /*
    Next
  */

  html += `

    <button
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? "disabled" : ""}>

      Next

    </button>

  `;


  pagination.innerHTML =
    html;

}


/* =========================
   CHANGE PAGE
========================= */

window.changePage =
function(page){

  const totalPages =
    Math.ceil(
      results.length /
      perPage
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  const url =
    new URL(
      window.location.href
    );


  if(query){

    url.searchParams.set(
      "q",
      query
    );

  }else{

    url.searchParams.delete(
      "q"
    );

  }


  url.searchParams.set(
    "page",
    currentPage
  );


  window.history.pushState(
    {},
    "",
    url
  );


  render();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================
   NEW SEARCH
========================= */

window.handleSearch =
function(event){

  if(
    event.key !== "Enter"
  ){

    return;

  }


  const value =
    event.target.value.trim();


  if(!value){

    window.location.href =
      "search.html";

    return;

  }


  window.location.href =
    "search.html?q=" +
    encodeURIComponent(value);

};


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
