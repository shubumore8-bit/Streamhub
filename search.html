<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DesiVexa - Search Results</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:65px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 5%;
}

.logo{
  color:#e50914;
  font-size:24px;
  font-weight:900;
}

.search{
  flex:1;
  max-width:700px;
  margin:auto;
}

.search input{
  width:100%;
  padding:12px 18px;
  border-radius:25px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

.search input:focus{
  border-color:#e50914;
}

.profile{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1400px;
  margin:25px auto;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:24px;
}

.heading p{
  color:#888;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:#121212;
  border:1px solid #222;
  border-radius:9px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#e50914;
}

.thumb{
  height:160px;
  background:#151515;
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    135deg,
    #270000,
    #151515,
    #400000
  );
}

.play{
  color:#e50914;
  font-size:42px;
}

.info{
  padding:12px;
}

.title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  color:#888;
  font-size:12px;
  margin-top:7px;
}

.loading,
.no-results,
.error{
  grid-column:1/-1;
  background:#111;
  border:1px solid #292929;
  padding:40px 20px;
  border-radius:10px;
  text-align:center;
  color:#888;
}

.no-results h2,
.error h2{
  color:#fff;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:30px 0;
}

.pagination button{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px 14px;
  border-radius:6px;
  cursor:pointer;
}

.pagination button:hover,
.pagination button.active{
  background:#e50914;
  border-color:#e50914;
}

.pagination button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:#111;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-nav a{
  color:#aaa;
  text-align:center;
  font-size:12px;
}

.bottom-nav a.active{
  color:#e50914;
}

.bottom-nav div{
  font-size:20px;
  margin-bottom:3px;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:20px;
  }

  .container{
    width:94%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .thumb{
    height:115px;
  }

  .info{
    padding:9px;
  }

  .title{
    font-size:14px;
  }

}

@media(max-width:380px){

  .profile{
    display:none;
  }

}

</style>

</head>

<body>

<header>

  <a href="index.html" class="logo">
    DesiVexa
  </a>

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Search videos..."
      autocomplete="off"
    >

  </div>

  <a href="profile.html" class="profile">
    P
  </a>

</header>


<main class="container">

  <div class="heading">

    <h1 id="searchTitle">
      Search Results
    </h1>

    <p id="resultCount">
      Loading...
    </p>

  </div>


  <div
    class="grid"
    id="resultsGrid">

    <div class="loading">
      Searching videos...
    </div>

  </div>


  <div
    class="pagination"
    id="pagination">
  </div>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    <div>⌂</div>
    Home
  </a>

  <a href="new.html">
    <div>★</div>
    Latest
  </a>

  <a href="trending.html">
    <div>🔥</div>
    Trending
  </a>

  <a href="recommended.html">
    <div>♥</div>
    Recommended
  </a>

  <a href="profile.html">
    <div>●</div>
    Profile
  </a>

</nav>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   SEARCH NAME
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let searchName =
  params.get("q") || "";

searchName =
  searchName.trim();


document.getElementById(
  "searchInput"
).value = searchName;


/* =========================
   SETTINGS
========================= */

const perPage = 20;

let currentPage =
  parseInt(
    params.get("page") || "1",
    10
  );

if(
  !Number.isFinite(currentPage) ||
  currentPage < 1
){
  currentPage = 1;
}


let videos = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   FORMAT VIEWS
========================= */

function formatViews(value){

  const views =
    Number(value) || 0;

  if(views >= 1000000){

    return (
      (views / 1000000)
      .toFixed(1)
      .replace(".0","")
      + "M"
    );

  }

  if(views >= 1000){

    return (
      (views / 1000)
      .toFixed(1)
      .replace(".0","")
      + "K"
    );

  }

  return String(views);

}


/* =========================
   LOAD SEARCH RESULTS
========================= */

async function loadSearchResults(){

  const grid =
    document.getElementById(
      "resultsGrid"
    );

  const title =
    document.getElementById(
      "searchTitle"
    );

  const count =
    document.getElementById(
      "resultCount"
    );


  grid.innerHTML = `
    <div class="loading">
      Searching videos...
    </div>
  `;


  /*
    Agar naam nahi diya gaya
    toh search page par
    all published videos.
  */

  let queryBuilder =
    supabase
      .from("videos")
      .select(`
        id,
        title,
        category,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)
      .eq("published",true)
      .order(
        "created_at",
        {ascending:false}
      );


  /*
    Search:
    title OR category
  */

  if(searchName){

    const cleanName =
      searchName
        .replace(/[%_]/g,"")
        .replace(/,/g," ");

    if(cleanName){

      queryBuilder =
        queryBuilder.or(
          `title.ilike.%${cleanName}%,category.ilike.%${cleanName}%`
        );

    }

  }


  const {
    data,
    error
  } =
    await queryBuilder;


  if(error){

    console.error(
      "Search error:",
      error
    );

    title.textContent =
      "Search Results";

    count.textContent =
      "Search failed";

    grid.innerHTML = `

      <div class="error">

        <h2>
          Something went wrong
        </h2>

        <p style="margin-top:8px">
          Please refresh the page.
        </p>

      </div>

    `;

    return;

  }


  videos =
    data || [];


  /*
    Heading
  */

  if(searchName){

    title.textContent =
      `Results for "${searchName}"`;

  }else{

    title.textContent =
      "All Videos";

  }


  count.textContent =
    videos.length +
    (
      videos.length === 1
      ? " video found"
      : " videos found"
    );


  render();

}


/* =========================
   RENDER
========================= */

function render(){

  const grid =
    document.getElementById(
      "resultsGrid"
    );


  if(videos.length === 0){

    grid.innerHTML = `

      <div
        class="no-results">

        <h2>
          No videos found
        </h2>

        <p style="margin-top:8px">
          No video matches
          "${escapeHtml(searchName)}".
        </p>

      </div>

    `;

    document.getElementById(
      "pagination"
    ).innerHTML = "";

    return;

  }


  const totalPages =
    Math.ceil(
      videos.length /
      perPage
    );


  if(currentPage > totalPages){

    currentPage =
      totalPages;

  }


  const start =
    (currentPage - 1) *
    perPage;

  const end =
    start + perPage;


  const pageVideos =
    videos.slice(
      start,
      end
    );


  grid.innerHTML =
    pageVideos
      .map(video => {

        const title =
          escapeHtml(
            video.title ||
            "Untitled Video"
          );

        const category =
          escapeHtml(
            video.category ||
            "Uncategorized"
          );

        const views =
          formatViews(
            video.views
          );


        let thumbnail = `

          <div class="placeholder">

            <div class="play">
              ▶
            </div>

          </div>

        `;


        if(video.thumbnail_url){

          thumbnail = `

            <img
              src="${escapeHtml(video.thumbnail_url)}"
              alt="${title}"
              loading="lazy"
              onerror="this.style.display='none'"
            >

          `;

        }


        return `

          <a
            class="card"
            href="video.html?id=${encodeURIComponent(video.id)}">

            <div class="thumb">

              ${thumbnail}

            </div>

            <div class="info">

              <div class="title">
                ${title}
              </div>

              <div class="meta">

                👁 ${views}
                •
                ${category}

              </div>

            </div>

          </a>

        `;

      })
      .join("");


  renderPagination();

}


/* =========================
   PAGINATION
========================= */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const totalPages =
    Math.ceil(
      videos.length /
      perPage
    );


  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }


  let html = "";


  html += `

    <button
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}>

      Previous

    </button>

  `;


  let startPage =
    Math.max(
      1,
      currentPage - 2
    );


  let endPage =
    Math.min(
      totalPages,
      startPage + 4
    );


  if(
    endPage - startPage < 4
  ){

    startPage =
      Math.max(
        1,
        endPage - 4
      );

  }


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="${i === currentPage ? "active" : ""}"
        onclick="changePage(${i})">

        ${i}

      </button>

    `;

  }


  html += `

    <button
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? "disabled" : ""}>

      Next

    </button>

  `;


  pagination.innerHTML =
    html;

}


/* =========================
   CHANGE PAGE
========================= */

window.changePage =
function(page){

  const totalPages =
    Math.ceil(
      videos.length /
      perPage
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  const url =
    new URL(
      window.location.href
    );


  if(searchName){

    url.searchParams.set(
      "q",
      searchName
    );

  }


  url.searchParams.set(
    "page",
    currentPage
  );


  window.history.pushState(
    {},
    "",
    url
  );


  render();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================
   NEW SEARCH
========================= */

document.getElementById(
  "searchInput"
).addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Enter"
    ){

      return;

    }


    const value =
      this.value.trim();


    if(!value){

      window.location.href =
        "search.html";

      return;

    }


    window.location.href =
      "search.html?q=" +
      encodeURIComponent(value);

  }
);


/* =========================
   START
========================= */

loadSearchResults();

</script>

</body>
</html>
