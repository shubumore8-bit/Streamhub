<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search - DesiVexa</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:#090909;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:#0d0d0d;
      border-bottom:1px solid #222;
      padding:14px 12px;
    }

    .top{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      color:#ff1744;
      font-size:23px;
      font-weight:800;
      white-space:nowrap;
    }

    .searchBox{
      flex:1;
      display:flex;
      gap:7px;
    }

    .searchBox input{
      width:100%;
      background:#181818;
      border:1px solid #303030;
      color:#fff;
      border-radius:8px;
      padding:11px 12px;
      outline:none;
      font-size:14px;
    }

    .searchBox input:focus{
      border-color:#ff1744;
    }

    .searchBox button{
      background:#ff1744;
      color:#fff;
      border:0;
      border-radius:8px;
      padding:0 16px;
      font-weight:700;
      cursor:pointer;
    }

    main{
      max-width:1100px;
      margin:auto;
      padding:18px 12px 40px;
    }

    .heading{
      margin-bottom:18px;
    }

    .heading h1{
      font-size:22px;
      margin-bottom:6px;
    }

    .heading p{
      color:#999;
      font-size:13px;
    }

    .query{
      color:#ff1744;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    .card{
      background:#121212;
      border:1px solid #222;
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      transform:translateY(-2px);
      border-color:#ff1744;
    }

    .thumb{
      width:100%;
      aspect-ratio:16/9;
      background:#1b1b1b;
      overflow:hidden;
      position:relative;
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .play{
      position:absolute;
      left:10px;
      bottom:10px;
      width:36px;
      height:36px;
      border-radius:50%;
      background:rgba(255,23,68,.92);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    .info{
      padding:10px;
    }

    .title{
      font-size:14px;
      font-weight:700;
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .meta{
      margin-top:7px;
      color:#888;
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:5px;
    }

    .category{
      color:#ff1744;
    }

    .empty{
      text-align:center;
      padding:50px 15px;
      color:#999;
    }

    .empty strong{
      display:block;
      color:#fff;
      font-size:18px;
      margin-bottom:8px;
    }

    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:7px;
      margin-top:28px;
      flex-wrap:wrap;
    }

    .pagination button{
      min-width:40px;
      height:38px;
      padding:0 10px;
      border-radius:7px;
      border:1px solid #333;
      background:#151515;
      color:#fff;
      cursor:pointer;
      font-weight:700;
    }

    .pagination button:hover{
      border-color:#ff1744;
    }

    .pagination button.active{
      background:#ff1744;
      border-color:#ff1744;
    }

    .pagination button:disabled{
      opacity:.35;
      cursor:not-allowed;
    }

    @media(max-width:850px){
      .grid{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:600px){
      .top{
        flex-wrap:wrap;
      }

      .logo{
        width:100%;
      }

      .grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
      }

      main{
        padding:15px 9px 35px;
      }

      .heading h1{
        font-size:19px;
      }

      .title{
        font-size:13px;
      }

      .info{
        padding:8px;
      }
    }

    @media(max-width:360px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">
      DesiVexa
    </div>

    <form class="searchBox" id="searchForm">
      <input
        type="search"
        id="searchInput"
        placeholder="Search videos..."
        autocomplete="off"
      >

      <button type="submit">
        Search
      </button>
    </form>

  </div>
</header>

<main>

  <div class="heading">
    <h1 id="headingTitle">Search Results</h1>
    <p id="resultInfo">Loading videos...</p>
  </div>

  <div id="videoGrid" class="grid"></div>

  <div id="pagination" class="pagination"></div>

</main>

<script type="module">

  import { createClient }
    from "https://esm.sh/@supabase/supabase-js@2";

  import {
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  } from "./config.js";


  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  const params = new URLSearchParams(
    window.location.search
  );

  const searchQuery =
    (params.get("q") || "").trim();


  let currentPage =
    Math.max(
      1,
      parseInt(params.get("page") || "1",10)
    );


  const PER_PAGE = 20;

  let allVideos = [];
  let results = [];


  const grid =
    document.getElementById("videoGrid");

  const pagination =
    document.getElementById("pagination");

  const resultInfo =
    document.getElementById("resultInfo");

  const headingTitle =
    document.getElementById("headingTitle");

  const searchInput =
    document.getElementById("searchInput");


  searchInput.value = searchQuery;


  function normalize(value){

    return String(value || "")
      .toLowerCase()
      .trim();

  }


  function escapeHTML(value){

    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function formatViews(value){

    const views =
      Number(value || 0);

    if(views >= 1000000){
      return (
        (views / 1000000)
          .toFixed(1)
          .replace(".0","")
        + "M views"
      );
    }

    if(views >= 1000){
      return (
        (views / 1000)
          .toFixed(1)
          .replace(".0","")
        + "K views"
      );
    }

    return views + " views";

  }


  function formatDate(date){

    if(!date) return "";

    const d =
      new Date(date);

    if(Number.isNaN(d.getTime()))
      return "";

    return d.toLocaleDateString(
      "en-IN",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  }


  function videoCard(video){

    const id =
      encodeURIComponent(
        String(video.id)
      );

    const title =
      escapeHTML(video.title || "Untitled");

    const category =
      escapeHTML(
        video.category || "Videos"
      );

    const thumbnail =
      video.thumbnail_url
        ? `<img
            src="${escapeHTML(video.thumbnail_url)}"
            alt="${title}"
            loading="lazy"
            onerror="this.style.display='none'"
          >`
        : "";

    return `

      <article
        class="card"
        onclick="openVideo('${id}')"
      >

        <div class="thumb">

          ${thumbnail}

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <div class="title">
            ${title}
          </div>

          <div class="meta">

            <span class="category">
              ${category}
            </span>

            <span>
              ${formatViews(video.views)}
            </span>

          </div>

          <div class="meta">

            <span>
              ${formatDate(video.created_at)}
            </span>

          </div>

        </div>

      </article>

    `;

  }


  window.openVideo =
    function(id){

      window.location.href =
        "video.html?id=" + id;

    };


  function render(){

    const total =
      results.length;

    const totalPages =
      Math.ceil(total / PER_PAGE);


    if(total === 0){

      grid.innerHTML = `

        <div
          class="empty"
          style="grid-column:1/-1"
        >

          <strong>
            No videos found
          </strong>

          Try another name or keyword.

        </div>

      `;

      pagination.innerHTML = "";

      resultInfo.textContent =
        searchQuery
          ? `No videos found for "${searchQuery}"`
          : "No videos available";

      return;

    }


    if(currentPage > totalPages){

      currentPage = totalPages;

    }


    const start =
      (currentPage - 1) * PER_PAGE;

    const end =
      start + PER_PAGE;


    const pageVideos =
      results.slice(start,end);


    grid.innerHTML =
      pageVideos
        .map(videoCard)
        .join("");


    resultInfo.textContent =
      `${total} video${total === 1 ? "" : "s"} found`
      + (
        searchQuery
          ? ` for "${searchQuery}"`
          : ""
      );


    renderPagination(totalPages);

  }


  function renderPagination(totalPages){

    pagination.innerHTML = "";

    if(totalPages <= 1)
      return;


    const previous =
      document.createElement("button");

    previous.textContent =
      "Previous";

    previous.disabled =
      currentPage === 1;

    previous.onclick =
      () => goToPage(currentPage - 1);

    pagination.appendChild(previous);


    let startPage =
      Math.max(
        1,
        currentPage - 2
      );

    let endPage =
      Math.min(
        totalPages,
        startPage + 4
      );


    if(endPage - startPage < 4){

      startPage =
        Math.max(
          1,
          endPage - 4
        );

    }


    for(
      let page = startPage;
      page <= endPage;
      page++
    ){

      const button =
        document.createElement("button");

      button.textContent =
        page;

      if(page === currentPage){

        button.classList.add("active");

      }

      button.onclick =
        () => goToPage(page);

      pagination.appendChild(button);

    }


    const next =
      document.createElement("button");

    next.textContent =
      "Next";

    next.disabled =
      currentPage === totalPages;

    next.onclick =
      () => goToPage(currentPage + 1);

    pagination.appendChild(next);

  }


  function goToPage(page){

    const totalPages =
      Math.ceil(
        results.length / PER_PAGE
      );

    if(
      page < 1 ||
      page > totalPages
    ) return;


    const url =
      new URL(
        window.location.href
      );

    if(searchQuery){

      url.searchParams.set(
        "q",
        searchQuery
      );

    }

    url.searchParams.set(
      "page",
      page
    );


    window.location.href =
      url.toString();

  }


  document
    .getElementById("searchForm")
    .addEventListener(
      "submit",
      function(event){

        event.preventDefault();

        const value =
          searchInput.value.trim();

        if(!value){

          window.location.href =
            "search.html";

          return;

        }


        window.location.href =
          "search.html?q="
          + encodeURIComponent(value)
          + "&page=1";

      }
    );


  async function loadVideos(){

    grid.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1"
      >

        Loading videos...

      </div>

    `;


    const {
      data,
      error
    } = await supabase

      .from("videos")

      .select(`
        id,
        title,
        category,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)

      .eq("published", true)

      .order(
        "created_at",
        {
          ascending:false
        }
      )

      .limit(1000);


    if(error){

      console.error(
        "Search load error:",
        error
      );


      grid.innerHTML = `

        <div
          class="empty"
          style="grid-column:1/-1"
        >

          <strong>
            Videos load nahi ho rahe
          </strong>

          Please try again.

        </div>

      `;

      resultInfo.textContent =
        "Database error";

      return;

    }


    allVideos =
      data || [];


    const q =
      normalize(searchQuery);


    if(!q){

      results =
        allVideos;

      headingTitle.textContent =
        "All Videos";

    }else{

      results =
        allVideos.filter(
          video => {

            const title =
              normalize(
                video.title
              );

            const category =
              normalize(
                video.category
              );

            return (
              title.includes(q) ||
              category.includes(q)
            );

          }
        );


      headingTitle.textContent =
        "Search Results";

    }


    render();

  }


  loadVideos();

</script>

</body>
</html>
