
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>DesiVexa Admin Dashboard</title>

  <style>
    :root {
      --bg:#080808;
      --panel:#121212;
      --panel2:#1b1b1b;
      --red:#ed1735;
      --text:#f5f5f5;
      --muted:#aaa;
      --border:#303030;
      --green:#23c483;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    button,input,textarea,select { font:inherit; }

    button {
      border:0;
      border-radius:8px;
      background:var(--red);
      color:#fff;
      padding:11px 14px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled { opacity:.55; cursor:wait; }

    .secondary { background:#292929; }
    .danger { background:#b9162b; }
    .success { background:#126e4b; }

    header {
      position:sticky;
      top:0;
      z-index:5;
      background:#101010;
      border-bottom:1px solid var(--border);
      padding:15px;
    }

    .header-inner {
      max-width:1200px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand { font-size:21px; font-weight:900; }
    .brand span { color:var(--red); }

    main {
      max-width:1200px;
      margin:auto;
      padding:16px;
    }

    h1 { font-size:24px; margin:8px 0 18px; }
    h2 { font-size:19px; margin-top:0; }

    .panel {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:13px;
      padding:17px;
      margin-bottom:18px;
      min-width:0;
    }

    .login-wrap {
      max-width:450px;
      margin:50px auto;
    }

    .field { margin-bottom:14px; }

    label {
      display:block;
      margin-bottom:7px;
      font-size:13px;
      color:#ddd;
    }

    input,textarea,select {
      width:100%;
      background:#080808;
      color:white;
      border:1px solid #3a3a3a;
      border-radius:8px;
      padding:12px;
      outline:none;
    }

    input:focus,textarea:focus,select:focus {
      border-color:var(--red);
    }

    textarea { min-height:85px; resize:vertical; }

    .check-row {
      display:flex;
      align-items:center;
      gap:9px;
      margin:12px 0;
      font-size:13px;
    }

    .check-row input {
      width:auto;
      accent-color:var(--red);
    }

    .check-row label { margin:0; }

    .stats {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      margin-bottom:18px;
    }

    .stat {
      background:var(--panel);
      border:1px solid var(--border);
      padding:15px 12px;
      border-radius:12px;
      min-width:0;
    }

    .stat small { display:block; color:var(--muted); margin-bottom:8px; }
    .stat strong { font-size:23px; overflow-wrap:anywhere; }

    .toolbar {
      display:grid;
      grid-template-columns:minmax(0,1fr) 180px;
      gap:10px;
      margin-bottom:14px;
    }

    .video-list {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .video-card {
      background:#171717;
      border:1px solid var(--border);
      border-radius:11px;
      overflow:hidden;
      min-width:0;
    }

    .thumb {
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      background:#252525;
      display:block;
    }

    .card-body { padding:12px; }
    .video-title { font-weight:700; overflow-wrap:anywhere; }
    .meta { font-size:12px; color:var(--muted); margin:8px 0; }
    .card-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .card-actions button { font-size:12px; padding:9px 10px; }

    .status {
      display:none;
      padding:12px;
      border-radius:8px;
      margin:12px 0;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      font-size:13px;
    }

    .status.ok { display:block; background:#123c2c; color:#a6f5ce; }
    .status.error { display:block; background:#4a1720; color:#ffd0d7; }
    .status.info { display:block; background:#202d42; color:#cde1ff; }

    .pagination {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      align-items:center;
      justify-content:center;
      margin-top:18px;
    }

    .pagination button.active { outline:2px solid white; }
    .muted { color:var(--muted); font-size:13px; }
    .empty { text-align:center; padding:30px 12px; color:var(--muted); }

    .modal {
      position:fixed;
      inset:0;
      z-index:20;
      background:rgba(0,0,0,.88);
      padding:14px;
      overflow:auto;
      display:none;
      align-items:center;
      justify-content:center;
    }

    .modal-box {
      width:min(760px,100%);
      max-height:95vh;
      overflow:auto;
      background:#121212;
      border:1px solid #383838;
      border-radius:13px;
      padding:16px;
    }

    .modal-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .modal video {
      display:block;
      width:100%;
      max-height:65vh;
      background:#000;
      border-radius:9px;
    }

    .modal img {
      max-width:100%;
      max-height:60vh;
      display:block;
      margin:auto;
    }

    [hidden] { display:none !important; }

    @media(max-width:760px) {
      main { padding:12px; }
      .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .video-list { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
      .toolbar { grid-template-columns:1fr; }
      .stat strong { font-size:21px; }
      .panel { padding:13px; }
      .card-body { padding:9px; }
      .card-actions button { flex:1; }
      .brand { font-size:18px; }
    }

    @media(max-width:380px) {
      .video-list { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">Desi<span>Vexa</span> Admin</div>
      <button id="logoutBtn" class="secondary" hidden>Logout</button>
    </div>
  </header>

  <main>
    <section id="auth" class="login-wrap panel">
      <h1>Admin Login</h1>
      <p class="muted">Apne authorized admin account se login karein.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>

        <button id="loginBtn" type="submit" style="width:100%">Login</button>
      </form>

      <div id="loginStatus" class="status"></div>
    </section>

    <section id="panel" hidden>
      <h1>Dashboard</h1>

      <div class="stats">
        <div class="stat"><small>Total videos</small><strong id="statTotal">0</strong></div>
        <div class="stat"><small>Published</small><strong id="statPublished">0</strong></div>
        <div class="stat"><small>Hidden / Pending</small><strong id="statHidden">0</strong></div>
        <div class="stat"><small>Total views</small><strong id="statViews">0</strong></div>
      </div>

      <section class="panel">
        <h2>Upload New Video</h2>

        <form id="upload">
          <div class="field">
            <label for="uploadTitle">Video title</label>
            <input id="uploadTitle" name="title" maxlength="250" required>
          </div>

          <div class="field">
            <label for="uploadCategory">Category</label>
            <input id="uploadCategory" name="category" placeholder="Example: Trending" required>
          </div>

          <div class="field">
            <label for="uploadDescription">Description</label>
            <textarea id="uploadDescription" name="description"></textarea>
          </div>

          <div class="field">
            <label for="uploadThumb">Thumbnail image</label>
            <input id="uploadThumb" name="thumb" type="file" accept="image/*" required>
          </div>

          <div class="field">
            <label for="uploadVideo">Video file</label>
            <input id="uploadVideo" name="video" type="file" accept="video/*" required>
          </div>

          <div class="check-row">
            <input id="uploadPublished" type="checkbox" checked>
            <label for="uploadPublished">Publish immediately</label>
          </div>

          <div class="check-row">
            <input id="rightsConfirm" type="checkbox" required>
            <label for="rightsConfirm">I have the rights or permission to upload this content.</label>
          </div>

          <button id="uploadBtn" type="submit">Upload Video</button>
        </form>

        <div id="uploadStatus" class="status"></div>
      </section>

      <section class="panel" id="manage">
        <h2>Manage Videos</h2>

        <div class="toolbar">
          <input id="adminSearch" type="search" placeholder="Search title or category...">
          <select id="adminFilter">
            <option value="all">All videos</option>
            <option value="published">Published</option>
            <option value="hidden">Hidden / Pending</option>
          </select>
        </div>

        <div id="globalStatus" class="status"></div>
        <div id="videoList" class="video-list"></div>
        <div id="pagination" class="pagination"></div>
      </section>
    </section>
  </main>

  <div id="previewModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-top">
        <h2 id="previewTitle">Video Preview</h2>
        <button id="closePreview" class="secondary" type="button">Close</button>
      </div>
      <video id="previewVideo" controls playsinline preload="metadata"></video>
      <p id="previewInfo" class="muted">Video loading...</p>
    </div>
  </div>

  <div id="editModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-top">
        <h2>Edit Video</h2>
        <button id="closeEdit" class="secondary" type="button">Close</button>
      </div>

      <form id="editForm">
        <input id="editId" type="hidden">

        <div class="field">
          <label for="editTitle">Title</label>
          <input id="editTitle" maxlength="250" required>
        </div>

        <div class="field">
          <label for="editCategory">Category</label>
          <input id="editCategory" required>
        </div>

        <div class="field">
          <label for="editDescription">Description</label>
          <textarea id="editDescription"></textarea>
        </div>

        <button id="saveEditBtn" type="submit">Save Changes</button>
      </form>

      <div id="editStatus" class="status"></div>
    </div>
  </div>

  <script type="module" src="admin.js?v=7"></script>
</body>
</html>
