
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Admin Dashboard — DesiVexa</title>
  <link rel="stylesheet" href="style.css">
  <style>
    [hidden]{display:none!important}
    .adminAccount{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0}
    .adminStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .adminStat{min-width:0}
    .adminTools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .adminTools input,.adminTools select{flex:1;min-width:130px}
    .manage{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid #292929}
    .manageThumb{width:100%;aspect-ratio:16/10;background:#191919;border-radius:9px;overflow:hidden}
    .manageThumb img{width:100%;height:100%;object-fit:cover}
    .adminThumbEmpty{height:100%;display:grid;place-items:center;color:#f33;font-size:30px}
    .manageInfo{display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
    .manageInfo span,.manageInfo small{color:#aaa;font-size:13px}
    .manageInfo .published{color:#4ade80}
    .manageInfo .hidden{color:#fbbf24}
    .manageActions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
    .manageActions button{min-height:38px}
    .adminStatus{overflow-wrap:anywhere}
    .adminPreviewBackdrop{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.94);padding:14px;display:flex;align-items:center;justify-content:center}
    .adminPreviewBox{width:100%;max-width:900px;max-height:95vh;overflow:auto;background:#151515;border:1px solid #333;border-radius:14px;padding:14px;color:#fff}
    .adminPreviewTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .adminPreviewPlayer{display:block;width:100%;max-height:72vh;background:#000;border-radius:8px}
    .adminPreviewNote{font-size:13px;color:#bbb;overflow-wrap:anywhere}
    .adminDanger{background:#a71919!important;color:#fff!important}
    @media(max-width:600px){
      .adminStats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .manage{grid-template-columns:100px minmax(0,1fr);gap:10px}
      .manageActions button{flex:1 1 42%}
      .adminPreviewBox{padding:10px}
    }
  </style>
</head>
<body>
<header>
  <div class="headerInner">
    <a href="index.html" class="logo">Desi<span>Vexa</span></a>
    <nav><a href="index.html">View Site</a></nav>
  </div>
</header>

<main class="wrap admin">
  <div id="auth"></div>

  <div id="panel" hidden>
    <div class="adminTop">
      <div>
        <span class="sectionLabel">DESIVEXA</span>
        <h1>Admin Dashboard</h1>
        <p class="muted">Review, preview and manage uploaded videos.</p>
      </div>
    </div>

    <div class="adminStats">
      <div class="adminStat"><span>Total Videos</span><strong id="statTotal">0</strong></div>
      <div class="adminStat"><span>Published</span><strong id="statPublished">0</strong></div>
      <div class="adminStat"><span>Pending / Hidden</span><strong id="statHidden">0</strong></div>
      <div class="adminStat"><span>Total Views</span><strong id="statViews">0</strong></div>
    </div>

    <section class="adminBox">
      <div class="adminBoxHead">
        <div>
          <span class="sectionLabel">CONTENT</span>
          <h2>Upload New Video</h2>
        </div>
      </div>

      <form id="upload" class="adminForm">
        <div class="adminFormGrid">
          <label>Title
            <input name="title" type="text" placeholder="Video title" maxlength="200" required>
          </label>
          <label>Category
            <input name="category" type="text" placeholder="Category" maxlength="100" required>
          </label>
        </div>

        <label>Description
          <textarea name="description" rows="4" placeholder="Video description..."></textarea>
        </label>

        <div class="adminFormGrid">
          <label>Thumbnail (optional)
            <input name="thumb" type="file" accept="image/*">
          </label>
          <label>Video file
            <input name="video" type="file" accept="video/*" required>
          </label>
        </div>

        <label class="check">
          <input name="confirm" type="checkbox" required>
          <span>I confirm I have the legal rights and required consent for this content.</span>
        </label>

        <button class="btn" id="uploadBtn" type="submit">Upload for Approval</button>
        <div id="status" class="adminStatus" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="adminBox">
      <div class="adminBoxHead">
        <div>
          <span class="sectionLabel">LIBRARY</span>
          <h2>Manage Videos</h2>
        </div>
        <button id="refreshVideos" class="btn ghost" type="button">Refresh</button>
      </div>

      <div class="adminTools">
        <input id="adminSearch" type="search" placeholder="Search title, category or description..." autocomplete="off">
        <select id="adminFilter" aria-label="Filter videos">
          <option value="all">All videos</option>
          <option value="pending">Pending approval</option>
          <option value="published">Published</option>
          <option value="hidden">Hidden / unpublished</option>
        </select>
      </div>

      <div id="manage" aria-live="polite"></div>
    </section>
  </div>
</main>

<div id="videoPreviewModal" class="adminPreviewBackdrop" hidden>
  <div class="adminPreviewBox" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="adminPreviewTop">
      <strong id="previewTitle">Video Preview</strong>
      <button id="closeVideoPreview" class="btn adminDanger" type="button">✕ Close</button>
    </div>
    <video id="previewPlayer" class="adminPreviewPlayer" controls playsinline preload="metadata"></video>
    <p id="previewInfo" class="adminPreviewNote"></p>
    <p id="previewError" class="adminPreviewNote" role="status"></p>
  </div>
</div>

<script type="module" src="admin.js?v=3"></script>
</body>
</html>
