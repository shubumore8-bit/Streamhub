
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account - DesiVexa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:22px}
.card{max-width:420px;margin:55px auto;background:#1b1b1b;padding:24px;border-radius:14px}
h1{color:#ff3030;text-align:center}
p{text-align:center;color:#bbb}
input,button{width:100%;padding:14px;margin-top:13px;border-radius:8px;font-size:16px}
input{background:#292929;border:1px solid #444;color:#fff}
button{background:#e50914;color:white;border:0;font-weight:bold}
a{color:#ff4545}
#msg{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>DesiVexa</h1>
<p>Create your account</p>
<form id="signupForm">
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
<button type="submit">Create Account</button>
</form>
<p id="msg"></p>
<p>Already registered? <a href="login.html">Login</a></p>
<a href="index.html">← Back to Home</a>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById('signupForm');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = 'Creating account...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: window.location.origin + '/login.html'
    }
  });

  if (error) {
    msg.textContent = error.message;
    return;
  }

  if (data.session) {
    msg.textContent = 'Account created! You can now login.';
    setTimeout(() => location.href = 'login.html', 1200);
  } else {
    msg.textContent = 'Account request successful. Check your email to confirm, then login.';
  }
});
</script>
</body>
</html>
