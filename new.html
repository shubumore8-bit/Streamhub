<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest Videos - DesiVexa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  min-height:100vh;
  background:#080808;
}

header{
  height:65px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b0b0b;
  border-bottom:1px solid #242424;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  color:#fff;
  font-size:24px;
  font-weight:900;
  text-decoration:none;
}

.logo span{
  color:#ff1744;
}

.back,
.profile{
  color:#fff;
  text-decoration:none;
  font-size:24px;
}

.section{
  padding:0 12px;
  margin:22px 0;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title h1{
  font-size:21px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.video-card{
  text-decoration:none;
  color:#fff;
  min-width:0;
  overflow:hidden;
}

.thumbnail{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:8px;
  background:#171717;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.duration{
  position:absolute;
  z-index:3;
  right:4px;
  bottom:4px;
  background:#000;
  padding:3px 5px;
  font-size:9px;
  border-radius:3px;
}

.video-title{
  margin:6px 2px 4px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tag{
  display:inline-block;
  background:#ff1744;
  padding:3px 7px;
  border-radius:8px;
  font-size:8px;
}

.info{
  color:#888;
  font-size:9px;
  line-height:15px;
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  padding:30px 10px;
  text-align:center;
  color:#888;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  padding:20px 12px 30px;
}

.page{
  min-width:38px;
  height:36px;
  border:1px solid #303030;
  background:#151515;
  color:#fff;
  border-radius:7px;
  cursor:pointer;
}

.page.active{
  background:#ff1744;
  border-color:#ff1744;
}

.page:disabled{
  opacity:.4;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(10,10,10,.98);
  border-top:1px solid #292929;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:100;
}

.nav{
  color:#777;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
}

.nav-icon{
  font-size:20px;
}

.nav.active{
  color:#ff1744;
}

@media(max-width:500px){

  .video-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }

  .video-title{
    font-size:9px;
  }

  .info{
    font-size:8px;
  }

  .tag{
    font-size:7px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

<a href="index.html" class="back">‹</a>

<a href="index.html" class="logo">
Desi<span>Vexa</span>
</a>

<a href="profile.html" class="profile">
👤
</a>

</header>


<section class="section">

<div class="title">
<h1>⭐ Latest Videos</h1>
</div>

<div
id="newVideos"
class="video-grid">

<div class="loading">
Loading latest videos...
</div>

</div>

</section>


<div
id="pagination"
class="pagination">
</div>


<nav class="bottom-nav">

<a href="index.html" class="nav">

<div class="nav-icon">⌂</div>

Home

</a>


<a href="new.html" class="nav active">

<div class="nav-icon">◷</div>

Latest

</a>


<a href="trending.html" class="nav">

<div class="nav-icon">🔥</div>

Trending

</a>


<a href="recommended.html" class="nav">

<div class="nav-icon">★</div>

Recommended

</a>


<a href="profile.html" class="nav">

<div class="nav-icon">♙</div>

Profile

</a>

</nav>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
  IMPORTANT:
  YAHAN WAHI SUPABASE URL + ANON KEY
  USE KARO JO TUMHARE app.js ME HAI.
*/

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const container =
  document.getElementById("newVideos");

const pagination =
  document.getElementById("pagination");


let currentPage = 1;

const perPage = 30;


/* LOAD LATEST VIDEOS */

async function loadLatest(){

  container.innerHTML =
    `<div class="loading">
       Loading latest videos...
     </div>`;


  const from =
    (currentPage - 1) * perPage;

  const to =
    from + perPage - 1;


  const {
    data,
    error,
    count
  } = await supabase

    .from("videos")

    .select("*", {
      count:"exact"
    })

    .order(
      "created_at",
      {
        ascending:false
      }
    )

    .range(from,to);


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="error">
        Could not load videos.<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        No videos found.
      </div>`;

    pagination.innerHTML = "";

    return;
  }


  container.innerHTML =
    data.map(video => {

      const id =
        encodeURIComponent(video.id);

      const title =
        escapeHtml(
          video.title ||
          "Untitled Video"
        );

      const category =
        escapeHtml(
          video.category ||
          "Video"
        );

      const thumbnail =
        video.thumbnail_url ||
        video.thumbnail ||
        "";


      return `

<a
  href="video.html?id=${id}"
  class="video-card"
>

<div class="thumbnail">

${
thumbnail
?
`<img
src="${escapeAttr(thumbnail)}"
alt="${title}"
loading="lazy"
>`
:
""
}

<div class="play">
▶
</div>

${
video.duration
?
`<div class="duration">
${escapeHtml(video.duration)}
</div>`
:
""
}

</div>


<div class="video-title">
${title}
</div>


<span class="tag">
${category}
</span>


<div class="info">

${
video.views != null
?
`👁 ${formatViews(video.views)} views`
:
""
}

<br>

◷ Recently Added

</div>

</a>

`;

    }).join("");


  renderPagination(count || data.length);

}


/* PAGINATION */

function renderPagination(total){

  const pages =
    Math.max(
      1,
      Math.ceil(
        total / perPage
      )
    );


  pagination.innerHTML = "";


  if(currentPage > 1){

    const previous =
      createPageButton(
        "‹",
        currentPage - 1
      );

    pagination.appendChild(
      previous
    );

  }


  const maxPages =
    Math.min(
      pages,
      10
    );


  for(
    let i = 1;
    i <= maxPages;
    i++
  ){

    const button =
      createPageButton(
        i,
        i
      );

    pagination.appendChild(
      button
    );

  }


  if(currentPage < pages){

    const next =
      createPageButton(
        "›",
        currentPage + 1
      );

    pagination.appendChild(
      next
    );

  }

}


function createPageButton(
  text,
  page
){

  const button =
    document.createElement(
      "button"
    );

  button.className =
    "page";

  button.textContent =
    text;

  if(page === currentPage){

    button.classList.add(
      "active"
    );

  }


  button.onclick = () => {

    currentPage = page;

    loadLatest();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


  return button;

}


/* HELPERS */

function formatViews(value){

  const number =
    Number(value) || 0;

  if(number >= 1000000){

    return (
      number / 1000000
    ).toFixed(1) + "M";

  }

  if(number >= 1000){

    return (
      number / 1000
    ).toFixed(1) + "K";

  }

  return String(number);

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


loadLatest();

</script>

</body>
</html>
