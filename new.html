<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Videos - DesiVexa</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#02070d;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    max-width:700px;
    min-height:100vh;
    margin:auto;
    background:#06111a;
    padding-bottom:90px;
}

header{
    height:78px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#020a11;
    border-bottom:1px solid #263540;
}

.logo{
    color:#fff;
    font-size:25px;
    font-weight:800;
    text-decoration:none;
}

.logo span{color:#ff1744}

.back,
.profile{
    color:#fff;
    text-decoration:none;
    font-size:24px;
}

.ad{
    margin:8px 18px 13px;
    height:58px;
    border:2px solid #ff1744;
    border-radius:8px;
    background:#280914;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.section{
    padding:0 18px;
    margin:20px 0;
}

.title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.title h1{
    font-size:21px;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.video-card{
    text-decoration:none;
    color:#fff;
    min-width:0;
}

.thumbnail{
    position:relative;
    aspect-ratio:16/9;
    border-radius:5px;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #675451,
        #202a32,
        #754f59
    );
}

.thumbnail:after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(180,150,150,.18);
    backdrop-filter:blur(7px);
}

.play{
    position:absolute;
    z-index:2;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
}

.duration{
    position:absolute;
    z-index:3;
    right:4px;
    bottom:4px;
    background:#000;
    padding:3px 5px;
    font-size:9px;
    border-radius:3px;
}

.video-title{
    margin:5px 2px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tag{
    display:inline-block;
    background:#ff1744;
    padding:3px 7px;
    border-radius:8px;
    font-size:9px;
}

.info{
    color:#ccd2d6;
    font-size:9px;
    line-height:16px;
}

.random{
    margin-top:30px;
}

.random-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.random-grid .video-title{
    font-weight:normal;
    font-size:10px;
}

.pagination{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    padding:10px 18px 25px;
}

.page{
    min-width:38px;
    height:36px;
    border:1px solid #29404f;
    background:#0b1b27;
    color:#fff;
    border-radius:7px;
    cursor:pointer;
}

.page.active{
    background:#ff1744;
    border-color:#ff1744;
}

.page:disabled{
    opacity:.4;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    height:75px;
    background:#020910;
    border-top:1px solid #26343e;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.nav{
    color:#fff;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
}

.nav-icon{
    font-size:22px;
}

.nav.active{
    color:#ff1744;
}

@media(max-width:500px){

    .video-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .random-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .section{
        padding:0 12px;
    }
}

@media(max-width:390px){

    .random-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(min-width:701px){

    body{
        padding:20px 0;
    }

    .app{
        border:1px solid #233541;
        border-radius:25px;
        overflow:hidden;
    }

    .bottom-nav{
        bottom:20px;
        border-radius:0 0 25px 25px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <a href="index.html" class="back">‹</a>

    <a href="index.html" class="logo">
        Desi<span>Vexa</span>
    </a>

    <a href="profile.html" class="profile">
        👤
    </a>

</header>

<div class="ad">
    Top Banner Ad
</div>


<section class="section">

    <div class="title">
        <h1>⭐ New Videos</h1>
    </div>

    <div
        class="video-grid"
        id="newVideos">
    </div>

</section>


<section class="section random">

    <div class="title">
        <h1>🎲 Random Videos</h1>
    </div>

    <div
        class="random-grid"
        id="randomVideos">
    </div>

</section>


<div
    class="pagination"
    id="pagination">
</div>


<nav class="bottom-nav">

    <a href="index.html" class="nav">
        <div class="nav-icon">⌂</div>
        Home
    </a>

    <a href="new.html" class="nav active">
        <div class="nav-icon">◷</div>
        Latest
    </a>

    <a href="trending.html" class="nav">
        <div class="nav-icon">♨</div>
        Trending
    </a>

    <a href="recommended.html" class="nav">
        <div class="nav-icon">▦</div>
        Recommended
    </a>

    <a href="profile.html" class="nav">
        <div class="nav-icon">♙</div>
        Profile
    </a>

</nav>

</div>


<script>

const newVideos = [

    ["New Video 1","Desi","09:12","45K"],
    ["New Video 2","Bhabhi","14:37","67K"],
    ["New Video 3","Indian","07:45","32K"],
    ["New Video 4","Mature","12:08","89K"],
    ["New Video 5","Desi","10:25","55K"],
    ["New Video 6","Indian","08:33","61K"],
    ["New Video 7","Bhabhi","13:12","74K"],
    ["New Video 8","Mature","06:50","39K"],
    ["New Video 9","Indian","11:20","52K"],
    ["New Video 10","Desi","08:44","48K"],
    ["New Video 11","Bhabhi","10:15","63K"],
    ["New Video 12","Mature","12:40","81K"]

];


document.getElementById("newVideos").innerHTML =

    newVideos.map((video,index)=>`

        <a
            href="video.html?id=${index+100}"
            class="video-card"
        >

            <div class="thumbnail">

                <div class="play">▶</div>

                <div class="duration">
                    ${video[2]}
                </div>

            </div>

            <div class="video-title">
                ${video[0]}
            </div>

            <span class="tag">
                ${video[1]}
            </span>

            <div class="info">
                👁 ${video[3]} views<br>
                ◷ Recently Added
            </div>

        </a>

    `).join("");


/* RANDOM VIDEOS */

const randomVideos=[];

for(let i=1;i<=150;i++){

    randomVideos.push({

        id:i+700,

        title:"Random Video "+i,

        duration:
            String(
                Math.floor(Math.random()*15)+1
            ).padStart(2,"0")
            +
            ":"
            +
            String(
                Math.floor(Math.random()*60)
            ).padStart(2,"0")

    });

}


let currentPage=1;

const perPage=30;


function renderRandom(){

    const start =
        (currentPage-1)*perPage;

    const videos =
        randomVideos.slice(
            start,
            start+perPage
        );


    document.getElementById(
        "randomVideos"
    ).innerHTML =

        videos.map(video=>`

            <a
                href="video.html?id=${video.id}"
                class="video-card"
            >

                <div class="thumbnail">

                    <div class="play">
                        ▶
                    </div>

                    <div class="duration">
                        ${video.duration}
                    </div>

                </div>

                <div class="video-title">
                    ${video.title}
                </div>

            </a>

        `).join("");


    renderPagination();
}


function renderPagination(){

    const box =
        document.getElementById(
            "pagination"
        );

    box.innerHTML="";


    const previous =
        document.createElement("button");

    previous.className="page";

    previous.innerText="‹ Previous";

    previous.disabled =
        currentPage===1;

    previous.onclick=()=>{

        if(currentPage>1){

            currentPage--;

            renderRandom();

            scrollRandom();

        }

    };

    box.appendChild(previous);


    for(let i=1;i<=5;i++){

        const button =
            document.createElement("button");

        button.className="page";

        button.innerText=i;

        if(i===currentPage){

            button.classList.add(
                "active"
            );

        }

        button.onclick=()=>{

            currentPage=i;

            renderRandom();

            scrollRandom();

        };

        box.appendChild(button);

    }


    const next =
        document.createElement("button");

    next.className="page";

    next.innerText="Next ›";

    next.disabled =
        currentPage===5;

    next.onclick=()=>{

        if(currentPage<5){

            currentPage++;

            renderRandom();

            scrollRandom();

        }

    };

    box.appendChild(next);
}


function scrollRandom(){

    document
        .getElementById("randomVideos")
        .scrollIntoView({
            behavior:"smooth"
        });

}


renderRandom();

</script>

</body>
</html>
