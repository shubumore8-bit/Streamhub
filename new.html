<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DesiVexa — Latest</title>

  <link rel="stylesheet" href="style.css?v=41">
</head>

<body>

<main class="dvMain">

  <div style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
  ">
    <h1 style="
      color:white;
      font-size:22px;
      margin:0;
    ">
      Latest Videos
    </h1>

    <a
      href="index.html"
      style="
        color:white;
        background:#e00000;
        padding:8px 12px;
        border-radius:7px;
        text-decoration:none;
        font-size:13px;
      "
    >
      Home
    </a>
  </div>

  <div id="latestVideos" style="
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  ">
    <p style="color:#888;">
      Loading latest videos...
    </p>
  </div>

</main>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
} from "./config.js";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const box =
  document.getElementById("latestVideos");

loadLatest();

async function loadLatest() {

  const result = await supabase
    .from("videos")
    .select(`
      id,
      title,
      category,
      thumbnail_url,
      views,
      created_at
    `)
    .eq("published", true)
    .order("created_at", {
      ascending:false
    })
    .limit(100);

  if (result.error) {

    console.error(result.error);

    box.innerHTML = `
      <p style="color:#888;">
        Unable to load latest videos.
      </p>
    `;

    return;
  }

  const videos = result.data || [];

  if (!videos.length) {

    box.innerHTML = `
      <p style="color:#888;">
        No latest videos available.
      </p>
    `;

    return;
  }

  box.innerHTML = videos.map(video => {

    const id =
      encodeURIComponent(video.id);

    return `
      <a
        href="video.html?id=${id}"
        style="
          display:block;
          color:white;
          text-decoration:none;
          min-width:0;
        "
      >

        ${
          video.thumbnail_url
            ? `
              <img
                src="${escapeHTML(video.thumbnail_url)}"
                loading="lazy"
                alt=""
                style="
                  width:100%;
                  aspect-ratio:16/9;
                  object-fit:cover;
                  display:block;
                  border-radius:8px;
                  background:#171717;
                "
              >
            `
            : `
              <div style="
                width:100%;
                aspect-ratio:16/9;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#171717;
                border-radius:8px;
                font-size:28px;
              ">
                ▶
              </div>
            `
        }

        <div style="
          margin-top:6px;
          font-size:14px;
          font-weight:600;
          line-height:1.3;
        ">
          ${escapeHTML(video.title || "Untitled")}
        </div>

        <div style="
          color:#999;
          font-size:11px;
          margin-top:4px;
        ">
          ${escapeHTML(video.category || "Video")}
          ·
          ${Number(video.views || 0)} views
        </div>

      </a>
    `;

  }).join("");
}

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
