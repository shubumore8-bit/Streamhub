  <title>Trending Videos - DesiVexa</title>  <link rel="stylesheet" href="style.css?v=31">  <style>

    body {
      background: #0b0b0b;
      color: #fff;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .page-wrap {
      max-width: 1200px;
      margin: auto;
      padding: 18px 12px 90px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      margin: 15px 0 6px;
    }

    .section-subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .video-card {
      display: block;
      color: white;
      text-decoration: none;
      background: #151515;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .video-info {
      padding: 8px;
    }

    .video-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .video-meta {
      color: #888;
      font-size: 11px;
      margin-top: 5px;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #999;
    }

    .error {
      color: #ff5555;
    }

    .section {
      margin-bottom: 35px;
    }

    @media (max-width: 600px) {

      .video-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .video-info {
        padding: 6px;
      }

      .video-title {
        font-size: 11px;
      }

      .video-meta {
        font-size: 9px;
      }

    }

  </style></head><body>  <main class="page-wrap"><section class="section">

  <h1 class="section-title">
    🔥 Trending Videos
  </h1>

  <div class="section-subtitle">
    Most viewed videos
  </div>

  <div
    id="trendingVideos"
    class="video-grid"
  >

    <div class="loading">
      Loading trending videos...
    </div>

  </div>

</section>


<section class="section">

  <h2 class="section-title">
    ✨ More Videos
  </h2>

  <div class="section-subtitle">
    Discover more videos
  </div>

  <div
    id="randomVideos"
    class="video-grid"
  >

    <div class="loading">
      Loading more videos...
    </div>

  </div>

</section>

  </main>  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    } from "./config.js";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatViews(views) {

      const number =
        Number(views || 0);

      if (number >= 1000000) {

        return (
          number / 1000000
        ).toFixed(1) + "M views";

      }

      if (number >= 1000) {

        return (
          number / 1000
        ).toFixed(1) + "K views";

      }

      return number + " views";

    }


    function card(video) {

      const id =
        encodeURIComponent(video.id);

      const title =
        escapeHTML(
          video.title || "Untitled Video"
        );

      const category =
        escapeHTML(
          video.category || "Video"
        );

      const thumbnail =
        video.thumbnail_url ||
        "https://via.placeholder.com/640x360?text=DesiVexa";


      return `

        <a
          class="video-card"
          href="video.html?id=${id}"
        >

          <img
            class="thumb"
            src="${escapeHTML(thumbnail)}"
            alt="${title}"
            loading="lazy"
            onerror="this.src='https://via.placeholder.com/640x360?text=DesiVexa'"
          >

          <div class="video-info">

            <div class="video-title">
              ${title}
            </div>

            <div class="video-meta">
              ${category} · ${formatViews(video.views)}
            </div>

          </div>

        </a>

      `;

    }


    async function loadTrending() {

      const container =
        document.getElementById(
          "trendingVideos"
        );


      const {
        data,
        error
      } = await supabase

        .from("videos")

        .select(
          "id,title,category,thumbnail_url,video_url,views,created_at"
        )

        .eq("published", true)

        .order("views", {
          ascending: false
        })

        .limit(30);


      if (error) {

        console.error(error);

        container.innerHTML = `
          <div class="error">
            Could not load trending videos.
          </div>
        `;

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty">
            No trending videos yet.
          </div>
        `;

        return;
      }


      container.innerHTML =
        data.map(card).join("");

    }


    async function loadRandom() {

      const container =
        document.getElementById(
          "randomVideos"
        );


      const {
        data,
        error
      } = await supabase

        .from("videos")

        .select(
          "id,title,category,thumbnail_url,video_url,views,created_at"
        )

        .eq("published", true)

        .order("created_at", {
          ascending: false
        })

        .limit(150);


      if (error) {

        console.error(error);

        container.innerHTML = `
          <div class="error">
            Could not load more videos.
          </div>
        `;

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty">
            No more videos available.
          </div>
        `;

        return;
      }


      const shuffled =
        [...data].sort(
          () => Math.random() - 0.5
        );


      container.innerHTML =
        shuffled.map(card).join("");

    }


    loadTrending();

    loadRandom();

  </script></body></html>
