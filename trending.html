<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesiVexa — Trending</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#05070d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:60px;
  background:#0b0f18;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #1c2230;
}

.logo{
  color:#ff1744;
  font-size:25px;
  font-weight:900;
}

.homeBtn{
  position:absolute;
  left:12px;
  text-decoration:none;
  color:#fff;
  background:#151b27;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:18px 12px 40px;
}

h1{
  font-size:22px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:#0c111b;
  border:1px solid #1a2130;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#ff1744;
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  background:#151b27;
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(255,23,68,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  padding-left:3px;
}

.hd{
  position:absolute;
  right:7px;
  top:7px;
  background:#ff1744;
  padding:4px 6px;
  border-radius:5px;
  font-size:10px;
  font-weight:bold;
}

.info{
  padding:10px;
}

.title{
  font-size:14px;
  font-weight:bold;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.meta{
  margin-top:7px;
  color:#9299a8;
  font-size:11px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.category{
  color:#ff1744;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:25px;
  flex-wrap:wrap;
}

.pagination button{
  border:0;
  background:#151b27;
  color:#fff;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}

.pagination button.active{
  background:#ff1744;
}

.pagination button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.message{
  text-align:center;
  color:#8e96a5;
  padding:40px 10px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .container{
    padding:15px 8px 30px;
  }

  h1{
    font-size:19px;
  }

  .title{
    font-size:12px;
  }

  .meta{
    font-size:10px;
  }

  .info{
    padding:8px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="homeBtn">← Home</a>
  <div class="logo">DesiVexa</div>
</header>

<div class="container">

  <h1>🔥 Trending Videos</h1>

  <div id="videos" class="grid"></div>

  <div id="message" class="message">
    Loading trending videos...
  </div>

  <div id="pagination" class="pagination"></div>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

import {
  SUPABASE_URL,
  SUPABASE_ANON_KEY
}
from "./config.js";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const PER_PAGE = 20;

let currentPage =
  parseInt(new URLSearchParams(location.search).get("page")) || 1;

if(currentPage < 1){
  currentPage = 1;
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function fallbackImage(){

  return "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="640"
         height="360">
      <rect width="640"
            height="360"
            fill="#151b27"/>
      <text x="320"
            y="185"
            text-anchor="middle"
            fill="#ff1744"
            font-size="38"
            font-family="Arial"
            font-weight="bold">
        DesiVexa
      </text>
    </svg>
  `);
}

function timeAgo(date){

  if(!date) return "";

  const seconds =
    Math.floor(
      (Date.now() -
      new Date(date).getTime()) / 1000
    );

  if(seconds < 60) return seconds + "s ago";

  const minutes =
    Math.floor(seconds / 60);

  if(minutes < 60) return minutes + "m ago";

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24) return hours + "h ago";

  const days =
    Math.floor(hours / 24);

  if(days < 30) return days + "d ago";

  return Math.floor(days / 30) + "mo ago";
}

function videoCard(video){

  const title =
    escapeHtml(video.title || "Untitled");

  const category =
    escapeHtml(video.category || "General");

  const thumbnail =
    video.thumbnail_url || fallbackImage();

  const views =
    Number(video.views || 0).toLocaleString();

  return `
    <div class="card"
         onclick="openVideo('${encodeURIComponent(video.id)}')">

      <div class="thumb">

        <img
          src="${escapeHtml(thumbnail)}"
          alt="${title}"
          onerror="this.onerror=null;this.src='${fallbackImage()}'"
        >

        <div class="play">▶</div>
        <div class="hd">HD</div>

      </div>

      <div class="info">

        <div class="title">
          ${title}
        </div>

        <div class="meta">

          <span class="category">
            ${category}
          </span>

          <span>
            ${views} views
          </span>

        </div>

        <div class="meta">

          <span>
            ${timeAgo(video.created_at)}
          </span>

        </div>

      </div>

    </div>
  `;
}

window.openVideo = function(id){

  location.href =
    "video.html?id=" +
    encodeURIComponent(
      decodeURIComponent(id)
    );
};

async function loadVideos(){

  const videosBox =
    document.getElementById("videos");

  const message =
    document.getElementById("message");

  const pagination =
    document.getElementById("pagination");

  /*
    Pehle total published videos count.
  */

  const { count, error:countError } =
    await supabase
      .from("videos")
      .select("id", {
        count:"exact",
        head:true
      })
      .eq("published", true);

  if(countError){

    console.error(countError);

    message.textContent =
      "Failed to load videos.";

    return;
  }

  const total =
    count || 0;

  if(total === 0){

    message.textContent =
      "No videos available.";

    return;
  }

  const totalPages =
    Math.ceil(total / PER_PAGE);

  if(currentPage > totalPages){

    location.href =
      "trending.html?page=1";

    return;
  }

  /*
    Trending ke liye published videos
    ko recent + views ke basis par
    client side score diya ja raha hai.
  */

  const { data, error } =
    await supabase
      .from("videos")
      .select(`
        id,
        title,
        category,
        description,
        thumbnail_url,
        video_url,
        views,
        created_at
      `)
      .eq("published", true)
      .order("created_at", {
        ascending:false
      })
      .limit(500);

  if(error){

    console.error(error);

    message.textContent =
      "Failed to load trending videos.";

    return;
  }

  /*
    Trending Score:
    
    - Views important hain
    - Recent videos ko extra boost
    - Bahut purane video automatically
      neeche chale jayenge
  */

  const scored =
    (data || []).map(video => {

      const views =
        Number(video.views || 0);

      const created =
        new Date(video.created_at).getTime();

      const ageDays =
        Math.max(
          0.5,
          (Date.now() - created) /
          86400000
        );

      /*
        First 30 days:
        recent videos ko stronger boost
      */

      const recencyBoost =
        1 +
        Math.max(
          0,
          30 - ageDays
        ) / 30;

      /*
        Log views use karne se
        1 very-old viral video
        sab recent videos ko destroy
        nahi karega.
      */

      const viewScore =
        Math.log10(views + 10);

      const score =
        viewScore * recencyBoost;

      return {
        ...video,
        trendingScore:score
      };
    });

  scored.sort((a,b) => {

    if(
      b.trendingScore !==
      a.trendingScore
    ){
      return (
        b.trendingScore -
        a.trendingScore
      );
    }

    return (
      new Date(b.created_at) -
      new Date(a.created_at)
    );
  });

  /*
    Pagination
  */

  const from =
    (currentPage - 1) * PER_PAGE;

  const pageVideos =
    scored.slice(
      from,
      from + PER_PAGE
    );

  if(pageVideos.length === 0){

    location.href =
      "trending.html?page=1";

    return;
  }

  message.style.display = "none";

  videosBox.innerHTML =
    pageVideos
      .map(videoCard)
      .join("");

  /*
    Pagination UI
  */

  pagination.innerHTML = "";

  if(totalPages <= 1) return;

  const previous =
    document.createElement("button");

  previous.textContent = "Previous";

  previous.disabled =
    currentPage <= 1;

  previous.onclick = () => {

    if(currentPage > 1){

      location.href =
        "trending.html?page=" +
        (currentPage - 1);
    }
  };

  pagination.appendChild(previous);

  let start =
    Math.max(
      1,
      currentPage - 2
    );

  let end =
    Math.min(
      totalPages,
      start + 4
    );

  if(end - start < 4){

    start =
      Math.max(
        1,
        end - 4
      );
  }

  for(
    let i=start;
    i<=end;
    i++
  ){

    const button =
      document.createElement("button");

    button.textContent = i;

    if(i === currentPage){

      button.classList.add("active");
    }

    button.onclick = () => {

      location.href =
        "trending.html?page=" + i;
    };

    pagination.appendChild(button);
  }

  const next =
    document.createElement("button");

  next.textContent = "Next";

  next.disabled =
    currentPage >= totalPages;

  next.onclick = () => {

    if(currentPage < totalPages){

      location.href =
        "trending.html?page=" +
        (currentPage + 1);
    }
  };

  pagination.appendChild(next);
}

loadVideos();

</script>

</body>
</html>
