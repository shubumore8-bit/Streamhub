<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trending Videos - DesiVexa</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

.app{
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:auto;
  background:#080808;
}

header{
  height:65px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b0b0b;
  border-bottom:1px solid #242424;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  color:#fff;
  font-size:24px;
  font-weight:900;
  text-decoration:none;
}

.logo span{
  color:#ff1744;
}

.back,
.profile{
  color:#fff;
  text-decoration:none;
  font-size:24px;
}

.ad{
  margin:10px 12px;
  min-height:55px;
  border:1px solid #292929;
  border-radius:9px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:11px;
}

.section{
  padding:0 12px;
  margin:22px 0;
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.title h1{
  font-size:22px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.video-card{
  text-decoration:none;
  color:#fff;
  min-width:0;
  overflow:hidden;
}

.thumbnail{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:8px;
  overflow:hidden;
  background:#171717;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.duration{
  position:absolute;
  z-index:3;
  right:4px;
  bottom:4px;
  background:#000;
  padding:3px 5px;
  font-size:9px;
  border-radius:3px;
}

.video-title{
  margin:6px 2px 4px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tag{
  display:inline-block;
  background:#ff1744;
  padding:3px 7px;
  border-radius:8px;
  font-size:8px;
}

.info{
  color:#888;
  font-size:9px;
  line-height:15px;
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  padding:35px 10px;
  text-align:center;
  color:#888;
}

.error{
  color:#ff7777;
}

.random{
  margin-top:30px;
}

.random-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
}

.pagination{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  padding:10px 12px 30px;
}

.page{
  min-width:38px;
  height:36px;
  border:1px solid #303030;
  background:#151515;
  color:#fff;
  border-radius:7px;
  cursor:pointer;
}

.page.active{
  background:#ff1744;
  border-color:#ff1744;
}

.page:disabled{
  opacity:.4;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(10,10,10,.98);
  border-top:1px solid #292929;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:100;
}

.nav{
  color:#777;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
}

.nav-icon{
  font-size:20px;
}

.nav.active{
  color:#ff1744;
}

@media(max-width:600px){

  .video-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:9px;
  }

  .video-title{
    font-size:10px;
  }

  .info{
    font-size:8px;
  }

  .random-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:390px){

  .video-grid{
    gap:7px;
  }

  .random-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .video-title{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

<a href="index.html" class="back">‹</a>

<a href="index.html" class="logo">
Desi<span>Vexa</span>
</a>

<a href="profile.html" class="profile">👤</a>

</header>


<div class="ad">
Top Banner Ad
</div>


<section class="section">

<div class="title">
<h1>🔥 Trending Videos</h1>
</div>

<div
id="trending"
class="video-grid">

<div class="loading">
Loading trending videos...
</div>

</div>

</section>


<section class="section random">

<div class="title">
<h1>🎲 Random Videos</h1>
</div>

<div
id="random"
class="random-grid">

<div class="loading">
Loading random videos...
</div>

</div>

</section>


<div
id="pagination"
class="pagination">
</div>


<nav class="bottom-nav">

<a href="index.html" class="nav">
<span class="nav-icon">⌂</span>
Home
</a>

<a href="new.html" class="nav">
<span class="nav-icon">◷</span>
Latest
</a>

<a href="trending.html" class="nav active">
<span class="nav-icon">🔥</span>
Trending
</a>

<a href="recommended.html" class="nav">
<span class="nav-icon">★</span>
Recommended
</a>

<a href="profile.html" class="nav">
<span class="nav-icon">♙</span>
Profile
</a>

</nav>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
 IMPORTANT:
 app.js mein jo SAME Supabase URL
 aur ANON KEY hai, wahi yahan paste karo.
*/

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
  "YOUR_SUPABASE_ANON_KEY";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const trendingBox =
  document.getElementById("trending");

const randomBox =
  document.getElementById("random");

const paginationBox =
  document.getElementById("pagination");


let currentPage = 1;

const perPage = 30;


/* -------------------------
   TRENDING
------------------------- */

async function loadTrending(){

  trendingBox.innerHTML =
    `<div class="loading">
       Loading trending videos...
     </div>`;


  /*
    views ke basis par trending.
    Agar views column nahi hai,
    neeche error dikhega.
  */

  const {
    data,
    error
  } = await supabase

    .from("videos")

    .select("*")

    .order(
      "views",
      {
        ascending:false,
        nullsFirst:false
      }
    )

    .limit(30);


  if(error){

    console.error(error);

    trendingBox.innerHTML =
      `<div class="error">
        Could not load trending videos.<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    trendingBox.innerHTML =
      `<div class="empty">
        No trending videos found.
      </div>`;

    return;
  }


  renderVideos(
    trendingBox,
    data,
    "Trending"
  );

}


/* -------------------------
   RANDOM
------------------------- */

async function loadRandom(){

  randomBox.innerHTML =
    `<div class="loading">
       Loading random videos...
     </div>`;


  /*
    Database se videos lekar
    client side shuffle.
  */

  const {
    data,
    error
  } = await supabase

    .from("videos")

    .select("*")

    .limit(150);


  if(error){

    console.error(error);

    randomBox.innerHTML =
      `<div class="error">
        Could not load random videos.<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    randomBox.innerHTML =
      `<div class="empty">
        No videos found.
      </div>`;

    paginationBox.innerHTML = "";

    return;
  }


  shuffle(data);

  window.randomVideos = data;

  renderRandom();

}


/* -------------------------
   RENDER RANDOM
------------------------- */

function renderRandom(){

  const videos =
    window.randomVideos || [];


  const start =
    (currentPage - 1) * perPage;


  const pageVideos =
    videos.slice(
      start,
      start + perPage
    );


  renderVideos(
    randomBox,
    pageVideos,
    "Random"
  );


  renderPagination(
    videos.length
  );

}


/* -------------------------
   VIDEO CARDS
------------------------- */

function renderVideos(
  box,
  videos,
  label
){

  box.innerHTML = videos.map(
    video => {

      /*
        THIS IS THE IMPORTANT FIX.

        Real Supabase UUID is used.
        No 1, 100, 500 etc.
      */

      const id =
        encodeURIComponent(
          video.id
        );


      const title =
        escapeHtml(
          video.title ||
          "Untitled Video"
        );


      const category =
        escapeHtml(
          video.category ||
          "Video"
        );


      const thumbnail =
        video.thumbnail_url ||
        video.thumbnail ||
        "";


      const duration =
        video.duration ||
        "";


      const views =
        formatViews(
          video.views
        );


      return `

<a
  href="video.html?id=${id}"
  class="video-card"
>

<div class="thumbnail">

${
thumbnail
?
`
<img
src="${escapeAttr(thumbnail)}"
alt="${title}"
loading="lazy">
`
:
""
}

<div class="play">
▶
</div>

${
duration
?
`
<div class="duration">
${escapeHtml(duration)}
</div>
`
:
""
}

</div>


<div class="video-title">
${title}
</div>


<span class="tag">
${category}
</span>


<div class="info">

👁 ${views} views

<br>

◷ ${label}

</div>

</a>

`;

    }
  ).join("");

}


/* -------------------------
   PAGINATION
------------------------- */

function renderPagination(total){

  const pages =
    Math.max(
      1,
      Math.ceil(
        total / perPage
      )
    );


  paginationBox.innerHTML = "";


  if(pages <= 1){
    return;
  }


  const previous =
    document.createElement(
      "button"
    );

  previous.className = "page";

  previous.textContent =
    "‹";

  previous.disabled =
    currentPage === 1;

  previous.onclick = () => {

    if(currentPage > 1){

      currentPage--;

      renderRandom();

      scrollRandom();

    }

  };

  paginationBox.appendChild(
    previous
  );


  const maxPages =
    Math.min(
      pages,
      10
    );


  for(
    let i = 1;
    i <= maxPages;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "page";

    button.textContent =
      i;


    if(i === currentPage){

      button.classList.add(
        "active"
      );

    }


    button.onclick = () => {

      currentPage = i;

      renderRandom();

      scrollRandom();

    };


    paginationBox.appendChild(
      button
    );

  }


  const next =
    document.createElement(
      "button"
    );

  next.className = "page";

  next.textContent =
    "›";

  next.disabled =
    currentPage === pages;

  next.onclick = () => {

    if(currentPage < pages){

      currentPage++;

      renderRandom();

      scrollRandom();

    }

  };

  paginationBox.appendChild(
    next
  );

}


/* -------------------------
   HELPERS
------------------------- */

function shuffle(array){

  for(
    let i = array.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


function scrollRandom(){

  document
    .getElementById("random")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function formatViews(value){

  const number =
    Number(value) || 0;


  if(number >= 1000000){

    return (
      number / 1000000
    ).toFixed(1) + "M";

  }


  if(number >= 1000){

    return (
      number / 1000
    ).toFixed(1) + "K";

  }


  return String(number);

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


/* START */

loadTrending();

loadRandom();

</script>

</body>
</html>
